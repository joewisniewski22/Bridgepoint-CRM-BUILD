<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>62</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="62">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF0F2; --panel:#FFFFFF; --panel2:#E3E6EA; --ink:#15171A; --muted:#5B636D; --line:#CDD2D8;
  --plate:#FF6600; --plate-ink:#0D0D0D; --good:#1E9E5A; --bad:#C23B2E; --accent-soft:#FFE0CC;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D; --panel:#1A1A1A; --panel2:#262626; --ink:#F1F2F3; --muted:#9AA2AC; --line:#33383F;
    --accent-soft:#3D1D08; --good:#3DD07F; --bad:#FF6B5A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --panel:#1A1A1A; --panel2:#262626; --ink:#F1F2F3; --muted:#9AA2AC; --line:#33383F;
  --accent-soft:#3D1D08; --good:#3DD07F; --bad:#FF6B5A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1{font-size:34px;line-height:1} h2{font-size:24px} h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.plate{background:var(--plate);color:var(--plate-ink);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;padding:6px 12px 4px;border-radius:9px;letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--plate);color:var(--plate-ink);border-color:transparent;font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.btn.sm{min-height:38px;padding:7px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],input[type=email],input[type=time],input[type=date],textarea,select{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--plate);outline-offset:1px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;background:none;border:0;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page] svg{stroke:var(--ink)}
.tabs button[aria-current=page]::before{content:"";width:34px;height:4px;border-radius:2px;background:var(--plate);position:absolute;margin-top:-10px}
.check{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px}
.check:last-child{border-bottom:0}
.box{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg)}
.box.on{background:var(--plate);border-color:var(--plate)}
.box svg{width:20px;height:20px;stroke:var(--plate-ink);stroke-width:3;fill:none;opacity:0}
.box.on svg{opacity:1}
.due{color:var(--bad);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--accent-soft);font-size:13px;font-weight:600}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.sets .hd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets input{text-align:center;font-family:var(--display);font-size:24px;font-weight:700;padding:6px}
.setn{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.done{height:46px;border-radius:11px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center}
.done.on{background:var(--good);border-color:var(--good)}
.done svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.done.on svg{opacity:1}
.exchk{width:52px;flex:none}
.card.exdone{border-color:var(--good)}
.tset{padding:8px 0;border-top:1px solid var(--line)}
.tset:first-of-type{border-top:0}
.tset .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tset .top .lbl{font-weight:600}
.tkrow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tk{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;min-width:104px;font-variant-numeric:tabular-nums}
.restbar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--plate);color:var(--plate-ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.restbar .t{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;min-width:92px;font-variant-numeric:tabular-nums}
.restbar .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.restbar button{background:rgba(0,0,0,.14);border:0;border-radius:10px;padding:10px 12px;font-weight:700;color:var(--plate-ink);min-height:44px}
.restbar.over{background:var(--good);color:#fff}
.restbar.over button{color:#fff;background:rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:60;font-weight:600}
.stat{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.chart{width:100%;height:120px}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:none}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro b{font-family:var(--display);font-size:24px;display:block}
.macro span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (prefers-reduced-motion:no-preference){.btn,.box,.done{transition:transform .08s ease}.btn:active,.box:active,.done:active{transform:scale(.96)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------- config ----------
   api/key stay empty until the 62 backend exists. Everything except the AI features
   (reading a coach's PDF/Word file, analyzing a plate photo) works without it. */
var CFG = { api: "https://rdbzxpmwqyeddkwhoqie.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkYnp4cG13cXllZGRrd2hvcWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Mzc1MTcsImV4cCI6MjEwNzMxMzUxN30._bR-bLe6nVn9Qbs7Ysxxc2wgQW542qBmgtTjESxWUFY" };
var cloud = { client:null, session:null, needLogin:false, recovery:false, inbox:[], status:"", pushTimer:null };

var KEY = "app62.v1";
var DEFAULT_HABITS = [
  { id:"teeth-am", name:"Brush teeth (morning)", time:"07:15" },
  { id:"water-am", name:"Big glass of water", time:"07:20" },
  { id:"breakfast", name:"Breakfast with protein", time:"07:45" },
  { id:"mobility", name:"10 min stretch / mobility", time:"17:30" },
  { id:"teeth-pm", name:"Brush teeth (night)", time:"20:45" },
  { id:"bed", name:"Phone away, lights out", time:"21:30" }
];
function defaults(){
  return { programs:[], sessions:[], active:null, habits:DEFAULT_HABITS, habitLog:{}, weights:[], hr:[], meals:[],
           settings:{ name:"Declan", trainerEmail:"robb@coachrobb.com", trainerName:"Coach Robb", heightIn:null, momName:"Mom", momEmail:"nicbodt@gmail.com", allergies:"", dislikes:"", rideDays:3, maxHr:200 }, lastExport:null, mealPlan:null, injury:{ active:true, area:"shoulder", note:"Surgery is planned. Doctor: strengthening the rotator cuff and the muscles around it before surgery is fine, and riding can restart once shoulder strength is back.", since:null, rideClear:false }, rehab:[], wellness:{}, rides:[], rehabLog:{}, mobLog:{}, mindLog:{}, bikes:defaultBikes(), plan:{ days:{} }, tracks:[] };
}
var S = load();
function load(){
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if (s){ var d = defaults(); for (var k in d) if (!(k in s)) s[k] = d[k]; s.settings = s.settings || d.settings; if (!s.settings.trainerEmail) s.settings.trainerEmail = d.settings.trainerEmail; if (!s.settings.momEmail) s.settings.momEmail = d.settings.momEmail; return s; } }catch(e){}
  return defaults();
}
function save(){ S._updatedAt = new Date().toISOString(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Storage is full — export your logs"); } queuePush(); }

/* ---------- helpers ---------- */
function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  (kids || []).forEach(function(c){ if (c == null) return; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function icon(inner){ var s = el("span"); s.innerHTML = inner; return s.firstChild; }
function t12(hhmm){ var p = String(hhmm || "").split(":"), h = parseInt(p[0], 10); if (isNaN(h)) return hhmm; return ((h % 12) || 12) + ":" + (p[1] || "00") + (h >= 12 ? " PM" : " AM"); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function dstr(d){ d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function today(){ return dstr(); }
function fmtDay(s){ var d = new Date(s + "T12:00:00"); return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function toast(msg){ var t = el("div", { class:"toast", text:msg }); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2400); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ":" + pad(sec%60); }

/* ---------- navigation ---------- */
var tab = "today";
var TABS = [
  ["today","Today",'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>'],
  ["train","Train",'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>'],
  ["food","Fuel",'<svg viewBox="0 0 24 24"><path d="M5 11h14a7 7 0 0 1-7 7 7 7 0 0 1-7-7zM9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>'],
  ["ride","Ride",'<svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9L8.5 6.5"/></svg>'],
  ["body","Body",'<svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg>']
];
function go(t){ tab = t; render(); window.scrollTo(0, 0); }

function render(){
  var root = document.getElementById("app");
  root.textContent = "";
  if (S.plan && S.plan.plan){ if (!S.mealPlan) S.mealPlan = S.plan; S.plan = { days:{} }; save(); }
  if (S.mealPlan === undefined) S.mealPlan = null;
  if (cloud.recovery){ root.appendChild(viewReset()); return; }
  if (cloud.needLogin){ root.appendChild(viewLogin()); return; }
  var view;
  try { view = tab === "train" ? viewTrain() : tab === "food" ? viewFood() : tab === "ride" ? viewRide() : tab === "body" ? viewBody() : viewToday(); }
  catch(err){ view = el("div", { class:"wrap" }, [header("62", ""), el("div", { class:"card" }, [el("b", { text:"This screen hit a problem." }), el("div", { class:"small muted", style:"margin-top:6px", text:String(err && err.message || err) })])]); }
  root.appendChild(view);
  var bar = el("nav", { class:"tabs", "aria-label":"Main" }, TABS.map(function(t){
    var b = el("button", { type:"button", "aria-current": tab === t[0] ? "page" : null, onclick:function(){ go(t[0]); } }, [icon(t[2]), t[1]]);
    return b;
  }));
  root.appendChild(bar);
  if (rest.end) root.appendChild(restBarEl());
}
function header(title, sub){
  return el("div", { class:"top" }, [
    el("div", { class:"plate", text:"62" }),
    el("div", { class:"grow" }, [el("h1", { text:title }), sub ? el("div", { class:"sub", text:sub }) : null]),
    el("button", { class:"btn sm ghost", type:"button", "aria-label":"Settings", onclick:openSettings, text:"⚙" })
  ]);
}

/* ---------- TODAY ---------- */
function dueNow(h){ var n = new Date(); return (pad(n.getHours()) + ":" + pad(n.getMinutes())) >= h.time; }
function streakFor(h){
  var n = 0, d = new Date();
  var t = dstr(d);
  if (!(S.habitLog[t] && S.habitLog[t][h.id])) d.setDate(d.getDate() - 1);
  for (var i = 0; i < 400; i++){ var k = dstr(d); if (S.habitLog[k] && S.habitLog[k][h.id]){ n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function viewToday(){
  var t = today(), log = S.habitLog[t] || {};
  var done = S.habits.filter(function(h){ return log[h.id]; }).length;
  var w = el("div", { class:"wrap" });
  var hr = new Date().getHours();
  w.appendChild(header((hr < 12 ? "Morning" : hr < 18 ? "Afternoon" : "Evening") + ", " + S.settings.name, fmtDay(t)));
  w.appendChild(todayPlanCard());
  w.appendChild(morningCard());
  w.appendChild(mindsetCard());
  w.appendChild(mobilityCard());
  w.appendChild(shoulderCard());
  if (S.injury && S.injury.active) w.appendChild(injuryCard());
  var tdPlan = planDay(today());
  if (!(tdPlan && tdPlan.type) || S.rides.some(function(e){ return e.date === today(); })) w.appendChild(todayEventsCard());
  var card = el("div", { class:"card" }, [
    el("div", { class:"row between" }, [el("h2", { text:"Daily checklist" }), el("span", { class:"pill", text: done + " / " + S.habits.length })])
  ]);
  S.habits.forEach(function(h){
    var on = !!log[h.id], late = !on && dueNow(h);
    var st = streakFor(h);
    card.appendChild(el("div", { class:"check", role:"checkbox", "aria-checked": on ? "true" : "false", tabindex:"0",
      onclick:function(){ toggleHabit(h.id); },
      onkeydown:function(e){ if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggleHabit(h.id); } } }, [
      el("div", { class:"box" + (on ? " on" : "") }, [icon(CHECK)]),
      el("div", { class:"grow" }, [
        el("div", { text:h.name, style: on ? "text-decoration:line-through;opacity:.6" : "" }),
        el("div", { class:"small " + (late ? "due" : "muted"), text: late ? "Due since " + t12(h.time) : t12(h.time) + (st > 1 ? "  ·  " + st + " day streak" : "") })
      ])
    ]));
  });
  w.appendChild(card);

  var wt = S.weights.filter(function(x){ return x.date === t; })[0];
  if (false) w.appendChild(el("div", { class:"card flat row between" }, [
    el("div", { class:"grow", text:"No weigh-in logged today" }),
    el("button", { class:"btn sm", type:"button", onclick:function(){ go("body"); }, text:"Log it" })
  ]));
  var td = S.sessions.filter(function(s){ return s.date === t; });
  w.appendChild(el("div", { class:"card" }, [
    el("h3", { text:"Training" }),
    el("div", { class:"muted", text: td.length ? td.length + " session logged today. Nice." : (S.active ? "Workout in progress." : "Nothing logged yet today.") }),
    el("div", { style:"margin-top:10px" }, [el("button", { class:"btn primary block", type:"button", onclick:function(){ go("train"); }, text: S.active ? "Back to workout" : "Start training" })])
  ]));
  w.appendChild(suggestCard());
  return w;
}
function toggleHabit(id){
  var t = today(); S.habitLog[t] = S.habitLog[t] || {};
  S.habitLog[t][id] = !S.habitLog[t][id];
  save(); render();
}

/* ---------- injury / modified training ---------- */
function ridingOnHold(){ return !!(S.injury && S.injury.active && !S.injury.rideClear); }
function holdBanner(){
  return el("div", { class:"card", style:"border-color:#c0392b" }, [
    el("h3", { text:"Riding is on hold" }),
    el("div", { class:"small", text:"Your doctor said riding can start again once your shoulder strength is back. Until then, do your shoulder routine and the gym work. Your mom or dad switches this in Settings when the doctor says you are cleared." })
  ]);
}
function rehabRecent(n){ return (S.rehab || []).slice(-n); }
function injuryBanner(){
  var inj = S.injury || {};
  return el("div", { class:"card", style:"border-color:var(--accent,#FF6600)" }, [
    el("div", { class:"row between" }, [el("h3", { text:"Modified training" }), el("span", { class:"pill", text: inj.area || "injury" })]),
    el("div", { class:"small muted", text:"Follow what your doctor, physical therapist and " + S.settings.trainerName + " say. Skip anything that hurts or loads the injured area. A skipped exercise is logged as skipped, not missed." + (inj.note ? " Notes: " + inj.note : "") })
  ]);
}
function injuryCard(){
  var t = today(), inj = S.injury || {};
  var cur = (S.rehab || []).filter(function(x){ return x.date === t; })[0] || { date:t, pain:0, did:false, note:"" };
  var didOn = !!cur.did;
  var pain = el("input", { type:"range", min:"0", max:"10", step:"1", value:String(cur.pain || 0), "aria-label":"Pain today, 0 to 10" });
  var out = el("b", { text:String(cur.pain || 0) + " / 10" });
  pain.addEventListener("input", function(){ out.textContent = pain.value + " / 10"; });
  var box = el("div", { class:"box" + (didOn ? " on" : "") }, [icon(CHECK)]);
  var did = el("div", { class:"check", role:"checkbox", "aria-checked": didOn ? "true" : "false", tabindex:"0", onclick:function(){ didOn = !didOn; box.className = "box" + (didOn ? " on" : ""); did.setAttribute("aria-checked", didOn ? "true" : "false"); } }, [box, el("div", { class:"grow", text:"Did my rehab work today" })]);
  var note = el("input", { type:"text", value:cur.note || "", placeholder:"How does it feel? Anything new?" });
  var recent = rehabRecent(7);
  var c = el("div", { class:"card" }, [
    el("div", { class:"row between" }, [el("h2", { text:"Recovery check-in" }), el("span", { class:"pill", text: inj.area || "injury" })]),
    el("div", { class:"small muted", text:"Modified training until your doctor and coach clear you." + (inj.since ? " Since " + fmtDay(inj.since) + "." : "") }),
    el("div", { class:"field", style:"margin-top:10px" }, [el("label", { text:"Pain right now (0 = none, 10 = worst)" }), el("div", { class:"row between" }, [pain, out])]),
    did,
    el("div", { class:"field" }, [el("label", { text:"Notes" }), note]),
    el("button", { class:"btn primary block", type:"button", text:"Save check-in", onclick:function(){

  var s = el("div", { class:"chart" });
  var last = pts[pts.length - 1];
  s.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" role="img" aria-label="Trend chart"><path d="' + d + ' L' + last[0] + ' ' + (H - p) + ' L' + pts[0][0] + ' ' + (H - p) + ' Z" fill="var(--accent-soft)"/>' +

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error("offline")); };
    document.head.appendChild(s);
  });
}
function initCloud(){
  if (!window.supabase){
    return loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js").then(initCloud, function(){ cloud.status = "offline"; });
  }
  cloud.client = window.supabase.createClient(CFG.api, CFG.key, { auth:{ persistSession:true, autoRefreshToken:true } });
  // the reset link in the email opens the app and lands here
  cloud.client.auth.onAuthStateChange(function(ev, session){
    if (ev === "PASSWORD_RECOVERY"){ cloud.session = session; cloud.recovery = true; cloud.needLogin = false; render(); }
  });
  return cloud.client.auth.getSession().then(function(r){
    cloud.session = r.data && r.data.session;
    if (!cloud.session){ cloud.needLogin = navigator.onLine; render(); return; }
    return afterLogin();
  }).catch(function(){ render(); });
}
function afterLogin(){
  cloud.needLogin = false;
  return pullState().then(loadInbox).then(loadAlerts).then(function(){ render(); });
}
function pullState(){
  return cloud.client.from("app_state").select("data,updated_at").eq("user_id", cloud.session.user.id).maybeSingle().then(function(r){
    if (r.error || !r.data) { queuePush(); return; }
    var remote = r.data.data || {}, rt = remote._updatedAt || r.data.updated_at;
    // newest copy wins; a fresh phone (nothing logged) always takes the cloud copy
    var localEmpty = !S.sessions.length && !S.programs.length && !S.weights.length && !S.meals.length;
    if (localEmpty || (rt && (!S._updatedAt || rt > S._updatedAt))){
      var d = defaults(); for (var k in d) if (!(k in remote)) remote[k] = d[k];
      S = remote; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    } else if (S._updatedAt && (!rt || S._updatedAt > rt)) queuePush();
  });
}
function queuePush(){
  if (!cloud.client || !cloud.session) return;
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(pushNow, 1500);
}
function pushNow(){
  if (!cloud.client || !cloud.session || !navigator.onLine) return;
  cloud.client.from("app_state").upsert({ user_id:cloud.session.user.id, data:S, updated_at:new Date().toISOString() }).then(function(r){
    cloud.status = r.error ? "sync problem" : "backed up " + new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  });
}
function loadInbox(){
  return cloud.client.from("programs_inbox").select("*").eq("user_id", cloud.session.user.id).in("status", ["new","failed"]).order("received_at", { ascending:false }).then(function(r){
    cloud.inbox = r.data || [];
    // A program the coach emailed that was read successfully goes straight into the app (Joe 2026-10-12: no extra tap).
    var fresh = cloud.inbox.filter(function(x){ return x.status === "new" && x.program; }), added = 0;
    fresh.forEach(function(it){
      if (S.programs.some(function(x){ return x.inboxId === it.id; })) return;
      var p = it.program; p.id = p.id || uid(); p.inboxId = it.id; p.fromCoach = true; p.addedAt = today();
      S.programs.unshift(p); added++;
      cloud.client.from("programs_inbox").update({ status:"accepted" }).eq("id", it.id).then(function(){});
    });
    cloud.inbox = cloud.inbox.filter(function(x){ return !(x.status === "new" && x.program); });
    if (added){ save(); toast(added === 1 ? "New program from " + S.settings.trainerName + " added" : added + " new programs added"); render(); }
  });
}
function acceptInbox(item){
  var p = item.program; if (!p) return;
  S.programs.push(p); save();
  cloud.client.from("programs_inbox").update({ status:"accepted" }).eq("id", item.id).then(function(){});
  cloud.inbox = cloud.inbox.filter(function(x){ return x.id !== item.id; });
  toast("Program added"); render();
}
function dismissInbox(item){
  cloud.client.from("programs_inbox").update({ status:"dismissed" }).eq("id", item.id).then(function(){});
  cloud.inbox = cloud.inbox.filter(function(x){ return x.id !== item.id; }); render();
}
function inboxCards(){
  return cloud.inbox.map(function(it){
    if (it.status === "failed") return el("div", { class:"card" }, [
      el("div", { class:"row between" }, [el("h3", { text:"Couldn't read an email from " + (it.from_email || "coach") }), el("button", { class:"btn sm ghost", type:"button", text:"Dismiss", onclick:function(){ dismissInbox(it); } })]),
      el("div", { class:"small muted", text:(it.file_name ? it.file_name + " — " : "") + (it.error || "Unknown problem") + ". You can add it with \"+ Add a program\" instead." })
    ]);
    var days = (it.program.days || []).length;
    return el("div", { class:"card", style:"border-color:var(--plate)" }, [
      el("span", { class:"pill", text:"New from your coach" }),
      el("h2", { style:"margin-top:8px", text:it.program.name || it.subject || "New program" }),
      el("div", { class:"small muted", text:days + " workout day" + (days === 1 ? "" : "s") + (it.file_name ? " · " + it.file_name : "") }),
      el("div", { class:"row", style:"margin-top:10px" }, [
        el("button", { class:"btn grow", type:"button", text:"Not now", onclick:function(){ dismissInbox(it); } }),
        el("button", { class:"btn primary grow", type:"button", text:"Add it", onclick:function(){ acceptInbox(it); } })
      ])
    ]);
  });
}
function viewLogin(){
  var em = el("input", { type:"email", autocomplete:"username", autocapitalize:"off", placeholder:"Email", value:"" });
  var pw = el("input", { type:"password", autocomplete:"current-password", placeholder:"Password" });
  var msg = el("div", { class:"small due" });
  var go = function(){
    msg.textContent = "Signing in…";
    cloud.client.auth.signInWithPassword({ email:em.value.trim(), password:pw.value }).then(function(r){
      if (r.error){ msg.textContent = "That email or password didn't work."; return; }
      cloud.session = r.data.session; afterLogin();
    });
  };
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  return el("div", { class:"wrap", style:"padding-top:60px" }, [
    el("div", { class:"top" }, [el("div", { class:"plate", text:"62" }), el("div", { class:"grow" }, [el("h1", { text:"Sign in" }), el("div", { class:"sub", text:"One time on this phone" })])]),
    el("div", { class:"card" }, [
      el("div", { class:"field" }, [el("label", { text:"Email" }), em]),
      el("div", { class:"field", style:"margin-top:10px" }, [el("label", { text:"Password" }), pw]),
      msg,
      el("button", { class:"btn primary block", style:"margin-top:12px", type:"button", text:"Sign in", onclick:go }),
      el("button", { class:"btn block ghost", style:"margin-top:8px", type:"button", text:"Forgot password?", onclick:function(){
        var addr = em.value.trim();
        if (!addr){ msg.textContent = "Type your email above first."; return; }
        msg.className = "small muted"; msg.textContent = "Sending…";
        cloud.client.auth.resetPasswordForEmail(addr, { redirectTo: location.origin + location.pathname }).then(function(r){
          msg.className = r.error ? "small due" : "small muted";
          msg.textContent = r.error ? "Couldn't send that right now. Ask Dad to reset it." : "If that email has an account, a reset link is on its way. Check spam too.";
        });
      } })
    ])
  ]);
}
function viewReset(){
  var a = el("input", { type:"password", autocomplete:"new-password", placeholder:"New password (6+ characters)" });
  var b = el("input", { type:"password", autocomplete:"new-password", placeholder:"Type it again" });
  var msg = el("div", { class:"small due" });
  return el("div", { class:"wrap", style:"padding-top:60px" }, [
    el("div", { class:"top" }, [el("div", { class:"plate", text:"62" }), el("div", { class:"grow" }, [el("h1", { text:"New password" })])]),
    el("div", { class:"card" }, [
      el("div", { class:"field" }, [el("label", { text:"New password" }), a]),
      el("div", { class:"field", style:"margin-top:10px" }, [el("label", { text:"Again" }), b]),
      msg,
      el("button", { class:"btn primary block", style:"margin-top:12px", type:"button", text:"Save password", onclick:function(){
        if (a.value.length < 6){ msg.textContent = "Use at least 6 characters."; return; }
        if (a.value !== b.value){ msg.textContent = "Those don't match."; return; }
        cloud.client.auth.updateUser({ password:a.value }).then(function(r){
          if (r.error){ msg.textContent = r.error.message; return; }
          cloud.recovery = false; toast("Password changed"); afterLogin();
        });
      } })
    ])
  ]);
}

/* ---------- boot ---------- */
if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && S.active) keepAwake(true);
  if (!document.hidden && rest.end) tickRest();
  if (document.hidden) pushNow();
  else if (cloud.session) { loadAlerts().then(function(){ render(); }); loadInbox().then(function(){ if (tab === "train" && !S.active) render(); }); }
});
window.addEventListener("online", function(){ if (cloud.session) pushNow(); else initCloud(); });
render();
initCloud();
})();
</script>
</body>
