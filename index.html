<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridgepoint Lending Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------
   Bridgepoint Lending Desk — design tokens
--------------------------------------------------------------------- */
:root{
  --bg:#faf7f0;
  --surface:#ffffff;
  --surface-2:#f2ede1;
  --border:#e2dbc9;
  --border-soft:#ece6d7;
  --ink:#1c1a15;
  --ink-muted:#726b5a;
  --ink-faint:#9b937e;

  --navy:#1b2a47;
  --brand:#1b2a47;
  --brand-strong:#10192c;
  --brand-tint:#e8ebf1;
  --brand-ink:#ffffff;

  --c-forest:#2f5d43;      --c-forest-bg:#e3ede4;
  --c-gold:#a9812e;        --c-gold-bg:#f5ead0;
  --c-rust:#9c3f2c;        --c-rust-bg:#f3e0d8;
  --c-slate:#3b5166;       --c-slate-bg:#e2e9ef;
  --c-neutral:#5c5748;     --c-neutral-bg:#e9e4d6;

  --danger:#9c3f2c;
  --danger-bg:#f3e0d8;

  --font-display:'Fraunces', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --shadow-card:0 1px 2px rgba(28,26,21,.06), 0 1px 1px rgba(28,26,21,.04);
  --shadow-modal:0 20px 60px rgba(20,18,14,.35);
  --radius:10px;
  --radius-sm:7px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171613;
    --surface:#211f1a;
    --surface-2:#2a2721;
    --border:#3a362c;
    --border-soft:#332f27;
    --ink:#f1ede2;
    --ink-muted:#b3ab97;
    --ink-faint:#7d7666;

    --brand:#8fa8d6;
    --brand-strong:#aec2e8;
    --brand-tint:#202a3d;
    --brand-ink:#0b1220;

    --c-forest:#8fc7a2;   --c-forest-bg:#233b2b;
    --c-gold:#e0bd6d;     --c-gold-bg:#3c3320;
    --c-rust:#e29d87;     --c-rust-bg:#402a22;
    --c-slate:#a9c3da;    --c-slate-bg:#26333f;
    --c-neutral:#c9c0a9;  --c-neutral-bg:#332f27;

    --danger:#e29d87;
    --danger-bg:#402a22;

    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-modal:0 20px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#171613;
  --surface:#211f1a;
  --surface-2:#2a2721;
  --border:#3a362c;
  --border-soft:#332f27;
  --ink:#f1ede2;
  --ink-muted:#b3ab97;
  --ink-faint:#7d7666;

  --brand:#8fa8d6;
  --brand-strong:#aec2e8;
  --brand-tint:#202a3d;
  --brand-ink:#0b1220;

  --c-forest:#8fc7a2;   --c-forest-bg:#233b2b;
  --c-gold:#e0bd6d;     --c-gold-bg:#3c3320;
  --c-rust:#e29d87;     --c-rust-bg:#402a22;
  --c-slate:#a9c3da;    --c-slate-bg:#26333f;
  --c-neutral:#c9c0a9;  --c-neutral-bg:#332f27;

  --danger:#e29d87;
  --danger-bg:#402a22;

  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-modal:0 20px 60px rgba(0,0,0,.6);
}

/* ---------------------------------------------------------------------
   Base
--------------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg) !important;
  color:var(--ink) !important;
  font:14px/1.5 var(--font-body) !important;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;color:var(--ink);text-wrap:balance}
h2{font-size:16px}
h3{font-size:15px}
a{color:var(--brand)}
button{font-family:inherit}
::selection{background:var(--brand-tint)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{display:flex;min-height:100vh;align-items:stretch}

/* ---------------------------------------------------------------------
   Sidebar
--------------------------------------------------------------------- */
.sidebar{
  width:236px;flex:0 0 236px;background:var(--brand);color:var(--brand-ink);
  display:flex;flex-direction:column;padding:20px 14px;gap:18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--brand-ink);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px}
.brand-word{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.15;color:var(--brand-ink)}
.brand-tag{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--radius-sm);
  background:transparent;color:rgba(255,255,255,.78);font-size:13.5px;text-align:left;cursor:pointer;
}
.nav-item .ic{width:18px;text-align:center;flex:0 0 18px;opacity:.9}
.nav-item span:nth-child(2){flex:1}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff}
.nav-item .count{
  background:rgba(255,255,255,.9);color:var(--brand-strong);font-family:var(--font-mono);font-size:11px;
  font-weight:600;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;
}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column}
.role-box{background:rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:12px;font-size:12.5px;color:rgba(255,255,255,.85)}
.role-box b{color:#fff;font-size:13.5px}
.footnote{font-size:11px;color:rgba(255,255,255,.45);line-height:1.5}
.sidebar .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
.sidebar .btn:hover{background:rgba(255,255,255,.18)}
.sidebar .btn-ghost{background:transparent}

/* ---------------------------------------------------------------------
   Main / topbar / content
--------------------------------------------------------------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-start;gap:16px;padding:22px 28px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
}
.view-title{font-size:22px}
.view-sub{color:var(--ink-muted);font-size:13px;margin-top:3px}
.topbar-spacer{flex:1}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1320px}

/* ---------------------------------------------------------------------
   Buttons / inputs
--------------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;
  cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-faint)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger)}
.btn-danger:hover{filter:brightness(.95)}

.input,.select,.textarea{
  width:auto;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);font:13px var(--font-body);
}
.textarea{width:100%;resize:vertical;min-height:64px;font-family:var(--font-body)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.login-pin-input{letter-spacing:.3em;font-family:var(--font-mono)}

/* ---------------------------------------------------------------------
   KPIs / sections / panels
--------------------------------------------------------------------- */
.kpi-row{display:flex;gap:14px;flex-wrap:wrap}
.kpi{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-card)}
.kpi-label{font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-size:28px;font-weight:600;margin-top:4px}
.kpi-sub{font-size:12px;color:var(--ink-faint);margin-top:4px}

.section,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.section{padding:18px 20px}
.panel-pad{padding:18px 20px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hint{font-size:12px;color:var(--ink-faint)}
.empty{padding:28px;text-align:center;color:var(--ink-faint);font-size:13px}
.ai-chat-log{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding-right:4px}
.ai-msg{max-width:80%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border-soft)}
.ai-msg-role{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:3px}
.ai-msg-body{font-size:13px;line-height:1.5;white-space:pre-wrap}
.ai-msg-user{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.ai-msg-user .ai-msg-role{color:rgba(255,255,255,.7)}
.ai-msg-assistant{align-self:flex-start;background:var(--surface-2)}

/* ---------------------------------------------------------------------
   Public showcase page (Recent Closings & Stories)
--------------------------------------------------------------------- */
.showcase-page{min-height:100vh;background:var(--surface-2)}
.showcase-head{padding:56px 20px 40px;text-align:center;background:var(--navy);color:#fff}
.showcase-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}
.showcase-brand .brand-word{color:#fff}
.showcase-brand .brand-tag{color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.showcase-head h1{font-size:clamp(28px,4vw,40px);margin:0 0 10px;text-wrap:balance;color:#fff}
.showcase-head p{margin:0;color:rgba(255,255,255,.75);font-size:15px}
.showcase-wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
.showcase-grid{display:flex;flex-direction:column;gap:20px}
.showcase-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:24px 26px}
.showcase-card-meta{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:8px}
.showcase-card h2{font-size:19px;margin:0 0 10px}
.showcase-card-body{font-size:14px;line-height:1.65;color:var(--ink-muted)}
.showcase-card-body a{color:var(--brand)}

/* ---------------------------------------------------------------------
   Tables
--------------------------------------------------------------------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);
  padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-action]{cursor:pointer}
tbody tr[data-action]:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--font-mono)}
.cell-name{font-weight:500}
.cell-sub{font-size:12px;color:var(--ink-faint);margin-top:1px}

.filters{display:flex;flex-wrap:wrap;gap:8px}

/* ---------------------------------------------------------------------
   Badges
--------------------------------------------------------------------- */
.badge-wrap{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.badge-forest{background:var(--c-forest-bg);color:var(--c-forest)}
.badge-gold{background:var(--c-gold-bg);color:var(--c-gold)}
.badge-rust{background:var(--c-rust-bg);color:var(--c-rust)}
.badge-slate{background:var(--c-slate-bg);color:var(--c-slate)}
.badge-neutral{background:var(--c-neutral-bg);color:var(--c-neutral)}
.badge-hot{background:var(--c-rust-bg);color:var(--c-rust);animation:pulse-hot 1.8s ease-in-out infinite}
@keyframes pulse-hot{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.badge-hot{animation:none}}
.queue-card.type-hot{border-color:var(--c-rust)}

/* ---------------------------------------------------------------------
   Pipeline board
--------------------------------------------------------------------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 240px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em}
.col-head .n{font-weight:600;color:var(--ink-faint);text-transform:none}
.col-cards{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;overflow-y:auto}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;box-shadow:var(--shadow-card)}
.pcard:hover{border-color:var(--ink-faint)}
.pcard .nm{font-weight:600;font-size:13px}
.pcard .ty{font-size:12px;color:var(--ink-muted);margin-top:2px}
.pcard .amt{font-family:var(--font-mono);font-size:12.5px;margin-top:5px}
.pcard .lo{font-size:11.5px;color:var(--ink-faint);margin-top:3px}

/* ---------------------------------------------------------------------
   Tabs (lead detail)
--------------------------------------------------------------------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 4px;margin-right:18px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-muted);font-size:13.5px;font-weight:500;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------------------------------------------------------------------
   Lead detail layout / rail
--------------------------------------------------------------------- */
.detail-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:flex-start}
.rail-block{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
.rail-block:last-child{border-bottom:0}
.rail-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px}
.rail-name{font-family:var(--font-display);font-weight:600;font-size:17px}
.stage-line{margin-top:8px}
.contact-row{display:flex;flex-wrap:wrap;gap:6px}
.points-input-row{display:flex;align-items:center;gap:6px}
.points-input-row .input{width:80px}
.commission-box{background:var(--brand-tint);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.commission-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.commission-label{font-size:12px;color:var(--ink-muted)}
.commission-stat{font-family:var(--font-mono);font-size:18px;font-weight:600}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field{display:flex;flex-direction:column;gap:2px}
.field .rail-title{margin-bottom:0}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:12px;color:var(--ink-muted)}
.form-row .input,.form-row .select,.form-row .textarea{width:100%}
.form-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------------------------------------------------------------------
   Activity feed
--------------------------------------------------------------------- */
.activity-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.activity-item:last-child{border-bottom:0}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:0 0 7px;margin-top:6px}
.activity-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto}
.activity-text{font-size:13px;flex:1}

/* ---------------------------------------------------------------------
   Today's queue
--------------------------------------------------------------------- */
.queue-card{
  display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c-slate);
  border-radius:var(--radius-sm);padding:12px 14px;
}
.queue-card.type-rate-drop{border-left-color:var(--c-gold)}
.queue-card.type-winback{border-left-color:var(--c-rust)}
.queue-title{font-weight:600;font-size:13.5px}
.queue-reason{font-size:12.5px;color:var(--ink-muted);margin-top:2px}
.queue-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.queue-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------------------------------------------------------------------
   Documents / third parties
--------------------------------------------------------------------- */
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.doc-row:last-child{border-bottom:0}
.doc-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:8px}
.doc-preview-text{white-space:pre-wrap;font-size:12.5px;color:var(--ink-muted)}
.tp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.tp-row:last-child{border-bottom:0}
.role-box.tp-select{padding:0}
.signature{font-family:var(--font-display);font-style:italic;font-size:16px;margin-top:10px}

/* ---------------------------------------------------------------------
   Modals
--------------------------------------------------------------------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:440px;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-modal);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0}
.modal>form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}

/* ---------------------------------------------------------------------
   Login
--------------------------------------------------------------------- */
.login-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--brand);padding:20px}
.login-card{background:var(--surface);border-radius:14px;padding:32px 30px;width:100%;max-width:360px;box-shadow:var(--shadow-modal)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-title{font-size:20px;margin-top:4px}
.login-sub{font-size:12.5px;color:var(--ink-muted);margin:6px 0 18px;line-height:1.5}
.login-form{display:flex;flex-direction:column}
.login-error{background:var(--c-rust-bg);color:var(--c-rust);font-size:12.5px;padding:8px 10px;border-radius:6px;margin-top:10px}

/* ---------------------------------------------------------------------
   Borrower portal
--------------------------------------------------------------------- */
.portal{max-width:640px}
.portal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-card)}
.portal-hero{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.portal-hero img{max-height:40px;width:auto}
.portal-status-badge{display:inline-flex;align-items:center;gap:6px;background:var(--c-gold-bg);color:var(--c-gold);font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:999px;margin:10px 0 4px}
.portal-stepper{display:flex;margin:22px 0 8px}
.portal-stepper-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.portal-stepper-item:not(:last-child)::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.portal-stepper-item.done:not(:last-child)::after{background:var(--brand)}
.portal-stepper-dot{width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-faint);z-index:1;position:relative}
.portal-stepper-item.done .portal-stepper-dot{background:var(--brand);border-color:var(--brand);color:#fff}
.portal-stepper-item.now .portal-stepper-dot{background:var(--c-gold);border-color:var(--c-gold);color:#fff;box-shadow:0 0 0 4px var(--c-gold-bg)}

      check("LTV", ltv <= maxLtv, ltv.toFixed(0) + "% — max " + maxLtv + "%" + (isRural ? " for rural properties (65% cap regardless of credit score)" : " for this credit score band") + (lead.transactionType && lead.transactionType!=="purchase" ? " (against current value)" : ""));
    }
    if (isRural){
      check("Rural property notice", true, "Rural properties require 65% max LTV, DSCR > 1.20x, and FICO ≥ 720 per the DSCR Rental Matrix — confirm with underwriting before quoting");
    }
    if (lead.rentEstimate && lead.loanAmount && lead.rate){
      var pi = monthlyPayment(lead.loanAmount, lead.rate, lead.termMonths||360);
      if (pi){
        var hasRealExpenses = lead.monthlyTaxes!=null || lead.monthlyInsurance!=null;
        var pitia = hasRealExpenses
          ? pi + (lead.monthlyTaxes||0) + (lead.monthlyInsurance||0) + (lead.monthlyHoa||0)

        var dscr = lead.rentEstimate / pitia;
        var minDscr = isRural ? 1.20 : 1.0;
        check("DSCR", dscr >= minDscr, dscr.toFixed(2) + "x — " + minDscr.toFixed(2) + "x minimum" + (isRural?" for rural properties":"") + (hasRealExpenses

    var propCount = lead.propertyCount || 0;
    check("Cross-collateral eligibility", propCount>=3 || lead.loanAmount>=500000,
      propCount + " propert" + (propCount===1?"y":"ies") + ", " + fmtUSD(lead.loanAmount) + " total — needs 3+ properties or a $500,000+ total loan");
    check("Loan amount", lead.loanAmount>=250000 && lead.loanAmount<=2000000,
      fmtUSD(lead.loanAmount) + " — needs to be $250,000–$2,000,000 total");
    if (propCount) check("Per-property loan amount", (lead.loanAmount/propCount) >= 55000,
      fmtUSD(lead.loanAmount/propCount) + " avg per property — needs to be $55,000+ per property");
    check("Credit score", (lead.creditScore||0) >= 680, (lead.creditScore||"—") + " — 680 minimum");
    if (lead.purchasePrice && lead.loanAmount){
      var pfLtv = lead.loanAmount / lead.purchasePrice * 100;
      var pfMaxLtv = (lead.creditScore||0) >= 700 ? 80 : 75;
      check("LTV", pfLtv <= pfMaxLtv, pfLtv.toFixed(0) + "% — max " + pfMaxLtv + "% for this credit score band");
    }
    if (lead.purchasePrice && propCount){
      var avgValue = lead.purchasePrice / propCount;
      check("Average property value", avgValue >= 100000, fmtUSD(avgValue) + " avg — 100,000 minimum");
    }
    if (lead.rentEstimate && lead.loanAmount && lead.rate){
      var pfPi = monthlyPayment(lead.loanAmount, lead.rate, lead.termMonths||360);
      if (pfPi){
        var pfHasRealExpenses = lead.monthlyTaxes!=null || lead.monthlyInsurance!=null;
        var pfPitia = pfHasRealExpenses
          ? pfPi + (lead.monthlyTaxes||0) + (lead.monthlyInsurance||0) + (lead.monthlyHoa||0)
          : pfPi * 1.2;
        var pfDscr = lead.rentEstimate / pfPitia;
        var pfMinDscr = (lead.creditScore||0) >= 720 ? 1.00 : 1.20;
        check("DSCR", pfDscr >= pfMinDscr, pfDscr.toFixed(2) + "x — " + pfMinDscr.toFixed(2) + "x minimum for this credit score band" + (pfHasRealExpenses ? "" : " (estimated, add monthly tax/insurance for an exact number)"));

    }
    check("Loan amount", lead.loanAmount>=75000 && lead.loanAmount<=2000000,
      fmtUSD(lead.loanAmount) + " — needs to be $75,000–$2,000,000");
    check("Credit score", (lead.creditScore||0) >= 680, (lead.creditScore||"—") + " — 680 minimum");

      (lead.experienceDeals||0) + " deal(s) (" + tierName + ") — " + rClass + " rehab" + (limits ? "" : " isn't eligible at this experience level"));
    if (stateAdj && stateAdj.adj){
      check("State leverage adjustment", true, stateAdj.state + " property — max leverage reduced " + stateAdj.adj + "% per the RTL Matrix's non-cumulative state adjustment table");
    }
    if (stateAdj && stateAdj.needsManualCheck){
      check("NY county leverage adjustment", false, "NY properties in Bronx/New York/Richmond/Kings/Queens are -15%, Suffolk/Nassau are -5% — verify the county manually, not auto-applied");
    }
    if (limits){
      if (rClass === "bridge"){
        if (lead.purchasePrice && lead.loanAmount){
          var bridgeLtc = lead.loanAmount / lead.purchasePrice * 100;

          var initialAdvance = lead.loanAmount - (lead.rehabBudget||0);

          check("Initial LTC (at closing)", initialLtc <= limits.iltc, initialLtc.toFixed(0) + "% — max " + limits.iltc + "% for " + tierName + " " + rClass + " (loan amount minus rehab budget, since rehab funds are drawn over time)");
        }
        if (lead.purchasePrice && lead.rehabBudget && lead.loanAmount){
          var totalLtc = lead.loanAmount / (lead.purchasePrice + lead.rehabBudget) * 100;
          check("Total LTC", totalLtc <= limits.ltc, totalLtc.toFixed(0) + "% — max " + limits.ltc + "% for " + tierName + " " + rClass);
        }
        if (lead.arv && lead.loanAmount){
          var ltarv = lead.loanAmount / lead.arv * 100;

      fmtUSD(lead.loanAmount) + " — needs to be $75,000–$2,000,000");
    check("Credit score", (lead.creditScore||0) >= 700, (lead.creditScore||"—") + " — 700 minimum");

    var guLimits = GROUNDUP_TIERS[guTierName];

      guLimits = Object.assign({}, guLimits);

    check("Experience", !!guLimits,

    if (stateAdj && stateAdj.adj){
      check("State leverage adjustment", true, stateAdj.state + " property — max leverage reduced " + stateAdj.adj + "% per the Ground Up Matrix's non-cumulative state adjustment table");
    }
    if (stateAdj && stateAdj.needsManualCheck){
      check("NY county leverage adjustment", false, "NY properties in Bronx/New York/Richmond/Kings/Queens are -15%, Suffolk/Nassau are -5% — verify the county manually, not auto-applied");
    }
    if (guLimits){
      if (lead.purchasePrice && lead.loanAmount){
        var guInitialAdvance = lead.loanAmount - (lead.rehabBudget||0);
        var guInitialLtc = guInitialAdvance / lead.purchasePrice * 100;
        check("Initial LTC (at closing)", guInitialLtc <= guLimits.iltc, guInitialLtc.toFixed(0) + "% — max " + guLimits.iltc + "% for " + guTierName + " (loan amount minus construction budget)");
      }
      if (lead.purchasePrice && lead.rehabBudget && lead.loanAmount){
        var guTotalLtc = lead.loanAmount / (lead.purchasePrice + lead.rehabBudget) * 100;
        check("Total LTC", guTotalLtc <= guLimits.totalLtc, guTotalLtc.toFixed(0) + "% — max " + guLimits.totalLtc + "% for " + guTierName);
      }
      if (lead.arv && lead.loanAmount){
        var guLtarv = lead.loanAmount / lead.arv * 100;
        check("LTARV", guLtarv <= guLimits.ltarv, guLtarv.toFixed(0) + "% — max " + guLimits.ltarv + "% for " + guTierName);
      }
    }
  } else {
    return null;
  }

  var allPass = checks.length > 0 && checks.every(function(c){ return c.pass; });
  return { status: allPass ? "pass" : "review", checks: checks, evaluatedAt: todayISO() };
}
function runGuidelineCheck(leadId, opts){
  var lead = leadById(leadId);
  if (!lead) return;
  var result = evaluateGuidelines(lead);
  lead.guidelineCheck = result;
  if (result && result.status === "review" && !(opts && opts.silent)){
    var failedLabels = result.checks.filter(function(c){ return !c.pass; }).map(function(c){ return c.label; }).join(", ");
    var failedDetail = result.checks.filter(function(c){ return !c.pass; }).map(function(c){ return c.label + ": " + c.detail; }).join(" · ");
    var owner = state.users.filter(function(u){ return u.role==="owner"; })[0];
    if (owner){
      notifyUser(owner.id, leadId, "review", lead.name + "'s " + lead.loanType + " scenario needs review — " + failedDetail);
    }
    lead.activity = lead.activity || [];
    lead.activity.push({ date: todayISO(), type:"system", text:"Guideline check: needs review — " + failedLabels, author:"System" });
  } else if (result && result.status === "pass" && !(opts && opts.silent)){
    lead.activity = lead.activity || [];
    lead.activity.push({ date: todayISO(), type:"system", text:"Guideline check: passed", author:"System" });
  }
  persist();
}

function evaluateRcnFit(lead){

  var program = null, maxLtvPct = null, valueBasis = null, estMaxLoan = null;

  if (type === "DSCR" || type === "Portfolio/Blanket"){
    if (type === "DSCR"){
      program = isMulti ? "RCN 30yr DSCR — Multifamily (5-9 units)" : "RCN 30yr DSCR — 1-4 Family";
      var addrLower = (lead.propertyAddress||"").toLowerCase();
      if (RCN_DSCR_BLOCKED_CITIES.some(function(c){ return addrLower.indexOf(c) !== -1; })){
        reasons.push("RCN doesn't do DSCR loans in Baltimore, Cape Coral, or Lakeland");
      }
      valueBasis = dscrValueBasis(lead, null);
      if (isMulti){
        if ((lead.creditScore||0) < 700) reasons.push("Below RCN's 700 minimum FICO for Multifamily");
        if (lead.loanAmount && (lead.loanAmount < 250000 || lead.loanAmount > 3000000)) reasons.push("Outside RCN's $250K–$3M Multifamily loan size range");
        maxLtvPct = RCN_DSCR_LTV_MULTI[txnKey];
      } else {
        var minFico = 660;
        if ((lead.creditScore||0) < minFico) reasons.push("Below RCN's " + minFico + " minimum FICO for DSCR");
        var minPropVal = isFN ? 125000 : 115000;
        if (valueBasis && valueBasis < minPropVal) reasons.push("Below RCN's " + fmtUSD(minPropVal) + " minimum property value" + (isFN?" (Foreign National)":""));
        if (lead.loanAmount && (lead.loanAmount < 70000 || lead.loanAmount > 2000000)) reasons.push("Outside RCN's $70K–$2M DSCR loan size range");
        maxLtvPct = isFN ? RCN_DSCR_LTV_FN[txnKey] : (function(){

          if (dscrEst < minDscr) reasons.push("Estimated DSCR below RCN's " + minDscr.toFixed(2) + "x minimum at their starting rate (a higher actual note rate would lower this further)");

      if ((lead.creditScore||0) < 660) reasons.push("Below RCN's 660 minimum FICO for Portfolio");
      if (lead.loanAmount && (lead.loanAmount < 150000 || lead.loanAmount > 2000000)) reasons.push("Outside RCN's $150K–$2M Portfolio loan size range");
      valueBasis = dscrValueBasis(lead, null);
      if (propCount && lead.purchasePrice){
        var avgVal = lead.purchasePrice / propCount;

          if (tLtcActual > cell.tLtc) reasons.push("Total LTC " + tLtcActual.toFixed(0) + "% exceeds RCN's " + cell.tLtc + "% cap for this tier");

      if (lead.arv && cell.arLtv != null){
        estMaxLoan = Math.round(lead.arv * cell.arLtv / 100);

      } else if (cell.tLtc != null && lead.purchasePrice && lead.rehabBudget){

function rcnRecommendation(lead, fit){

    if (fit.estMaxLoan >= lead.loanAmount){

function esc(s){
  if (s===null || s===undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c];
  });
}
function fmtUSD(n){
  if (n===null || n===undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
}
function fmtPct(n){
  if (n===null || n===undefined) return "—";
  var s = Number(n).toFixed(3);
  s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s + "%";
}
function fmtDate(iso){
  if (!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric" });
}

/* ---------------------------------------------------------------------
   Commission (points charged + yield spread premium)
--------------------------------------------------------------------- */
// Origination (points) split defaults to 50/50 but is negotiated per
// employee (stored on their user record) for company-provided leads. Any
// self-generated business (lead.source === "Self-Generated") pays 70% to
// the employee regardless of their negotiated default -- applies to every
// employee, including ones with a different default split. Yield spread
// is always split 50/50, for everyone, regardless of source or employee.
var YSP_SPLIT = 0.5;
var SELF_GEN_ORIGINATION_SPLIT = 0.70;
var DEFAULT_ORIGINATION_SPLIT = 0.5;
function originationSplitFor(lead){
  if (lead.source === "Self-Generated") return SELF_GEN_ORIGINATION_SPLIT;
  var lo = userById(lead.assignedTo);
  return (lo && lo.originationSplit != null) ? Number(lo.originationSplit) : DEFAULT_ORIGINATION_SPLIT;
}
function pointsRevenue(lead){
  if (!lead.pointsCharged || !lead.loanAmount) return 0;
  return lead.loanAmount * (lead.pointsCharged/100);
}
function dscrLockedRateInfo(lead){
  // Where this borrower's own committed rate sits relative to THEIR par
  // rate -- see dscrParRate/dscrPriceForDelta above for why par moves per
  // borrower instead of being a fixed absolute rate.
  var par = dscrParRate(lead, { propertyType: lead.propertyType, transactionType: lead.transactionType||"purchase", prepayTerm: lead.prepayTerm||"5yr" });
  if (!par || par.ineligible || lead.rate == null) return null;
  var delta = Math.round((lead.rate - par.rate)*1000)/1000;
  if (delta < -0.0001) return { parRate: par.rate, delta: delta, priceRow: null, belowPar: true };
  return { parRate: par.rate, delta: delta, priceRow: dscrPriceForDelta(delta), belowPar: false };
}
function yspRevenue(lead){
  if (lead.loanType !== "DSCR" && lead.loanType !== "Portfolio/Blanket") return 0;
  if (!lead.loanAmount) return 0;
  var noYsp = (lead.prepayTerm === "none") || (lead.propertyType === "Multifamily 5+");
  if (noYsp) return 0;
  if (lead.rate != null){
    // A rate is already locked in -- price it off that exact rate relative
    // to this borrower's own par, or treat it as out of range. Never fall
    // back to the calculator's own independent estimate here, since that
    // would show a number with no relationship to the rate actually on file.
    var info = dscrLockedRateInfo(lead);
    return (info && info.priceRow) ? Math.max(0, Math.round((info.priceRow.price - 100) / 100 * lead.loanAmount * 100) / 100) : 0;
  }
  var inputs = { propertyType: lead.propertyType, transactionType: lead.transactionType || "purchase", prepayTerm: lead.prepayTerm || "5yr" };
  var result = evaluatePricing(lead, inputs);
  return (result && !result.ineligible && result.yspDollar) ? result.yspDollar : 0;
}
function commissionAmount(lead){
  return pointsRevenue(lead) * originationSplitFor(lead) + yspRevenue(lead) * YSP_SPLIT;
}
function processingFeeRevenue(lead){
  var inputs = { propertyType: lead.propertyType, transactionType: lead.transactionType||"purchase", prepayTerm: lead.prepayTerm||"5yr", points:"0.00" };
  var result = evaluatePricing(lead, inputs);
  return (result && !result.ineligible && result.fee) ? result.fee : 0;
}
function yspBreakdown(lead){
  if (lead.loanType !== "DSCR" && lead.loanType !== "Portfolio/Blanket") return null;
  var noYsp = (lead.prepayTerm === "none") || (lead.propertyType === "Multifamily 5+");
  if (noYsp) return { amount: 0, reason: "not eligible — no-prepay or 5+ unit multifamily" };
  if (lead.rate == null) return { amount: null, reason: "pending — set a rate first" };
  var info = dscrLockedRateInfo(lead);
  if (!info) return { amount: null, reason: "can't compute this borrower's par rate yet — missing credit score, purchase price, or loan amount" };
  if (info.belowPar) return { amount: null, reason: "rate is below this borrower's par rate (" + fmtPct(info.parRate) + ") — pricing below par isn't modeled, needs manual calculation" };
  if (!info.priceRow) return { amount: null, reason: "rate is more than " + DSCR_MAX_BUYUP + "% above this borrower's par rate (" + fmtPct(info.parRate) + ") — outside the modeled buy-up range, needs manual calculation" };
  return { amount: Math.max(0, Math.round((info.priceRow.price - 100) / 100 * lead.loanAmount * 100) / 100), reason: null };
}
function renderEarningsLive(lead){
  var pts = pointsRevenue(lead);
  var yb = yspBreakdown(lead);
  var yspAmt = (yb && yb.amount!=null) ? yb.amount : 0;
  var total = pts + yspAmt;
  var oSplit = originationSplitFor(lead);
  var rows = [];
  rows.push(lead.pointsCharged!=null
    ? ('Origination Points (' + lead.pointsCharged + '%): <b>' + fmtUSD(pts) + '</b>')
    : 'Origination Points: <b>not set yet</b>');
  if (yb){
    rows.push(yb.amount!=null
      ? ('Yield Spread Earned: <b>' + fmtUSD(yb.amount) + '</b>')
      : ('Yield Spread Earned: <b>' + esc(yb.reason) + '</b>'));
  }
  if (lead.pointsCharged!=null){
    if (isOwner()){
      rows.push('Total origination revenue (100%) if this closes: <b>' + fmtUSD(total) + '</b>');
    } else {
      var mine = pts * oSplit + yspAmt * YSP_SPLIT;
      var splitNote = Math.round(oSplit*100) + '% of points' + (yb ? (' + ' + Math.round(YSP_SPLIT*100) + '% of YSP') : '') + (lead.source==="Self-Generated" ? ' — self-generated rate' : '');
      rows.push('Your split if this closes: <b>' + fmtUSD(mine) + '</b> (' + splitNote + ') of ' + fmtUSD(total) + ' total');
    }
  } else {
    rows.push('Set points charged above — used to calculate the loan officer\'s commission.');
  }
  return rows.map(function(r){ return '<div class="footnote" style="padding:2px 0 0">' + r + '</div>'; }).join('');
}
function payrollFor(lead){
  var skipLo = lead.assignedTo === "owner";
  return {
    lead: lead,
    loName: userName(lead.assignedTo),
    loCommission: skipLo ? 0 : commissionAmount(lead),
    skipLo: skipLo,
    processorName: processingContact(lead).name,
    processorFee: processingFeeRevenue(lead)
  };
}
function commissionSummaryFor(userId){
  var today = startOfToday();
  var monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  var mine = state.leads.filter(function(l){ return l.assignedTo===userId; });
  var closedThisMonth = mine.filter(function(l){
    return l.status==="closed" && l.closeDate && new Date(l.closeDate+"T00:00:00") >= monthStart;
  });
  var earned = closedThisMonth.reduce(function(s,l){ return s + commissionAmount(l); }, 0);
  var activePipeline = mine.filter(function(l){ return l.status==="active"; });
  var potential = activePipeline.reduce(function(s,l){ return s + commissionAmount(l); }, 0);
  return { earned: earned, potential: potential, closedCount: closedThisMonth.length, pipelineCount: activePipeline.length };
}
function notifyProcessorOfPricingChange(lead, whatChanged){

}
function setPointsCharged(leadId, points){
  var lead = leadById(leadId);
  if (!lead) return;
  var n = points===""||points===null||points===undefined ? null : Number(points);
  if (n !== null && (isNaN(n) || n < 0 || n > 15)){ showToast("Points should be between 0 and 15"); return; }
  var prevPoints = lead.pointsCharged;
  lead.pointsCharged = n;
  lead.activity = lead.activity || [];
  lead.activity.push({ date: todayISO(), type:"note", text: n===null ? "Points charged cleared" : ("Points charged set to " + n + "%"), author: currentUser().name });
  if (n !== prevPoints) notifyProcessorOfPricingChange(lead, "the points charged");
  showToast(n===null ? "Points charged cleared" : "Points charged set to " + n + "%");
  persist();
}

/* ---------------------------------------------------------------------
   Speed to lead
--------------------------------------------------------------------- */
function nowTs(){ return new Date().toISOString(); }
function speedToLeadMs(lead){
  if (!lead.createdAtTs || !lead.firstAttemptAt) return null;
  var ms = new Date(lead.firstAttemptAt).getTime() - new Date(lead.createdAtTs).getTime();
  return isNaN(ms) ? null : ms;
}
function fmtDuration(ms){
  if (ms===null || ms===undefined || isNaN(ms)) return "—";
  if (ms < 0) ms = 0;
  var mins = ms/60000;
  if (mins < 60) return Math.max(1,Math.round(mins)) + " min";
  var hrs = mins/60;
  if (hrs < 24) return (Math.round(hrs*10)/10) + " hr";
  var days = hrs/24;
  return (Math.round(days*10)/10) + " day" + (days>=1.95?"s":"");
}
function speedBadgeClass(ms){
  if (ms===null) return "badge-neutral";
  var hrs = ms/3600000;
  if (hrs <= 1) return "badge-forest";
  if (hrs <= 24) return "badge-gold";
  return "badge-rust";
}
function speedToLeadStats(leads){
  var withAttempt = leads.filter(function(l){ return speedToLeadMs(l)!==null; });
  var uncontacted = leads.filter(function(l){ return !l.firstAttemptAt && l.status==="active"; });
  var avgMs = withAttempt.length ? withAttempt.reduce(function(s,l){ return s+speedToLeadMs(l); },0) / withAttempt.length : null;
  var within1hr = withAttempt.filter(function(l){ return speedToLeadMs(l) <= 3600000; }).length;
  var pctWithin1hr = withAttempt.length ? Math.round((within1hr/withAttempt.length)*100) : null;
  return { avgMs: avgMs, pctWithin1hr: pctWithin1hr, contactedCount: withAttempt.length, uncontactedCount: uncontacted.length };
}

/* ---------------------------------------------------------------------
   Conversion by source
--------------------------------------------------------------------- */
function furthestStageIndex(lead){
  // A lost/cold lead's .stage gets overwritten to "lost"/"cold" (not in
  // STAGES), losing where they actually got to -- reconstruct the real
  // high-water mark from the activity log's "Stage moved: X → Y" entries
  // instead of trusting the current stage value alone.
  var idx = stageIndex(lead.stage);
  if (idx === -1) idx = 0;
  (lead.activity||[]).forEach(function(a){
    if (a.type !== "stage") return;
    var m = /→\s*(.+)$/.exec(a.text||"");
    if (!m) return;
    var label = m[1].trim();
    var match = STAGES.filter(function(s){ return s.label === label; })[0];
    if (match){
      var i = stageIndex(match.key);
      if (i > idx) idx = i;
    }
  });
  return idx;
}
function funnelCounts(leads){
  return STAGES.map(function(s, i){
    return {
      key: s.key, label: s.label,
      reached: leads.filter(function(l){ return furthestStageIndex(l) >= i; }).length,
      current: leads.filter(function(l){ return l.stage === s.key; }).length
    };
  });
}
function computeStageVelocity(leads){
  var totals = {}; // stageKey -> { sumDays, count }
  STAGES.forEach(function(s){ totals[s.key] = { sumDays:0, count:0 }; });
  leads.forEach(function(l){
    var timeline = [{ key:"new", date: l.createdAt }];
    (l.activity||[]).filter(function(a){ return a.type==="stage"; })
      .slice()
      .sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); })
      .forEach(function(a){
        var m = /→\s*(.+)$/.exec(a.text||"");
        if (!m) return;
        var label = m[1].trim();
        var match = STAGES.filter(function(s){ return s.label === label; })[0];
        if (match) timeline.push({ key: match.key, date: a.date });
      });
    for (var i=0; i<timeline.length-1; i++){
      var d1 = new Date(timeline[i].date), d2 = new Date(timeline[i+1].date);
      if (isNaN(d1) || isNaN(d2)) continue;
      var days = (d2-d1) / 86400000;
      if (days < 0) continue;
      var bucket = totals[timeline[i].key];
      if (bucket){ bucket.sumDays += days; bucket.count++; }
    }
  });
  var byStage = STAGES.filter(function(s){ return s.key !== "postclosing"; }).map(function(s){
    var t = totals[s.key];
    return { key:s.key, label:s.label, avgDays: t.count ? (t.sumDays/t.count) : null, count: t.count };
  });

  var closedLeads = leads.filter(function(l){ return l.status==="closed" && l.stage!=="lost" && l.createdAt && l.closeDate; });
  var closeDaysSum = closedLeads.reduce(function(s,l){
    var d = (new Date(l.closeDate) - new Date(l.createdAt)) / 86400000;
    return s + (d>0 ? d : 0);
  }, 0);
  var avgDaysToClose = closedLeads.length ? (closeDaysSum/closedLeads.length) : null;

  var everReachedApp = leads.filter(function(l){ return furthestStageIndex(l) >= stageIndex("app_completed"); }).length;
  var closedCount = leads.filter(function(l){ return l.status==="closed" && l.stage!=="lost"; }).length;
  var pullThroughRate = everReachedApp ? Math.round((closedCount/everReachedApp)*100) : null;

  return { byStage:byStage, avgDaysToClose:avgDaysToClose, pullThroughRate:pullThroughRate, everReachedApp:everReachedApp, closedCount:closedCount };
}
function conversionBySource(leads){
  var bySource = {};
  SOURCES.forEach(function(s){ bySource[s] = { source:s, total:0, closed:0, active:0, lostCold:0, closedValue:0 }; });
  leads.forEach(function(l){
    var b = bySource[l.source];
    if (!b){ b = bySource[l.source] = { source:l.source||"Other", total:0, closed:0, active:0, lostCold:0, closedValue:0 }; }
    b.total++;
    if (l.status==="closed"){ b.closed++; b.closedValue += (l.loanAmount||0); }
    else if (l.status==="active"){ b.active++; }
    else { b.lostCold++; }
  });
  return Object.keys(bySource).map(function(k){ return bySource[k]; }).filter(function(b){ return b.total>0; })
    .map(function(b){ b.rate = b.total ? Math.round((b.closed/b.total)*100) : 0; return b; })
    .sort(function(a,b){ return b.rate - a.rate; });
}

   Derived data

function scopedLeads(){
  if (isOwner()) return state.leads;
  if (isProcessor()) return state.leads.filter(function(l){
    return ["processing","underwriting","ctc","closed"].indexOf(l.stage) !== -1;
  });
  if (isLO()) return state.leads.filter(function(l){ return l.assignedTo===ui.viewAs; });
  return state.leads;
}

function computeQueue(userId){
  var items = [];
  var today = startOfToday();
  var leads = (userId==="owner") ? state.leads : state.leads.filter(function(l){ return l.assignedTo===userId; });

  leads.forEach(function(lead){
    if (lead.status==="active" && CADENCE_STAGES.indexOf(lead.stage) !== -1){
      var attempts = lead.callAttempts || [];
      var connected = attempts.some(function(a){ return a.outcome==="connected"; });
      if (!connected && attempts.length < CADENCE_MAX){
        var last = attempts[attempts.length-1];
        var lastDate = last ? new Date(last.date+"T00:00:00") : null;
        var due = !lastDate || dateOnly(lastDate) < today;
        if (due){
          var ageMs = lead.createdAtTs ? (Date.now() - new Date(lead.createdAtTs).getTime()) : null;
          var isHot = attempts.length===0 && ageMs!==null && ageMs <= 30*60000;
          items.push({
            type: isHot ? "hot" : "cadence", leadId:lead.id,
            priority: isHot ? 4 : (attempts.length===0 ? 2 : 1),
            label: isHot
              ? "🔥 New lead — " + fmtDuration(ageMs) + " old, not yet contacted"
              : "Day " + (attempts.length+1) + " of " + CADENCE_MAX + " — new lead follow-up",
            reason: isHot
              ? "Speed to lead matters — leads contacted within 5 minutes convert far better"
              : (attempts.length===0 ? "First outreach attempt" : (attempts.length + " attempt(s) so far, no contact yet"))
          });
        }
      }
    }

    if (userId==="owner" && lead.pricingReviewRequestedAt && !lead.pricingReviewResolvedAt){
      items.push({
        type:"review-request", leadId:lead.id, priority:5,
        label:"Pricing review requested" + (lead.pricingReviewNote ? (" — " + lead.pricingReviewNote) : ""),
        reason:"Requested by " + userName(lead.pricingReviewRequestedBy) + " on " + fmtDate((lead.pricingReviewRequestedAt||"").slice(0,10))
      });
    }

    var rk = RATE_KEY_BY_LOAN_TYPE[lead.loanType];
    if (rk && state.marketRates[rk]){
      var r = state.marketRates[rk];
      if (r.current < r.previous && (lead.status==="active" || lead.status==="closed")){
        items.push({
          type:"rate-drop", leadId:lead.id, priority:3,
          label: lead.loanType + " rates dropped to " + fmtPct(r.current) + " — call to discuss",
          reason: "Was " + fmtPct(r.previous) + ", now " + fmtPct(r.current) + " as of " + fmtDate(r.updatedAt)
        });
      }
    }

    if (lead.status==="closed" && SHORT_TERM_TYPES.indexOf(lead.loanType) !== -1 && lead.closeDate && lead.termMonths && lead.termMonths <= 36){
      var end = addMonths(new Date(lead.closeDate+"T00:00:00"), lead.termMonths);
      var daysLeft = daysDiff(today, end);
      if (daysLeft <= 60 && daysLeft >= -30){
        items.push({
          type:"refi", leadId:lead.id, priority:2,
          label: (daysLeft>=0 ? "Term ends in " + daysLeft + " day(s)" : "Term ended " + Math.abs(daysLeft) + " day(s) ago") + " — discuss refi / exit",
          reason: "Closed " + fmtDate(lead.closeDate) + ", " + lead.termMonths + "-month term"
        });
      }
    }

    if (lead.status==="active" && lead.nextFollowUp){
      var fu = dateOnly(new Date(lead.nextFollowUp+"T00:00:00"));
      if (fu <= today){
        items.push({
          type:"followup", leadId:lead.id, priority:2,
          label:"Scheduled follow-up due", reason: lead.nextFollowUpNote || ""
        });
      }
    }

    var wb = winbackInfo(lead, today);
    if (wb){
      items.push({
        type:"winback", leadId:lead.id, priority: wb.priority,
        label:"Win-back opportunity (" + (lead.status==="cold"?"cold lead":"lost deal") + ")",
        reason: wb.reasons.join(" · ")
      });
    }

    if (lead.status==="active" && lead.applicationSentAt && !lead.applicationTakenByPhone && !lead.applicationTakenAt){
      var appDays = daysDiff(new Date(lead.applicationSentAt+"T00:00:00"), today);
      if (appDays >= 3){
        items.push({
          type:"stale-app", leadId:lead.id, priority:2,
          label:"Application sent " + appDays + " day(s) ago, not completed",
          reason:"Check in — see if they need help finishing it"
        });
      }
    }

    (lead.documents||[]).forEach(function(doc){
      if (doc.status==="requested" && doc.requestedAt){
        var docDays = daysDiff(new Date(doc.requestedAt+"T00:00:00"), today);
        if (docDays >= 5){
          items.push({
            type:"stale-docs", leadId:lead.id, priority:1,
            label:'"' + doc.name + '" requested ' + docDays + " day(s) ago, not received",
            reason:"Follow up to keep the file moving"
          });
        }
      }
    });

    if (lead.status==="active" && lead.termsheetSentAt){
      var tsExpires = addDaysISO(lead.termsheetSentAt, 15);
      var tsDaysLeft = daysDiff(today, new Date(tsExpires+"T00:00:00"));
      if (tsDaysLeft <= 3 && tsDaysLeft >= 0 && stageIndex(lead.stage) < stageIndex("ctc")){
        items.push({
          type:"expiring", leadId:lead.id, priority:3,
          label:"Term sheet expires in " + tsDaysLeft + " day(s)",
          reason:"Sent " + fmtDate(lead.termsheetSentAt) + " — confirm still moving forward or re-issue"
        });
      }
    }

    if (lead.birthday){
      var bday = new Date(lead.birthday+"T00:00:00");
      if (bday.getMonth()===today.getMonth() && bday.getDate()===today.getDate()){
        items.push({
          type:"birthday", leadId:lead.id, priority:2,
          label: "🎂 Birthday today — quick call or text",
          reason: "Relationship touchpoint"
        });
      }
    }
  });

  items.sort(function(a,b){ return b.priority - a.priority; });
  return items;
}

function companyPointsSummary(leads){

/* ---------------------------------------------------------------------
   Win-back / retargeting
--------------------------------------------------------------------- */
function lastTouchDate(lead){
  var dates = [];
  (lead.callAttempts||[]).forEach(function(a){ if (a.date) dates.push(a.date); });
  (lead.activity||[]).forEach(function(a){ if (a.date) dates.push(a.date); });
  if (lead.createdAt) dates.push(lead.createdAt);
  if (!dates.length) return null;
  dates.sort();
  return new Date(dates[dates.length-1] + "T00:00:00");
}
function winbackInfo(lead, today){
  if (lead.status !== "cold" && lead.status !== "lost") return null;
  var reasons = [];
  var priority = 1;
  var rk = RATE_KEY_BY_LOAN_TYPE[lead.loanType];
  if (rk && state.marketRates[rk] && state.marketRates[rk].current < state.marketRates[rk].previous){
    reasons.push(lead.loanType + " rates just dropped to " + fmtPct(state.marketRates[rk].current) + " (was " + fmtPct(state.marketRates[rk].previous) + ")");
    priority = 3;
  }
  var lt = lastTouchDate(lead);
  var days = lt ? daysDiff(lt, today) : null;
  var bucket = null;
  if (days !== null){
    if (days >= 90) bucket = 90; else if (days >= 60) bucket = 60; else if (days >= 30) bucket = 30;
  }
  if (bucket){
    reasons.push("It's been " + days + " days since last contact — a check-in is due");
    priority = Math.max(priority, bucket >= 90 ? 2 : 1);
  }
  if (!reasons.length) return null;
  return { reasons:reasons, days:days, priority:priority };
}

var staffLeadPollTimer = null;
var staffLeadPollingId = null;
function ensureStaffLeadPolling(leadId){
  // Staff sessions otherwise never see another staff member's changes to a
  // lead they already have open (e.g. Joe flips the Spanish-speaking toggle
  // while the assigned LO already has the file open) -- there's no
  // realtime channel wired up, so poll quietly in the background while a
  // staff member is sitting on a lead's detail page, same approach as the
  // borrower portal's own polling.
  if (staffLeadPollingId === leadId) return;
  if (staffLeadPollTimer) clearInterval(staffLeadPollTimer);
  staffLeadPollingId = leadId;
  staffLeadPollTimer = setInterval(function(){
    if (!sb || ui.view !== "detail" || ui.selectedLeadId !== leadId){
      clearInterval(staffLeadPollTimer);
      staffLeadPollTimer = null;
      staffLeadPollingId = null;
      return;
    }
    sb.from("leads").select("*").eq("id", leadId).then(function(res){
      if (res.error || !res.data || !res.data.length) return;
      var fresh = rowToLead(res.data[0]);
      var idx = state.leads.findIndex(function(l){ return l.id === leadId; });
      if (idx === -1) return;
      var old = state.leads[idx];
      if (JSON.stringify(old) === JSON.stringify(fresh)) return;
      state.leads[idx] = fresh;
      render();
    });
  }, 15000);
}

function startPortalPolling(leadId, token){
  // No realtime channel wired up for the public portal, so poll quietly in
  // the background for new chat replies / stage changes while the borrower
  // has the page open, instead of requiring a manual reload to see them.
  if (ui.publicApply._pollStarted) return;
  ui.publicApply._pollStarted = true;
  setInterval(function(){
    if (!sb || !ui.publicApply) return;
    sb.from("leads").select("*").eq("id", leadId).eq("application_token", token).then(function(res){
      if (res.error || !res.data || !res.data.length) return;
      var fresh = rowToLead(res.data[0]);

      var changed = JSON.stringify(old.portalChat||[]) !== JSON.stringify(fresh.portalChat||[]) || old.stage !== fresh.stage || old.rate !== fresh.rate;

      if (changed) render();

}
function sendPortalMessage(leadId, text){

  var msg = text.trim();

  lead.portalChat.push({ from:"borrower", text: msg, ts: nowTs(), authorName: lead.name });
  lead.activity = lead.activity || [];
  lead.activity.push({ date: todayISO(), type:"text", text: "Portal message from borrower: " + msg, author: lead.name });

function submitPublicApplication(leadId, patch){
  var lead = leadById(leadId);
  if (!lead) return;
  var d = todayISO();
  Object.keys(patch).forEach(function(k){ lead[k] = patch[k]; });
  if (patch.purchasePrice && patch.loanAmount){
    lead.ltv = Math.round((patch.loanAmount / patch.purchasePrice) * 1000) / 10;
  }
  lead.applicationSentAt = lead.applicationSentAt || d;
  lead.applicationTakenAt = d;
  var idx = stageIndex(lead.stage);
  if (idx >= 0 && idx < stageIndex("app_completed")) lead.stage = "app_completed";
  lead.activity = lead.activity || [];
  lead.activity.push({ date:d, type:"application", text:"Application submitted online by " + lead.name, author: lead.name });
  if (lead.assignedTo){
    notifyUser(lead.assignedTo, lead.id, "application", lead.name + " completed their application online.");
  }
  ui.publicApply.status = "submitted";
  runGuidelineCheck(leadId);
  sendBorrowerPortalFollowUp(lead);

// Real live-suggestion typeahead (Google Places), layered on top of the
// address-lookup input handler below rather than replacing it -- selecting
// a suggestion fills the input and dispatches a real "input" event, so the
// existing debounced Census geocode call still runs and rural-status
// detection keeps working exactly as before. Loaded lazily/once since it's
// not needed until an address field is actually on screen.
var googleMapsPlacesPromise = null;
function loadGoogleMapsPlaces(){
  if (googleMapsPlacesPromise) return googleMapsPlacesPromise;
  googleMapsPlacesPromise = new Promise(function(resolve, reject){
    if (window.google && window.google.maps && window.google.maps.places){ resolve(); return; }
    window.__gmapsPlacesReady = function(){ resolve(); };
    var s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + GOOGLE_MAPS_API_KEY + "&libraries=places&callback=__gmapsPlacesReady&loading=async";
    s.async = true;
    s.onerror = function(){ googleMapsPlacesPromise = null; reject(new Error("Google Maps failed to load")); };
    document.head.appendChild(s);
  });
  return googleMapsPlacesPromise;
}
function initPlacesAutocomplete(){
  var inputs = document.querySelectorAll('input[data-action="address-lookup"]');
  if (!inputs.length || !GOOGLE_MAPS_API_KEY) return;
  loadGoogleMapsPlaces().then(function(){
    inputs.forEach(function(input){
      if (input.dataset.placesBound) return;
      input.dataset.placesBound = "1";
      var ac = new google.maps.places.Autocomplete(input, {
        types: ["address"],
        componentRestrictions: { country: "us" },
        fields: ["formatted_address"]
      });
      ac.addListener("place_changed", function(){
        var place = ac.getPlace();
        var addr = place && place.formatted_address;
        if (!addr) return;
        input.value = addr;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    });
  }).catch(function(){ /* falls back to the existing single-match datalist suggestion */ });
}

function logCall(leadId, outcome, notes){
  var lead = leadById(leadId);
  if (!lead) return;
  var d = todayISO();
  if (!lead.firstAttemptAt) lead.firstAttemptAt = nowTs();
  lead.callAttempts = lead.callAttempts || [];
  lead.callAttempts.push({ date:d, outcome:outcome, notes:notes||"" });
  lead.activity = lead.activity || [];
  var outLabel = (CALL_OUTCOMES.filter(function(o){ return o.key===outcome; })[0] || {}).label || outcome;
  lead.activity.push({ date:d, type:"call", text:"Call logged — " + outLabel + (notes ? ": " + notes : ""), author: currentUser().name });
  lead.lastContactAt = d;
  if (outcome === "connected"){
    if (lead.status==="cold" || lead.status==="lost"){
      lead.status = "active";
      lead.stage = "qualifying";
      lead.activity.push({ date:d, type:"system", text:"Reactivated via win-back outreach", author: currentUser().name });
    } else if (lead.stage==="new" || lead.stage==="attempting"){
      lead.stage = "qualifying";
    }
    // A real human just connected with this client -- the AI conversion
    // automation should stand down so it doesn't keep texting on top of
    // whatever the LO and client just agreed to on the call.
    if (lead.aiStage && !lead.automationPaused){
      lead.automationPaused = true;
      lead.activity.push({ date:d, type:"system", text:"AI automation paused — you connected with the client directly, follow up per your call", author:"System" });
      notifyUser(currentUser().id, leadId, "note", "Automation paused for " + lead.name + " since you just connected — make sure to follow up yourself as planned.", { skipText:true });
    }
  } else {
    var unanswered = lead.callAttempts.filter(function(a){ return a.outcome!=="connected"; }).length;
    if (unanswered >= CADENCE_MAX && lead.status==="active"){
      lead.status = "cold";
      lead.activity.push({ date:d, type:"system", text:"Auto-marked cold after " + CADENCE_MAX + " unanswered attempts", author:"System" });
    }
  }
  showToast("Call logged for " + lead.name);
  persist();
}

function parseCSV(text){
  var rows = []; var row = []; var field = ""; var inQuotes = false;
  for (var i=0;i<text.length;i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip -- \n follows */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  rows = rows.filter(function(r){ return r.some(function(v){ return (v||"").trim()!==""; }); });
  if (!rows.length) return { headers:[], rows:[] };
  return { headers: rows[0], rows: rows.slice(1) };
}
function guessImportMapping(headers){
  var norm = headers.map(function(h){ return (h||"").toLowerCase().replace(/[^a-z0-9]/g,""); });
  function find(matcher){
    for (var i=0;i<norm.length;i++){ if (matcher(norm[i])) return i; }
    return -1;
  }
  var firstName = find(function(h){ return h.indexOf("firstname")!==-1; });
  var lastName = find(function(h){ return h.indexOf("lastname")!==-1; });
  var fullName = (firstName===-1) ? find(function(h){ return h==="name" || h.indexOf("fullname")!==-1 || h.indexOf("contactname")!==-1; }) : -1;
  return {
    firstName: firstName, lastName: lastName, fullName: fullName,
    email: find(function(h){ return h.indexOf("email")!==-1; }),
    phone: find(function(h){ return h.indexOf("phone")!==-1 || h.indexOf("mobile")!==-1 || h.indexOf("cell")!==-1; }),
    address: find(function(h){ return h.indexOf("address")!==-1; })
  };
}
function startImportParse(text){
  var parsed = parseCSV(text);
  if (!parsed.headers.length){ showToast("Couldn't find any rows in that file"); return; }
  ui.importState = { headers: parsed.headers, rows: parsed.rows, mapping: guessImportMapping(parsed.headers), aiStatus: "checking" };
  render();
  requestAiColumnMapping();
}
function requestAiColumnMapping(){
  var st = ui.importState;
  if (!st) return;
  aiSuggest("map-csv-columns", { headers: st.headers, sampleRows: st.rows.slice(0,3) }, function(suggestion){
    if (!ui.importState) return; // modal closed/reset before this returned
    ui.importState.aiStatus = "done";
    if (!suggestion){ render(); return; }
    try {
      var cleaned = suggestion.replace(/```json/gi,"").replace(/```/g,"").trim();
      var parsed = JSON.parse(cleaned);
      var n = ui.importState.headers.length;
      var validIdx = function(v){ return typeof v === "number" && v>=0 && v<n; };
      var m = ui.importState.mapping;
      ["firstName","lastName","fullName","email","phone","address"].forEach(function(k){
        if (validIdx(parsed[k])) m[k] = parsed[k];
      });
      ui.importState.aiStatus = "applied";
    } catch(e){ /* keep the heuristic guess */ }
    render();
  });
}
function runImport(fd){
  var st = ui.importState;
  if (!st) return;
  var idx = function(name){ var v = fd.get(name); return (v===null||v==="") ? -1 : parseInt(v,10); };
  var mFirst = idx("map_firstName"), mLast = idx("map_lastName"), mFull = idx("map_fullName"),
      mEmail = idx("map_email"), mPhone = idx("map_phone"), mAddress = idx("map_address");
  var loanType = fd.get("loanType") || LOAN_TYPES[0];
  var assignedTo = fd.get("assignedTo") || currentUser().id;
  var existingEmails = {}, existingPhones = {};
  state.leads.forEach(function(l){
    if (l.email) existingEmails[l.email.toLowerCase().trim()] = true;
    if (l.phone) existingPhones[l.phone.replace(/\D/g,"")] = true;
  });
  var nextNum = 1;
  state.leads.forEach(function(l){ var m = /^L(\d+)$/.exec(l.id); if (m) nextNum = Math.max(nextNum, parseInt(m[1],10)+1); });
  var d = todayISO();
  var added = 0, skippedDupe = 0, skippedBlank = 0;
  var newLeads = [];
  st.rows.forEach(function(row){
    var get = function(i){ return i>=0 && row[i]!=null ? row[i].trim() : ""; };
    var name = (mFirst>=0 || mLast>=0) ? [get(mFirst), get(mLast)].filter(Boolean).join(" ") : get(mFull);
    var email = get(mEmail);
    var phone = get(mPhone);
    if (!name && !email && !phone){ skippedBlank++; return; }
    if (!name) name = email || phone || "Unnamed Contact";
    var emailKey = email.toLowerCase().trim();
    var phoneKey = phone.replace(/\D/g,"");
    if ((emailKey && existingEmails[emailKey]) || (phoneKey && existingPhones[phoneKey])){ skippedDupe++; return; }
    if (emailKey) existingEmails[emailKey] = true;
    if (phoneKey) existingPhones[phoneKey] = true;
    var id = "L" + String(nextNum++).padStart(3,"0");
    newLeads.push({
      id:id, name:name, email:email||null, phone:phone||null, source:"Imported", loanType:loanType,
      stage:"new", status:"active", assignedTo:assignedTo, createdAt:d, createdAtTs:nowTs(), firstAttemptAt:null,
      entityType:"LLC", creditScore:null, experienceDeals:null, liquidity:null,
      propertyAddress: mAddress>=0 ? get(mAddress) : "", propertyType:null, purchasePrice:null, arv:null, rehabBudget:null,
      rentEstimate:null, loanAmount:null, ltv:null, rate:null, termMonths:null,
      exitStrategy:null, closeDate:null, nextFollowUp:null, nextFollowUpNote:null, pointsCharged:null,
      callAttempts:[], documents:[], thirdParties:[], applicationToken: randomToken(),
      activity:[{ date:d, type:"note", text:"Imported by " + currentUser().name, author: currentUser().name }]
    });
    added++;
  });
  state.leads = newLeads.concat(state.leads);
  ui.importState = null;
  ui.modal = null;
  var msg = "Imported " + added + " contact(s)";
  if (skippedDupe) msg += ", skipped " + skippedDupe + " duplicate(s)";
  if (skippedBlank) msg += ", skipped " + skippedBlank + " blank row(s)";
  showToast(msg);
  ui.view = "leads";
  persist();
}

function allProcessors(){
  return state.users.filter(function(u){ return u.role==="processor" && !isDemoAccountId(u.id); });
}
function leastLoadedProcessor(){
  var procs = allProcessors();
  if (!procs.length) return null;
  var loadCount = {};
  procs.forEach(function(p){ loadCount[p.id] = 0; });
  state.leads.forEach(function(l){
    if (l.status==="active" && l.assignedProcessor && loadCount.hasOwnProperty(l.assignedProcessor)) loadCount[l.assignedProcessor]++;
  });
  procs.sort(function(a,b){ return loadCount[a.id]-loadCount[b.id]; });
  return procs[0];
}
function ensureProcessorAssigned(lead){
  // Auto-assigns to whichever processor currently has the fewest active
  // files, so workload self-balances as more processors are hired --
  // with a single processor today this always resolves to them, unchanged

  if (lead.assignedProcessor) return;
  var p = leastLoadedProcessor();
  if (p) lead.assignedProcessor = p.id;

function applyRequiredDocs(leadId, opts){
  var lead = leadById(leadId);

  var list = REQUIRED_DOCS_BY_TYPE[lead.loanType];

  lead.documents = lead.documents || [];
  var existing = lead.documents.map(function(d){ return (d.name||"").toLowerCase(); });
  var added = [];
  list.forEach(function(name){
    if (existing.indexOf(name.toLowerCase()) === -1){
      lead.documents.push({ name:name, status:"requested", requestedAt: todayISO() });

    }
  });

  if (!added.length){ showToast("All required documents already requested"); return added; }
  lead.activity = lead.activity || [];
  var d = todayISO();
  lead.activity.push({ date:d, type:"document", text:"Requested required document checklist (" + added.length + " item(s)) for " + lead.loanType, author: currentUser().name });

/* ---------------------------------------------------------------------
   Real PDF generation (jsPDF) for the ACH form and RTL Application —
   these are filed onto the loan automatically, unlike the print-to-PDF
   scope-of-work export above which needs a human at the print dialog.
--------------------------------------------------------------------- */
function makePdfWriter(title, subtitle){
  var doc = new window.jspdf.jsPDF({ unit:"pt", format:"letter" });
  var y = 50;
  var pageBottom = 740;
  doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text(title, 50, y); y += 20;
  if (subtitle){
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.text(subtitle, 50, y, { maxWidth: 510 }); y += 20;
  }
  function ensureRoom(h){ if (y + h > pageBottom){ doc.addPage(); y = 50; } }
  function heading(text){
    ensureRoom(34);
    y += 6;
    doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text(text, 50, y); y += 6;
    doc.setLineWidth(0.5); doc.line(50, y, 560, y); y += 16;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
  }
  function row(label, value){
    ensureRoom(18);
    doc.setFont("helvetica","bold"); doc.text(String(label) + ":", 50, y);
    doc.setFont("helvetica","normal");
    doc.text(String(value===null||value===undefined||value==="" ? "—" : value), 220, y, { maxWidth: 340 });
    y += 18;
  }
  function twoCol(label1, val1, label2, val2){
    ensureRoom(18);
    doc.setFont("helvetica","bold"); doc.text(String(label1) + ":", 50, y);

function uploadGeneratedPdfDocument(leadId, docName, blob, opts){
  var lead = leadById(leadId);
  if (!lead || !sb) return;
  lead.documents = lead.documents || [];
  var doc = lead.documents.filter(function(d){ return d.name === docName; })[0];
  if (!doc){ doc = { name: docName, status:"requested" }; lead.documents.push(doc); }
  var fileName = docName.replace(/[^a-zA-Z0-9._-]/g, "_") + ".pdf";
  var path = leadId + "/" + Date.now() + "-" + fileName;
  sb.storage.from("lead-documents").upload(path, blob, { contentType:"application/pdf" }).then(function(res){
    if (res.error) return;
    doc.status = "received";
    doc.receivedAt = todayISO();
    doc.fileName = fileName;
    doc.storagePath = path;
    if (opts && opts.staffOnly) doc.staffOnly = true;
    lead.activity = lead.activity || [];
    lead.activity.push({ date:todayISO(), type:"document", text: (opts && opts.actorLabel ? opts.actorLabel : lead.name) + " completed and signed: " + docName, author: (opts && opts.actorLabel) || lead.name });
    persist();
  });
}

/* ---------------------------------------------------------------------
   AI document review — real review via the "review-document" edge
   function (Claude vision), fired automatically on every upload and
   re-runnable manually. See requestAiDocReview / runAiDocReview / scanAllDocuments.
--------------------------------------------------------------------- */
function runAiDocReview(leadId, idx){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx]) return;
  var doc = lead.documents[idx];
  if (!doc.storagePath){
    showToast("No file on record for this document — upload it to run AI review");
    return;
  }
  showToast("Re-running AI review…");
  requestAiDocReview(lead, doc);
}
function missingRequiredDocs(lead){
  var list = REQUIRED_DOCS_BY_TYPE[lead.loanType] || [];
  var byName = {};
  (lead.documents||[]).forEach(function(d){ byName[(d.name||"").toLowerCase()] = d; });
  return list.filter(function(name){
    var d = byName[name.toLowerCase()];
    return !d || d.status !== "received";
  });
}
function docIssuesExplanation(lead){
  var lines = [];
  missingRequiredDocs(lead).forEach(function(name){ lines.push("Missing: " + name); });
  (lead.documents||[]).forEach(function(d){
    if (d.aiReview && d.aiReview.status === "flag" && !d.aiReview.dismissed){
      lines.push(d.name + " — " + d.aiReview.note);
    }
  });
  return lines;
}
function scanAllDocuments(leadId){
  var lead = leadById(leadId);
  if (!lead || !sb) return;
  var docs = (lead.documents||[]).filter(function(d){ return d.status === "received" && d.storagePath; });
  if (!docs.length){
    showToast("No received documents with a file on record to scan");
    return;
  }
  showToast("Scanning " + docs.length + " document(s)…");
  var calls = docs.map(function(d){
    return sb.functions.invoke("review-document", { body: {
      path: d.storagePath, docName: d.name,
      context: { borrowerName: lead.name, loanType: lead.loanType, loanAmount: lead.loanAmount, propertyAddress: lead.propertyAddress, ltv: lead.ltv }
    } }).then(function(res){
      if (res.error || !res.data || !res.data.ok) return false;
      d.aiReview = { status: res.data.status, note: res.data.note, reviewedAt: todayISO(), dismissed:false };
      return res.data.status === "flag";
    }).catch(function(){ return false; });
  });
  Promise.all(calls).then(function(flags){
    var flaggedCount = flags.filter(Boolean).length;
    var missing = missingRequiredDocs(lead);
    lead.activity = lead.activity || [];
    lead.activity.push({
      date: todayISO(),
      type: "note",
      text: "AI scanned " + docs.length + " document(s)" + (flaggedCount ? (" — " + flaggedCount + " flagged") : " — all clear") +
        (missing.length ? ("; " + missing.length + " required document(s) still missing") : ""),
      author: "AI Assistant"
    });
    showToast((flaggedCount || missing.length) ? "Scan complete — issues found, see summary below" : "Scan complete — all clear");
    persist();
  });
}
function sendBackToLOWithAiFindings(leadId){
  var lead = leadById(leadId);
  if (!lead) return;
  var lines = docIssuesExplanation(lead);
  if (!lines.length){ showToast("No issues found — nothing to send back for"); return; }
  sendBackToLO(leadId, lines.join("; "));
}
function dismissAiFlag(leadId, idx){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx] || !lead.documents[idx].aiReview) return;
  lead.documents[idx].aiReview.dismissed = true;
  persist();
}
function aiFlaggedDocs(){
  var out = [];
  state.leads.forEach(function(lead){
    (lead.documents||[]).forEach(function(d, i){
      if (d.aiReview && d.aiReview.status === "flag" && !d.aiReview.dismissed){
        out.push({ lead:lead, doc:d, idx:i });
      }
    });
  });
  return out;
}

// The "current" rate shown anywhere in the app (Today's call-list alerts,
// Retargeting, win-back messages, Deal Analysis) always comes from here --
// the same constants the real Pricer prices off of -- never from a
// separately-editable value. That's the only way a displayed rate can
// never drift out of sync with what the Pricer actually quotes: it can
// only change when these constants change, i.e. when a real rate sheet is
// loaded in. The DB's own "previous"/"current" columns still exist to
// track the delta for "rates just dropped" messaging, but get overwritten
// by these authoritative numbers on every load rather than trusted as-is.
function applyAuthoritativeMarketRates(mr){
  var rtlGoldBase = RTL_BASE_RATES["0.00"].gold;
  var authoritative = {
    dscr: DSCR_BASE_PAR_RATE,
    portfolio: DSCR_BASE_PAR_RATE,
    fixFlip: rtlGoldBase,
    bridge: rtlGoldBase,
    groundUp: Math.round((rtlGoldBase + 0.75) * 1000) / 1000
  };
  Object.keys(authoritative).forEach(function(key){
    if (mr[key]) mr[key].current = authoritative[key];
  });
}
