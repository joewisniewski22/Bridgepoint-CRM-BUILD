var addressLookupTimer = null;
appEl.addEventListener("input", function(e){
  var t = e.target;
  if (!t.dataset) return;
  if (t.dataset.action === "loan-details-live"){
    var liveLead = leadById(t.dataset.lead);
    var liveBox = document.getElementById("earnings-live-" + t.dataset.lead);
    if (!liveLead || !liveBox) return;
    var form = t.closest("form");
    var rateVal = form.querySelector('[name="rate"]').value;
    var amtVal = form.querySelector('[name="loanAmount"]').value;
    var tempLead = Object.assign({}, liveLead, {
      rate: rateVal!=="" ? Number(rateVal) : null,
      loanAmount: amtVal!=="" ? Number(amtVal) : null
    });
    liveBox.innerHTML = renderEarningsLive(tempLead);
    return;
  }
  if (t.dataset.action === "pricer-rate-live"){
    var prLead = leadById(t.dataset.lead);
    var outBox = document.getElementById("pricer-output-" + t.dataset.lead);
    if (!prLead || !outBox) return;
    ui.pricerInputs = ui.pricerInputs || {};
    var prInputs = ui.pricerInputs[t.dataset.lead] || (ui.pricerInputs[t.dataset.lead] = {});
    prInputs.rateOverride = t.value !== "" ? Number(t.value) : null;
    outBox.innerHTML = buildPricerOutputHTML(prLead, prInputs);
    return;
  }
  if (t.dataset.action === "standalone-pricer-rate-live"){
    ui.standalonePricer = ui.standalonePricer || defaultStandalonePricer();
    ui.standalonePricer.rateOverride = t.value !== "" ? Number(t.value) : null;
    var spOutBox = document.getElementById("pricer-output-standalone");
    if (spOutBox) spOutBox.innerHTML = buildStandalonePricerOutputHTML(ui.standalonePricer);
    return;
  }
  if (t.dataset.action !== "address-lookup") return;
  var leadIdForLookup = t.dataset.lead;
  var query = t.value;
  var ruralBox = document.getElementById("rural-alert-" + leadIdForLookup);
  var datalist = document.getElementById("address-suggest-" + leadIdForLookup);
  if (ruralBox) ruralBox.innerHTML = "";
  if (addressLookupTimer) clearTimeout(addressLookupTimer);
  if (!query || query.length < 8) return;
  addressLookupTimer = setTimeout(function(){
    geocodeAddress(query, function(result){
      if (!result) return;
      if (datalist && result.matched && result.matchedAddress){
        var titleCased = result.matchedAddress.replace(/\w\S*/g, function(w){ return w.charAt(0).toUpperCase() + w.substr(1).toLowerCase(); });
        datalist.innerHTML = '<option value="' + esc(titleCased) + '"></option>';
      }
      if (ruralBox && result.matched){
        setRuralStatus(leadIdForLookup, result.rural);
        ruralBox.innerHTML = result.rural
          ? '<div class="hint" style="color:var(--c-rust);margin-top:6px">⚠️ This property appears to be in a rural area — confirm eligibility and any overlay pricing with underwriting before quoting.</div>'
          : "";
      }
    });
  }, 700);
});

    });

      monthlyHoa: numOrNull("monthlyHoa"),
      loanAmount: numOrNull("loanAmount"),
      termMonths: numOrNull("termMonths"),

    });

  } else if (type === "public-application"){
    var numOrNullPub = function(k){ var x = fd.get(k); return (x===null||x==="") ? null : Number(x); };
    var pubLead = leadById(form.dataset.lead);
    var pubAchData = extractAchFromForm(fd, signaturePadDataUrl("sig-ach-" + form.dataset.lead), pubLead && pubLead.achForm);
    var pubRtlData = extractRtlApplicationFromForm(fd, signaturePadDataUrl("sig-rtlapp-" + form.dataset.lead), pubLead && pubLead.rtlApp);
    var pubDscrData = extractDscrApplicationFromForm(fd, signaturePadDataUrl("sig-dscrapp-" + form.dataset.lead), pubLead && pubLead.dscrApp);
    submitPublicApplication(form.dataset.lead, {
      entityType: fd.get("entityType"),
      creditScore: numOrNullPub("creditScore"),
      experienceDeals: numOrNullPub("experienceDeals"),
      liquidity: numOrNullPub("liquidity"),
      propertyAddress: fd.get("propertyAddress"),
      propertyType: fd.get("propertyType"),
      exitStrategy: fd.get("exitStrategy"),
      purchasePrice: numOrNullPub("purchasePrice"),
      arv: numOrNullPub("arv"),
      rehabBudget: numOrNullPub("rehabBudget"),
      rentEstimate: numOrNullPub("rentEstimate"),
      monthlyTaxes: numOrNullPub("monthlyTaxes"),
      monthlyInsurance: numOrNullPub("monthlyInsurance"),
      monthlyHoa: numOrNullPub("monthlyHoa"),
      loanAmount: numOrNullPub("loanAmount"),
      termMonths: numOrNullPub("termMonths"),
      propertyCount: numOrNullPub("propertyCount"),
      guarantorFirstName: fd.get("guarantorFirstName"),
      guarantorMiddleName: fd.get("guarantorMiddleName"),
      guarantorLastName: fd.get("guarantorLastName"),
      guarantorPhone: fd.get("guarantorPhone"),
      guarantorEmail: fd.get("guarantorEmail"),
      birthday: fd.get("birthday"),
      guarantorOwnershipPct: numOrNullPub("guarantorOwnershipPct"),
      entityLegalName: fd.get("entityLegalName"),
      citizenshipStatus: fd.get("citizenshipStatus"),
      transactionType: fd.get("transactionType"),
      prepayTerm: fd.get("prepayTerm"),
      trackRecord: extractTrackRecordFromForm(fd)
    });
    applyAchAndRtlAppPatch(form.dataset.lead, pubAchData, pubRtlData, pubDscrData);
    var sowPatchPub = extractScopeOfWorkFromForm(fd);
    if (sowPatchPub) saveScopeOfWork(form.dataset.lead, sowPatchPub.items, sowPatchPub.notes);
    render();
  } else if (type === "import-parse"){
    var csvFileInput = form.querySelector('[name="csvFile"]');
    var csvFile = csvFileInput && csvFileInput.files && csvFileInput.files[0];
    var csvPasted = fd.get("csvText") || "";
    if (csvFile){
      var csvReader = new FileReader();
      csvReader.onload = function(){ startImportParse(String(csvReader.result||"")); };
      csvReader.readAsText(csvFile);
    } else if (csvPasted.trim()){
      startImportParse(csvPasted);
    } else {
      showToast("Choose a CSV file or paste CSV text first");
    }
  } else if (type === "import-confirm"){
    runImport(fd);
  } else if (type === "send-back"){
    sendBackToLO(form.dataset.lead, fd.get("note"));
    render();
  } else if (type === "portal-message"){
    sendPortalMessage(form.dataset.lead, fd.get("message"));
    form.reset();
    render();
  } else if (type === "portal-add-third-party"){
    addThirdPartyFromPortal(form.dataset.lead, { role: fd.get("role"), name: fd.get("name"), phone: fd.get("phone"), email: fd.get("email"), notify: true });
    form.reset();
    render();
  } else if (type === "log-call"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    ui.modal = null; render();
  } else if (type === "add-third-party"){
    addThirdParty(form.dataset.lead, { role:fd.get("role"), name:fd.get("name"), phone:fd.get("phone"), email:fd.get("email"), notify:true });
  } else if (type === "add-note"){
    addNote(form.dataset.lead, fd.get("note"));
    form.reset();
  } else if (type === "request-doc"){
    requestDoc(form.dataset.lead, fd.get("name"));
    form.reset();
  } else if (type === "property-address"){
    setPropertyAddress(form.dataset.lead, fd.get("propertyAddress"));
  } else if (type === "compose-email"){
    sendComposedEmail(form.dataset.lead || null, fd.get("to"), fd.get("subject"), fd.get("body"));
    ui.modal = null;
    render();
  } else if (type === "team-chat-send"){
    sendTeamMessage(form.dataset.to, fd.get("body"));
    form.reset();
  } else if (type === "submit-for-review"){
    submitForReview(form.dataset.lead, fd.get("reviewNote"));
    form.reset();
  } else if (type === "outside-term-sheet"){
    var tsFileInput = form.querySelector('[name="termSheetFile"]');
    var tsFile = tsFileInput && tsFileInput.files && tsFileInput.files[0];
    if (tsFile) processOutsideTermSheet(form.dataset.lead, tsFile, fd.get("termSheetNotes"));
    form.reset();
  } else if (type === "add-uw-condition"){
    var uwFileInput = form.querySelector('[name="file"]');
    var uwCondFile = uwFileInput && uwFileInput.files && uwFileInput.files[0];
    addUnderwritingCondition(form.dataset.lead, fd.get("description"), uwCondFile || null);
    form.reset();
    var uwFilenameSpan = document.getElementById("uw-condition-filename-" + form.dataset.lead);
    if (uwFilenameSpan) uwFilenameSpan.textContent = "";
  } else if (type === "follow-up"){
    setFollowUp(form.dataset.lead, fd.get("date"), fd.get("note"));
  } else if (type === "birthday"){
    setBirthday(form.dataset.lead, fd.get("birthday"));
  } else if (type === "loan-details"){
    var ldLoanAmount = fd.get("loanAmount") ? Number(fd.get("loanAmount")) : null;
    var ldRate = fd.get("rate") ? Number(fd.get("rate")) : null;
    var ldTerm = fd.get("termMonths") ? Number(fd.get("termMonths")) : null;
    setLoanDetails(form.dataset.lead, ldLoanAmount, ldRate, ldTerm);
  } else if (type === "pricing-inputs"){
    setPricingInputs(form.dataset.lead, fd);
  } else if (type === "send-text"){
    var box = document.getElementById("text-message-box");
    logTextSent(form.dataset.lead, box ? box.value : "");
    ui.modal = null; render();
  } else if (type === "login"){
    attemptLogin(fd.get("username"), fd.get("pin"));
  } else if (type === "customize-portal"){
    requestPortalCustomization(fd.get("prompt"));
    form.reset();
  } else if (type === "ai-command"){
    var attachmentInput = form.querySelector('[name="attachment"]');
    var attachmentFile = attachmentInput && attachmentInput.files && attachmentInput.files[0];
    sendAiCommand(fd.get("message"), attachmentFile || null);
    form.reset();
  } else if (type === "add-payroll-entry"){
    addManualPayrollEntry(fd);
    form.reset();
  } else if (type === "add-referral-partner"){
    addReferralPartner(fd);
    form.reset();
  } else if (type === "bulk-set-availability"){
    bulkSetAvailability(fd);
  } else if (type === "submit-booking"){
    submitBooking(fd);
  } else if (type === "save-signature"){
    var photoInput = form.querySelector('[name="photo"]');
    var photoFile = photoInput && photoInput.files && photoInput.files[0];
    var finishSaveSig = function(photoUrl){
      saveSignature(fd.get("emailSignature"), fd.get("textSignoff"), fd.get("quoPhoneNumber"), photoUrl);
    };
    if (photoFile){
      var photoReader = new FileReader();
      photoReader.onload = function(){
        var base64 = String(photoReader.result).split(",")[1];
        uploadUserPhoto(currentUser().id, base64, photoFile.type, finishSaveSig);
      };
      photoReader.readAsDataURL(photoFile);
    } else {
      finishSaveSig(null);
    }
  } else if (type === "change-pin"){
    changeMyPin(fd.get("oldPin"), fd.get("newPin"));
  } else if (type === "reset-pin"){
    resetUserPin(form.dataset.user, fd.get("pin"));
  } else if (type === "add-team-member"){
    addTeamMember({
      name: fd.get("name"), role: fd.get("role"), title: fd.get("title"),
      phone: fd.get("phone"), email: fd.get("email"), username: fd.get("username"), pin: fd.get("pin"),
      quoPhoneNumber: fd.get("quoPhoneNumber"), originationSplit: fd.get("originationSplit")
    });
    form.reset();
  } else if (type === "set-origination-split"){
    setOriginationSplit(form.dataset.user, fd.get("split"));
  } else if (type === "set-points"){
    setPointsCharged(form.dataset.lead, fd.get("points"));
  } else if (type === "dialer-log"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    dialerAdvance();
  } else if (type === "scope-of-work"){
    var items = SOW_CATEGORIES.map(function(cat, i){
      var raw = fd.get("cost_" + i);
      return { category: cat, cost: (raw===null||raw==="") ? null : Number(raw) };
    });
    saveScopeOfWork(form.dataset.lead, items, fd.get("notes"));
    render();
  }
});

/* ---------------------------------------------------------------------
   Init
--------------------------------------------------------------------- */
render();

})();
</script>
</body>
