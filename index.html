/* ---------------------------------------------------------------------
   Event delegation
--------------------------------------------------------------------- */
var appEl = document.getElementById("app");

appEl.addEventListener("click", function(e){
  var backdrop = e.target.closest && e.target.closest("[data-action='backdrop']");
  if (backdrop && e.target === backdrop){ ui.modal = null; ui.dialer = null; render(); return; }

  var t = e.target.closest && e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;

  if (action === "nav"){ ui.view = t.dataset.view; if (ui.view!=="detail") ui.selectedLeadId=null; render(); }
  else if (action === "select-lead"){ ui.view="detail"; ui.selectedLeadId=t.dataset.lead; ui.activeTab="overview"; render(); }
  else if (action === "filter-lo-jump"){ ui.view="leads"; ui.leadFilter.assignedTo=t.dataset.lo; ui.leadFilter.status=""; render(); }
  else if (action === "set-tab"){ ui.activeTab = t.dataset.tab; render(); }
  else if (action === "open-modal"){ ui.modal = { type:t.dataset.modal, leadId:t.dataset.lead||null, kind:t.dataset.kind||null }; ui.teamMemberError = null; render(); }
  else if (action === "close-modal"){ ui.modal = null; render(); }
  else if (action === "move-stage" && t.dataset.target){ moveStage(t.dataset.lead, t.dataset.target); }
  else if (action === "mark-doc-received"){ markDocReceived(t.dataset.lead, parseInt(t.dataset.idx,10)); }
  else if (action === "view-lead-document"){ viewLeadDocument(t.dataset.lead, parseInt(t.dataset.idx,10)); }
  else if (action === "ai-review-doc"){ runAiDocReview(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "run-guideline-check"){ runGuidelineCheck(t.dataset.lead); }
  else if (action === "dismiss-ai-flag"){ dismissAiFlag(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "toggle-processing"){ toggleProcessingAction(t.dataset.lead, t.dataset.kind); }
  else if (action === "request-third-party-doc"){ requestThirdPartyDoc(t.dataset.lead, t.dataset.role); }
  else if (action === "mark-notif-read"){ markNotificationRead(t.dataset.id); }
  else if (action === "log-email"){ logEmailSent(t.dataset.lead); }
  else if (action === "send-application"){
    sendApplicationAction(t.dataset.lead, t.dataset.channel);
    if (t.dataset.channel === "manually"){ ui.modal = null; render(); }
  }
  else if (action === "send-document"){
    sendDocumentAction(t.dataset.lead, t.dataset.kind, t.dataset.channel);
    if (t.dataset.channel === "manually"){ ui.modal = null; render(); }
  }
  else if (action === "order-credit"){ logCreditOrder(t.dataset.lead); }
  else if (action === "load-required-docs"){ applyRequiredDocs(t.dataset.lead); }
  else if (action === "print-scope-of-work"){ printScopeOfWork(t.dataset.lead); }
  else if (action === "preview-scope-of-work"){ previewScopeOfWork(t.dataset.lead); }
  else if (action === "send-term-sheet-from-pricer"){ applyPricerRateAndSendTermSheet(t.dataset.lead); }
  else if (action === "logout"){ logout(); }
  else if (action === "tour-next"){ ui.tourStep = (ui.tourStep||0)+1; render(); }
  else if (action === "tour-back"){ ui.tourStep = Math.max((ui.tourStep||0)-1,0); render(); }
  else if (action === "tour-skip" || action === "tour-finish"){ ui.view = "today"; render(); }
  else if (action === "start-dialer"){ startDialer(); }
  else if (action === "dialer-skip"){ dialerAdvance(); }
  else if (action === "close-dialer"){ closeDialer(); }
  else if (action === "copy-app-link"){
    var linkBox = document.getElementById("app-link-box");
    if (linkBox){
      var lnk = linkBox.value;
      var okFn = function(){ showToast("Link copied"); };
      var failFn = function(){ linkBox.focus(); linkBox.select(); showToast("Couldn't auto-copy — link is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(lnk).then(okFn).catch(failFn);
      } else { failFn(); }
    }
  }
  else if (action === "copy-invite"){
    var inviteBox = document.getElementById("invite-message-box");
    if (inviteBox){
      var inviteText = inviteBox.value;
      var inviteDone = function(){ showToast("Message copied"); };
      var inviteFail = function(){ inviteBox.focus(); inviteBox.select(); showToast("Couldn't auto-copy — text is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(inviteText).then(inviteDone).catch(inviteFail);
      } else { inviteFail(); }
    }
  }
  else if (action === "copy-message"){
    var box = document.getElementById("text-message-box");
    if (box){
      var text = box.value;
      var done = function(){ showToast("Message copied"); };
      var fail = function(){ box.focus(); box.select(); showToast("Couldn't auto-copy — text is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    }
  }
  else if (action === "ai-social-posts"){
    var loanTypeSel = document.getElementById("social-loantype-select");
    var socialBox = document.getElementById("social-post-box");
    var chosenType = loanTypeSel ? loanTypeSel.value : "DSCR";
    var rk3 = RATE_KEY_BY_LOAN_TYPE[chosenType];
    var rateContext = (rk3 && state.marketRates[rk3])
      ? (chosenType + " rates are currently " + fmtPct(state.marketRates[rk3].current) + " (previously " + fmtPct(state.marketRates[rk3].previous) + ")")
      : "";
    if (socialBox) socialBox.textContent = "Generating…";
    aiSuggest("social-post", { loanType: chosenType, rateContext: rateContext, count: 3 }, function(suggestion){
      if (socialBox) socialBox.textContent = suggestion || "Couldn't generate suggestions — try again.";
    });
  }
  else if (action === "ai-explain-guideline"){
    var expLead = leadById(t.dataset.lead);
    if (!expLead || !expLead.guidelineCheck) return;
    var expBox = document.getElementById("guideline-explain-box");
    if (expBox) expBox.textContent = "Generating…";
    aiSuggest("guideline-explain", {
      loanType: expLead.loanType,
      checks: expLead.guidelineCheck.checks
    }, function(suggestion){
      if (expBox) expBox.textContent = suggestion || "Couldn't generate an explanation — try again.";
    });
  }
  else if (action === "ai-draft-text"){
    var draftLead = leadById(t.dataset.lead);
    if (!draftLead) return;
    var draftBox = document.getElementById("text-message-box");
    if (draftBox) draftBox.value = "Generating…";
    var draftKind = isBirthdayToday(draftLead) ? "birthday" : "winback";
    var rk2 = RATE_KEY_BY_LOAN_TYPE[draftLead.loanType];
    var marketContext = (rk2 && state.marketRates[rk2]) ? (draftLead.loanType + " rates currently at " + fmtPct(state.marketRates[rk2].current)) : "";
    var wbInfo = winbackInfo(draftLead, startOfToday());
    aiSuggest(draftKind, {
      name: draftLead.name, loanType: draftLead.loanType, propertyAddress: draftLead.propertyAddress,
      daysSinceContact: wbInfo ? wbInfo.days : null,
      reason: wbInfo ? wbInfo.reasons.join("; ") : "",
      marketContext: marketContext,
      loName: userName(draftLead.assignedTo)
    }, function(suggestion){
      if (draftBox) draftBox.value = suggestion || defaultOutreachMessage(draftLead);
    });
  }
});

appEl.addEventListener("change", function(e){
  var t = e.target;
  if (!t.dataset) return;
  var action = t.dataset.action;
  if (action === "filter"){
    ui.leadFilter[t.dataset.key] = t.value; render();
  } else if (action === "filter-comm"){
    ui.commFilter = t.value; render();
  } else if (action === "move-stage" && t.tagName==="SELECT"){
    moveStage(t.dataset.lead, t.value);
  } else if (action === "reassign-lead"){
    reassignLead(t.dataset.lead, t.value);
  } else if (action === "toggle-notify"){
    toggleNotify(t.dataset.lead, parseInt(t.dataset.idx,10));
  } else if (action === "portal-select"){
    ui.portalLeadId = t.value; render();
  } else if (action === "upload-doc"){
    var file = t.files && t.files[0];
    if (file) borrowerUploadDoc(t.dataset.lead, parseInt(t.dataset.idx,10), file.name);
  } else if (action === "pricer-input"){
    ui.pricerInputs = ui.pricerInputs || {};
    ui.pricerInputs[t.dataset.lead] = ui.pricerInputs[t.dataset.lead] || {};
    ui.pricerInputs[t.dataset.lead][t.dataset.key] = t.value;
    render();
  }
});

appEl.addEventListener("submit", function(e){
  var form = e.target;
  if (!form.dataset || !form.dataset.form) return;
  e.preventDefault();
  var type = form.dataset.form;
  var fd = new FormData(form);
  if (type === "add-lead"){
    addLead({
      name: fd.get("name"), email: fd.get("email"), phone: fd.get("phone"),
      source: fd.get("source"), loanType: fd.get("loanType"), assignedTo: fd.get("assignedTo"),
      loanAmount: fd.get("loanAmount") ? Number(fd.get("loanAmount")) : null,
      propertyAddress: fd.get("propertyAddress")
    });
  } else if (type === "take-application"){
    var numOrNull = function(k){ var x = fd.get(k); return (x===null||x==="") ? null : Number(x); };
    submitPhoneApplication(form.dataset.lead, {
      entityType: fd.get("entityType"),
      creditScore: numOrNull("creditScore"),
      experienceDeals: numOrNull("experienceDeals"),
      liquidity: numOrNull("liquidity"),
      propertyAddress: fd.get("propertyAddress"),
      propertyType: fd.get("propertyType"),
      exitStrategy: fd.get("exitStrategy"),
      purchasePrice: numOrNull("purchasePrice"),
      arv: numOrNull("arv"),
      rehabBudget: numOrNull("rehabBudget"),
      rentEstimate: numOrNull("rentEstimate"),
      monthlyTaxes: numOrNull("monthlyTaxes"),
      monthlyInsurance: numOrNull("monthlyInsurance"),
      monthlyHoa: numOrNull("monthlyHoa"),
      loanAmount: numOrNull("loanAmount"),
      termMonths: numOrNull("termMonths"),
      propertyCount: numOrNull("propertyCount")
    });
    var sowPatch = extractScopeOfWorkFromForm(fd);
    if (sowPatch) saveScopeOfWork(form.dataset.lead, sowPatch.items, sowPatch.notes);
    render();
  } else if (type === "public-application"){
    var numOrNullPub = function(k){ var x = fd.get(k); return (x===null||x==="") ? null : Number(x); };
    submitPublicApplication(form.dataset.lead, {
      entityType: fd.get("entityType"),
      creditScore: numOrNullPub("creditScore"),
      experienceDeals: numOrNullPub("experienceDeals"),
      liquidity: numOrNullPub("liquidity"),
      propertyAddress: fd.get("propertyAddress"),
      propertyType: fd.get("propertyType"),
      exitStrategy: fd.get("exitStrategy"),
      purchasePrice: numOrNullPub("purchasePrice"),
      arv: numOrNullPub("arv"),
      rehabBudget: numOrNullPub("rehabBudget"),
      rentEstimate: numOrNullPub("rentEstimate"),
      monthlyTaxes: numOrNullPub("monthlyTaxes"),
      monthlyInsurance: numOrNullPub("monthlyInsurance"),
      monthlyHoa: numOrNullPub("monthlyHoa"),
      loanAmount: numOrNullPub("loanAmount"),
      termMonths: numOrNullPub("termMonths"),
      propertyCount: numOrNullPub("propertyCount")
    });
    var sowPatchPub = extractScopeOfWorkFromForm(fd);
    if (sowPatchPub) saveScopeOfWork(form.dataset.lead, sowPatchPub.items, sowPatchPub.notes);
    render();
  } else if (type === "send-back"){
    sendBackToLO(form.dataset.lead, fd.get("note"));
    render();
  } else if (type === "log-call"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    ui.modal = null; render();
  } else if (type === "add-third-party"){
    addThirdParty(form.dataset.lead, { role:fd.get("role"), name:fd.get("name"), phone:fd.get("phone"), email:fd.get("email"), notify:true });
  } else if (type === "add-note"){
    addNote(form.dataset.lead, fd.get("note"));
    form.reset();
  } else if (type === "request-doc"){
    requestDoc(form.dataset.lead, fd.get("name"));
    form.reset();
  } else if (type === "follow-up"){
    setFollowUp(form.dataset.lead, fd.get("date"), fd.get("note"));
  } else if (type === "birthday"){
    setBirthday(form.dataset.lead, fd.get("birthday"));
  } else if (type === "rate"){
    updateMarketRate(form.dataset.key, Number(fd.get("rate")));
    form.reset();
  } else if (type === "send-text"){
    var box = document.getElementById("text-message-box");
    logTextSent(form.dataset.lead, box ? box.value : "");
    ui.modal = null; render();
  } else if (type === "login"){
    attemptLogin(fd.get("username"), fd.get("pin"));
  } else if (type === "save-signature"){
    saveSignature(fd.get("emailSignature"), fd.get("textSignoff"));
  } else if (type === "change-pin"){
    changeMyPin(fd.get("oldPin"), fd.get("newPin"));
  } else if (type === "reset-pin"){
    resetUserPin(form.dataset.user, fd.get("pin"));
  } else if (type === "add-team-member"){
    addTeamMember({
      name: fd.get("name"), role: fd.get("role"), title: fd.get("title"),
      phone: fd.get("phone"), email: fd.get("email"), username: fd.get("username"), pin: fd.get("pin")
    });
    form.reset();
  } else if (type === "set-points"){
    setPointsCharged(form.dataset.lead, fd.get("points"));
  } else if (type === "dialer-log"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    dialerAdvance();
  } else if (type === "scope-of-work"){
    var items = SOW_CATEGORIES.map(function(cat, i){
      var raw = fd.get("cost_" + i);
      return { category: cat, cost: (raw===null||raw==="") ? null : Number(raw) };
    });
    saveScopeOfWork(form.dataset.lead, items, fd.get("notes"));
    render();
  }
});

/* ---------------------------------------------------------------------
   Init
--------------------------------------------------------------------- */
render();

})();
</script>
</body>
