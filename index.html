<title>Bridgepoint Lending Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------
   Bridgepoint Lending Desk — design tokens
--------------------------------------------------------------------- */
:root{
  --bg:#faf7f0;
  --surface:#ffffff;
  --surface-2:#f2ede1;
  --border:#e2dbc9;
  --border-soft:#ece6d7;
  --ink:#1c1a15;
  --ink-muted:#726b5a;
  --ink-faint:#9b937e;

  --brand:#1f3a3d;
  --brand-strong:#152a2c;
  --brand-tint:#e7eeed;
  --brand-ink:#ffffff;

  --c-forest:#2f5d43;      --c-forest-bg:#e3ede4;
  --c-gold:#8a6412;        --c-gold-bg:#f4e8c8;
  --c-rust:#9c3f2c;        --c-rust-bg:#f3e0d8;
  --c-slate:#3b5166;       --c-slate-bg:#e2e9ef;
  --c-neutral:#5c5748;     --c-neutral-bg:#e9e4d6;

  --danger:#9c3f2c;
  --danger-bg:#f3e0d8;

  --font-display:'Fraunces', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --shadow-card:0 1px 2px rgba(28,26,21,.06), 0 1px 1px rgba(28,26,21,.04);
  --shadow-modal:0 20px 60px rgba(20,18,14,.35);
  --radius:10px;
  --radius-sm:7px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171613;
    --surface:#211f1a;
    --surface-2:#2a2721;
    --border:#3a362c;
    --border-soft:#332f27;
    --ink:#f1ede2;
    --ink-muted:#b3ab97;
    --ink-faint:#7d7666;

    --brand:#7fa79f;
    --brand-strong:#9dc0b8;
    --brand-tint:#233230;
    --brand-ink:#0f1c1a;

    --c-forest:#8fc7a2;   --c-forest-bg:#233b2b;
    --c-gold:#e0bd6d;     --c-gold-bg:#3c3320;
    --c-rust:#e29d87;     --c-rust-bg:#402a22;
    --c-slate:#a9c3da;    --c-slate-bg:#26333f;
    --c-neutral:#c9c0a9;  --c-neutral-bg:#332f27;

    --danger:#e29d87;
    --danger-bg:#402a22;

    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-modal:0 20px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#171613;
  --surface:#211f1a;
  --surface-2:#2a2721;
  --border:#3a362c;
  --border-soft:#332f27;
  --ink:#f1ede2;
  --ink-muted:#b3ab97;
  --ink-faint:#7d7666;

  --brand:#7fa79f;
  --brand-strong:#9dc0b8;
  --brand-tint:#233230;
  --brand-ink:#0f1c1a;

  --c-forest:#8fc7a2;   --c-forest-bg:#233b2b;
  --c-gold:#e0bd6d;     --c-gold-bg:#3c3320;
  --c-rust:#e29d87;     --c-rust-bg:#402a22;
  --c-slate:#a9c3da;    --c-slate-bg:#26333f;
  --c-neutral:#c9c0a9;  --c-neutral-bg:#332f27;

  --danger:#e29d87;
  --danger-bg:#402a22;

  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-modal:0 20px 60px rgba(0,0,0,.6);
}

/* ---------------------------------------------------------------------
   Base
--------------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg) !important;
  color:var(--ink) !important;
  font:14px/1.5 var(--font-body) !important;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;color:var(--ink);text-wrap:balance}
h2{font-size:16px}
h3{font-size:15px}
a{color:var(--brand)}
button{font-family:inherit}
::selection{background:var(--brand-tint)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{display:flex;min-height:100vh;align-items:stretch}

/* ---------------------------------------------------------------------
   Sidebar
--------------------------------------------------------------------- */
.sidebar{
  width:236px;flex:0 0 236px;background:var(--brand);color:var(--brand-ink);
  display:flex;flex-direction:column;padding:20px 14px;gap:18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--brand-ink);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px}
.brand-word{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.15;color:var(--brand-ink)}
.brand-tag{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--radius-sm);
  background:transparent;color:rgba(255,255,255,.78);font-size:13.5px;text-align:left;cursor:pointer;
}
.nav-item .ic{width:18px;text-align:center;flex:0 0 18px;opacity:.9}
.nav-item span:nth-child(2){flex:1}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff}
.nav-item .count{
  background:rgba(255,255,255,.9);color:var(--brand-strong);font-family:var(--font-mono);font-size:11px;
  font-weight:600;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;
}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column}
.role-box{background:rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:12px;font-size:12.5px;color:rgba(255,255,255,.85)}
.role-box b{color:#fff;font-size:13.5px}
.footnote{font-size:11px;color:rgba(255,255,255,.45);line-height:1.5}
.sidebar .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
.sidebar .btn:hover{background:rgba(255,255,255,.18)}
.sidebar .btn-ghost{background:transparent}

/* ---------------------------------------------------------------------
   Main / topbar / content
--------------------------------------------------------------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-start;gap:16px;padding:22px 28px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
}
.view-title{font-size:22px}
.view-sub{color:var(--ink-muted);font-size:13px;margin-top:3px}
.topbar-spacer{flex:1}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1320px}

/* ---------------------------------------------------------------------
   Buttons / inputs
--------------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;
  cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-faint)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger)}
.btn-danger:hover{filter:brightness(.95)}

.input,.select,.textarea{
  width:auto;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);font:13px var(--font-body);
}
.textarea{width:100%;resize:vertical;min-height:64px;font-family:var(--font-body)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.login-pin-input{letter-spacing:.3em;font-family:var(--font-mono)}

/* ---------------------------------------------------------------------
   KPIs / sections / panels
--------------------------------------------------------------------- */
.kpi-row{display:flex;gap:14px;flex-wrap:wrap}
.kpi{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-card)}
.kpi-label{font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-size:28px;font-weight:600;margin-top:4px}
.kpi-sub{font-size:12px;color:var(--ink-faint);margin-top:4px}

.section,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card)}
.section{padding:18px 20px}
.panel-pad{padding:18px 20px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hint{font-size:12px;color:var(--ink-faint)}
.empty{padding:28px;text-align:center;color:var(--ink-faint);font-size:13px}

/* ---------------------------------------------------------------------
   Tables
--------------------------------------------------------------------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);
  padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-action]{cursor:pointer}
tbody tr[data-action]:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--font-mono)}
.cell-name{font-weight:500}
.cell-sub{font-size:12px;color:var(--ink-faint);margin-top:1px}

.filters{display:flex;flex-wrap:wrap;gap:8px}

/* ---------------------------------------------------------------------
   Badges
--------------------------------------------------------------------- */
.badge-wrap{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.badge-forest{background:var(--c-forest-bg);color:var(--c-forest)}
.badge-gold{background:var(--c-gold-bg);color:var(--c-gold)}
.badge-rust{background:var(--c-rust-bg);color:var(--c-rust)}
.badge-slate{background:var(--c-slate-bg);color:var(--c-slate)}
.badge-neutral{background:var(--c-neutral-bg);color:var(--c-neutral)}

/* ---------------------------------------------------------------------
   Pipeline board
--------------------------------------------------------------------- */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 240px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em}
.col-head .n{font-weight:600;color:var(--ink-faint);text-transform:none}
.col-cards{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;overflow-y:auto}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;box-shadow:var(--shadow-card)}
.pcard:hover{border-color:var(--ink-faint)}
.pcard .nm{font-weight:600;font-size:13px}
.pcard .ty{font-size:12px;color:var(--ink-muted);margin-top:2px}
.pcard .amt{font-family:var(--font-mono);font-size:12.5px;margin-top:5px}
.pcard .lo{font-size:11.5px;color:var(--ink-faint);margin-top:3px}

/* ---------------------------------------------------------------------
   Tabs (lead detail)
--------------------------------------------------------------------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 4px;margin-right:18px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-muted);font-size:13.5px;font-weight:500;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------------------------------------------------------------------
   Lead detail layout / rail
--------------------------------------------------------------------- */
.detail-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:flex-start}
.rail-block{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
.rail-block:last-child{border-bottom:0}
.rail-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:6px}
.rail-name{font-family:var(--font-display);font-weight:600;font-size:17px}
.stage-line{margin-top:8px}
.contact-row{display:flex;flex-wrap:wrap;gap:6px}
.points-input-row{display:flex;align-items:center;gap:6px}
.points-input-row .input{width:80px}
.commission-box{background:var(--brand-tint);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.commission-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.commission-label{font-size:12px;color:var(--ink-muted)}
.commission-stat{font-family:var(--font-mono);font-size:18px;font-weight:600}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.field{display:flex;flex-direction:column;gap:2px}
.field .rail-title{margin-bottom:0}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:12px;color:var(--ink-muted)}
.form-row .input,.form-row .select,.form-row .textarea{width:100%}
.form-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------------------------------------------------------------------
   Activity feed
--------------------------------------------------------------------- */
.activity-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.activity-item:last-child{border-bottom:0}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:0 0 7px;margin-top:6px}
.activity-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto}
.activity-text{font-size:13px;flex:1}

/* ---------------------------------------------------------------------
   Today's queue
--------------------------------------------------------------------- */
.queue-card{
  display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c-slate);
  border-radius:var(--radius-sm);padding:12px 14px;
}
.queue-card.type-rate-drop{border-left-color:var(--c-gold)}
.queue-card.type-winback{border-left-color:var(--c-rust)}
.queue-title{font-weight:600;font-size:13.5px}
.queue-reason{font-size:12.5px;color:var(--ink-muted);margin-top:2px}
.queue-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.queue-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------------------------------------------------------------------
   Documents / third parties
--------------------------------------------------------------------- */
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.doc-row:last-child{border-bottom:0}
.doc-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:8px}
.doc-preview-text{white-space:pre-wrap;font-size:12.5px;color:var(--ink-muted)}
.tp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.tp-row:last-child{border-bottom:0}
.role-box.tp-select{padding:0}
.signature{font-family:var(--font-display);font-style:italic;font-size:16px;margin-top:10px}

/* ---------------------------------------------------------------------
   Modals
--------------------------------------------------------------------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:440px;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-modal);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}

/* ---------------------------------------------------------------------
   Login
--------------------------------------------------------------------- */
.login-screen{min-height:100vh;width:100%;height:100vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;background:var(--brand);padding:20px}
.login-card{background:var(--surface);border-radius:14px;padding:32px 30px;width:100%;max-width:360px;box-shadow:var(--shadow-modal)}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.login-title{font-size:20px;margin-top:4px}
.login-sub{font-size:12.5px;color:var(--ink-muted);margin:6px 0 18px;line-height:1.5}
.login-form{display:flex;flex-direction:column}
.login-error{background:var(--c-rust-bg);color:var(--c-rust);font-size:12.5px;padding:8px 10px;border-radius:6px;margin-top:10px}

/* ---------------------------------------------------------------------
   Borrower portal preview
--------------------------------------------------------------------- */
.portal{max-width:640px}
.portal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-card)}
.portal-progress{display:flex;gap:4px;margin:16px 0}
.portal-step{flex:1;height:6px;border-radius:3px;background:var(--border)}
.portal-step.done{background:var(--brand)}

/* ---------------------------------------------------------------------
   Toast
--------------------------------------------------------------------- */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;
  border-radius:8px;font-size:13px;box-shadow:var(--shadow-modal);z-index:80;
}

@media (max-width:860px){
  .sidebar{position:static;height:auto;width:100%;flex:0 0 auto}
  #app{flex-direction:column}
  .detail-grid{grid-template-columns:1fr}
  .board{max-height:none}
}
</style>

<script id="app-script">(function(){
"use strict";

/* ---------------------------------------------------------------------
   Config
--------------------------------------------------------------------- */
var STAGES = [
  { key:"new",         label:"New Lead" },
  { key:"attempting",  label:"Attempting Contact" },
  { key:"qualifying",  label:"Contacted / Qualifying" },
  { key:"app_sent",    label:"Application Sent" },
  { key:"app_completed", label:"Application Completed" },
  { key:"docs",        label:"Docs Collection" },
  { key:"processing",  label:"Processing" },
  { key:"underwriting",label:"Underwriting" },
  { key:"approved",    label:"Conditional Approval" },
  { key:"ctc",         label:"Clear to Close" },
  { key:"closed",      label:"Closed / Funded" },
  { key:"postclosing", label:"Post-Closing" }
];
var STAGE_MAP = {};
STAGES.forEach(function(s,i){ STAGE_MAP[s.key] = { label:s.label, index:i }; });

var LOAN_TYPES = ["DSCR","Fix & Flip","Ground Up Construction","Portfolio/Blanket","Bridge","Mixed-Use"];
var SOURCES = ["Meta Ads","Connected Investors","Referral","Repeat Client","Website","Self-Generated"];
var ENTITY_TYPES = ["LLC","Individual","Corporation"];
var PROPERTY_TYPES = ["SFR","2-4 Unit","Multifamily 5+","Mixed-Use","Condo","Land"];
var EXIT_STRATEGIES = ["Sell","Refinance to DSCR","Hold/Rent","1031 Exchange"];
var TP_ROLES = ["Realtor","Title Company","Escrow Officer","Insurance Agent","Attorney","Appraiser"];
var CALL_OUTCOMES = [
  { key:"no-answer", label:"No answer" },
  { key:"left-voicemail", label:"Left voicemail" },
  { key:"connected", label:"Connected" },
  { key:"not-interested", label:"Not interested" },
  { key:"wrong-number", label:"Wrong number" }
];
var RATE_KEY_BY_LOAN_TYPE = {
  "DSCR":"dscr", "Fix & Flip":"fixFlip", "Ground Up Construction":"groundUp",
  "Portfolio/Blanket":"portfolio", "Bridge":"bridge", "Mixed-Use":"mixedUse"
};
var SHORT_TERM_TYPES = ["Fix & Flip","Ground Up Construction","Bridge"];
var APPLICATION_FORM_URL = "https://claude.ai/code/artifact/d9ae64b9-b0f5-4487-9fa7-d92fdf4194e6";
var XACTUS_PORTAL_URL = "https://xactus.com/sign-in/";
var CADENCE_STAGES = ["new","attempting","qualifying"];
var CADENCE_MAX = 5;

/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
var state = JSON.parse(document.getElementById("state-json").textContent);

var ui = {
  view: "today",
  viewAs: "owner",
  loggedIn: false,
  loginSelectedUser: null,
  loginError: null,
  loginUsername: "",
  dialer: null,
  selectedLeadId: null,
  activeTab: "overview",
  modal: null,
  portalLeadId: null,
  leadFilter: { q:"", stage:"", loanType:"", assignedTo:"", status:"active" },
  commFilter: "",
  toast: null
};
try {
  var savedRole = localStorage.getItem("bp_view_as");
  var savedAuthedFor = localStorage.getItem("bp_authed_for");
  if (savedRole && savedAuthedFor && savedAuthedFor === savedRole){
    ui.viewAs = savedRole;
    ui.loggedIn = true;
  }
} catch(e){}

/* ---------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------- */
function esc(s){
  if (s===null || s===undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c];
  });
}
function fmtUSD(n){
  if (n===null || n===undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n);
}
function fmtPct(n){
  if (n===null || n===undefined) return "—";
  var s = Number(n).toFixed(3);
  s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s + "%";
}
function fmtDate(iso){
  if (!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric" });
}
function todayISO(){
  var d = new Date();
  return d.toISOString().slice(0,10);
}
function startOfToday(){
  var d = new Date(); d.setHours(0,0,0,0); return d;
}
function dateOnly(d){
  var c = new Date(d.getTime()); c.setHours(0,0,0,0); return c;
}
function addMonths(date, months){
  var d = new Date(date.getTime());
  return new Date(d.getFullYear(), d.getMonth()+months, d.getDate());
}
function daysDiff(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function stageLabel(key){
  if (key==="cold") return "Cold";
  if (key==="lost") return "Lost / Dead";
  return (STAGE_MAP[key] && STAGE_MAP[key].label) || key;
}
function stageIndex(key){ return STAGE_MAP[key] ? STAGE_MAP[key].index : -1; }
function userById(id){ return state.users.filter(function(u){ return u.id===id; })[0] || null; }
function userName(id){ var u = userById(id); return u ? u.name : "Unassigned"; }
function loName(id){ return userName(id); }
function isOwner(){ return ui.viewAs==="owner"; }
function isProcessor(){ var u = userById(ui.viewAs); return !!(u && u.role==="processor"); }
function isLO(){ var u = userById(ui.viewAs); return !!(u && u.role==="loan_officer"); }
function currentUser(){ return userById(ui.viewAs) || { id:"owner", name:"Joe", role:"owner" }; }
function leadById(id){ return state.leads.filter(function(l){ return l.id===id; })[0] || null; }
function nextLeadId(){
  var max = 0;
  state.leads.forEach(function(l){
    var m = /^L(\d+)$/.exec(l.id);
    if (m) max = Math.max(max, parseInt(m[1],10));
  });
  return "L" + String(max+1).padStart(3,"0");
}
function loanOfficers(){ return state.users.filter(function(u){ return u.role==="loan_officer"; }); }
function ownerOptions(currentId){
  var owner = state.users.filter(function(u){ return u.role==="owner"; });
  var list = owner.concat(loanOfficers());
  return list.map(function(u){ return '<option value="' + u.id + '"' + (u.id===currentId?" selected":"") + '>' + esc(u.name) + (u.role==="owner"?" (You)":"") + '</option>'; }).join("");
}

/* ---------------------------------------------------------------------
   Login / access
--------------------------------------------------------------------- */
function userByUsername(name){
  var n = String(name||"").trim().toLowerCase();
  if (!n) return null;
  return state.users.filter(function(u){ return String(u.username||"").toLowerCase()===n; })[0] || null;
}
function attemptLogin(username, pin){
  ui.loginUsername = username||"";
  var u = userByUsername(username);
  if (!u || String(u.pin==null?"":u.pin) !== String(pin==null?"":pin) || !pin){
    ui.loginError = "Incorrect username or PIN.";
    render();
    return;
  }
  ui.viewAs = u.id;
  ui.loggedIn = true;
  ui.loginError = null;
  ui.loginSelectedUser = null;
  ui.loginUsername = "";
  ui.view = u.onboarded ? "today" : "onboardSignature";
  ui.selectedLeadId = null;
  try { localStorage.setItem("bp_view_as", u.id); localStorage.setItem("bp_authed_for", u.id); } catch(e){}
  render();
}
function logout(){
  ui.loggedIn = false;
  ui.loginSelectedUser = null;
  ui.loginError = null;
  ui.loginUsername = "";
  try { localStorage.removeItem("bp_authed_for"); } catch(e){}
  render();
}
function saveSignature(emailSignature, textSignoff){
  var u = currentUser();
  if (!u) return;
  u.emailSignature = emailSignature || "";
  u.textSignoff = textSignoff || "";
  var wasOnboarding = !u.onboarded;
  u.onboarded = true;
  if (wasOnboarding){
    ui.view = "tour";
    ui.tourStep = 0;
  } else {
    ui.modal = null;
    showToast("Signature saved");
  }
  persist();
}
function changeMyPin(oldPin, newPin){
  var u = userById(ui.viewAs);
  if (!u) return;
  if (String(u.pin==null?"":u.pin) !== String(oldPin==null?"":oldPin)){ showToast("Current PIN is incorrect"); return; }
  if (!/^\d{4,6}$/.test(newPin||"")){ showToast("PIN must be 4–6 digits"); return; }
  u.pin = newPin;
  ui.modal = null;
  showToast("PIN updated");
  persist();
}
function resetUserPin(userId, newPin){
  if (!isOwner()) return;
  var u = userById(userId);
  if (!u) return;
  if (!/^\d{4,6}$/.test(newPin||"")){ showToast("PIN must be 4–6 digits"); return; }
  u.pin = newPin;
  showToast("PIN reset for " + u.name);
  persist();
}

/* ---------------------------------------------------------------------
   Commission (points charged)
--------------------------------------------------------------------- */
var COMMISSION_SPLIT = 0.5;
function commissionAmount(lead){
  if (!lead.pointsCharged || !lead.loanAmount) return 0;
  return lead.loanAmount * (lead.pointsCharged/100) * COMMISSION_SPLIT;
}
function commissionSummaryFor(userId){
  var today = startOfToday();
  var monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  var mine = state.leads.filter(function(l){ return l.assignedTo===userId; });
  var closedThisMonth = mine.filter(function(l){
    return l.status==="closed" && l.closeDate && new Date(l.closeDate+"T00:00:00") >= monthStart;
  });
  var earned = closedThisMonth.reduce(function(s,l){ return s + commissionAmount(l); }, 0);
  var activePipeline = mine.filter(function(l){ return l.status==="active"; });
  var potential = activePipeline.reduce(function(s,l){ return s + commissionAmount(l); }, 0);
  return { earned: earned, potential: potential, closedCount: closedThisMonth.length, pipelineCount: activePipeline.length };
}
function setPointsCharged(leadId, points){
  var lead = leadById(leadId);
  if (!lead) return;
  var n = points===""||points===null||points===undefined ? null : Number(points);
  if (n !== null && (isNaN(n) || n < 0 || n > 15)){ showToast("Points should be between 0 and 15"); return; }
  lead.pointsCharged = n;
  lead.activity = lead.activity || [];
  lead.activity.push({ date: todayISO(), type:"note", text: n===null ? "Points charged cleared" : ("Points charged set to " + n + "%"), author: currentUser().name });
  showToast(n===null ? "Points charged cleared" : "Points charged set to " + n + "%");
  persist();
}

/* ---------------------------------------------------------------------
   Speed to lead
--------------------------------------------------------------------- */
function nowTs(){ return new Date().toISOString(); }
function speedToLeadMs(lead){
  if (!lead.createdAtTs || !lead.firstAttemptAt) return null;
  var ms = new Date(lead.firstAttemptAt).getTime() - new Date(lead.createdAtTs).getTime();
  return isNaN(ms) ? null : ms;
}
function fmtDuration(ms){
  if (ms===null || ms===undefined || isNaN(ms)) return "—";
  if (ms < 0) ms = 0;
  var mins = ms/60000;
  if (mins < 60) return Math.max(1,Math.round(mins)) + " min";
  var hrs = mins/60;
  if (hrs < 24) return (Math.round(hrs*10)/10) + " hr";
  var days = hrs/24;
  return (Math.round(days*10)/10) + " day" + (days>=1.95?"s":"");
}
function speedBadgeClass(ms){
  if (ms===null) return "badge-neutral";
  var hrs = ms/3600000;
  if (hrs <= 1) return "badge-forest";
  if (hrs <= 24) return "badge-gold";
  return "badge-rust";
}
function speedToLeadStats(leads){
  var withAttempt = leads.filter(function(l){ return speedToLeadMs(l)!==null; });
  var uncontacted = leads.filter(function(l){ return !l.firstAttemptAt && l.status==="active"; });
  var avgMs = withAttempt.length ? withAttempt.reduce(function(s,l){ return s+speedToLeadMs(l); },0) / withAttempt.length : null;
  var within1hr = withAttempt.filter(function(l){ return speedToLeadMs(l) <= 3600000; }).length;
  var pctWithin1hr = withAttempt.length ? Math.round((within1hr/withAttempt.length)*100) : null;
  return { avgMs: avgMs, pctWithin1hr: pctWithin1hr, contactedCount: withAttempt.length, uncontactedCount: uncontacted.length };
}

/* ---------------------------------------------------------------------
   Conversion by source
--------------------------------------------------------------------- */
function conversionBySource(leads){
  var bySource = {};
  SOURCES.forEach(function(s){ bySource[s] = { source:s, total:0, closed:0, active:0, lostCold:0, closedValue:0 }; });
  leads.forEach(function(l){
    var b = bySource[l.source];
    if (!b){ b = bySource[l.source] = { source:l.source||"Other", total:0, closed:0, active:0, lostCold:0, closedValue:0 }; }
    b.total++;
    if (l.status==="closed"){ b.closed++; b.closedValue += (l.loanAmount||0); }
    else if (l.status==="active"){ b.active++; }
    else { b.lostCold++; }
  });
  return Object.keys(bySource).map(function(k){ return bySource[k]; }).filter(function(b){ return b.total>0; })
    .map(function(b){ b.rate = b.total ? Math.round((b.closed/b.total)*100) : 0; return b; })
    .sort(function(a,b){ return b.rate - a.rate; });
}

/* ---------------------------------------------------------------------
   Power dialer
--------------------------------------------------------------------- */
function startDialer(){
  var ids = computeQueue(ui.viewAs).map(function(i){ return i.leadId; });
  var seen = {}, uniq = [];
  ids.forEach(function(id){ if (!seen[id]){ seen[id]=true; uniq.push(id); } });
  if (!uniq.length){ showToast("No calls queued right now"); return; }
  ui.dialer = { queueIds: uniq, index: 0 };
  ui.modal = { type: "dialer" };
  render();
}
function dialerAdvance(){
  if (!ui.dialer) return;
  ui.dialer.index++;
  if (ui.dialer.index >= ui.dialer.queueIds.length){
    ui.modal = null;
    ui.dialer = null;
    showToast("Dialer session complete — nice work");
  }
  render();
}
function closeDialer(){
  ui.modal = null;
  ui.dialer = null;
  render();
}

/* ---------------------------------------------------------------------
   Derived data
--------------------------------------------------------------------- */
function scopedLeads(){
  if (isOwner()) return state.leads;
  if (isProcessor()) return state.leads.filter(function(l){
    return ["processing","underwriting","ctc","closed"].indexOf(l.stage) !== -1;
  });
  if (isLO()) return state.leads.filter(function(l){ return l.assignedTo===ui.viewAs; });
  return state.leads;
}

function computeQueue(userId){
  var items = [];
  var today = startOfToday();
  var leads = (userId==="owner") ? state.leads : state.leads.filter(function(l){ return l.assignedTo===userId; });

  leads.forEach(function(lead){
    if (lead.status==="active" && CADENCE_STAGES.indexOf(lead.stage) !== -1){
      var attempts = lead.callAttempts || [];
      var connected = attempts.some(function(a){ return a.outcome==="connected"; });
      if (!connected && attempts.length < CADENCE_MAX){
        var last = attempts[attempts.length-1];
        var lastDate = last ? new Date(last.date+"T00:00:00") : null;
        var due = !lastDate || dateOnly(lastDate) < today;
        if (due){
          items.push({
            type:"cadence", leadId:lead.id,
            priority: attempts.length===0 ? 2 : 1,
            label: "Day " + (attempts.length+1) + " of " + CADENCE_MAX + " — new lead follow-up",
            reason: attempts.length===0 ? "First outreach attempt" : (attempts.length + " attempt(s) so far, no contact yet")
          });
        }
      }
    }

    var rk = RATE_KEY_BY_LOAN_TYPE[lead.loanType];
    if (rk && state.marketRates[rk]){
      var r = state.marketRates[rk];
      if (r.current < r.previous && (lead.status==="active" || lead.status==="closed")){
        items.push({
          type:"rate-drop", leadId:lead.id, priority:3,
          label: lead.loanType + " rates dropped to " + fmtPct(r.current) + " — call to discuss",
          reason: "Was " + fmtPct(r.previous) + ", now " + fmtPct(r.current) + " as of " + fmtDate(r.updatedAt)
        });
      }
    }

    if (lead.status==="closed" && SHORT_TERM_TYPES.indexOf(lead.loanType) !== -1 && lead.closeDate && lead.termMonths && lead.termMonths <= 36){
      var end = addMonths(new Date(lead.closeDate+"T00:00:00"), lead.termMonths);
      var daysLeft = daysDiff(today, end);
      if (daysLeft <= 60 && daysLeft >= -30){
        items.push({
          type:"refi", leadId:lead.id, priority:2,
          label: (daysLeft>=0 ? "Term ends in " + daysLeft + " day(s)" : "Term ended " + Math.abs(daysLeft) + " day(s) ago") + " — discuss refi / exit",
          reason: "Closed " + fmtDate(lead.closeDate) + ", " + lead.termMonths + "-month term"
        });
      }
    }

    if (lead.status==="active" && lead.nextFollowUp){
      var fu = dateOnly(new Date(lead.nextFollowUp+"T00:00:00"));
      if (fu <= today){
        items.push({
          type:"followup", leadId:lead.id, priority:2,
          label:"Scheduled follow-up due", reason: lead.nextFollowUpNote || ""
        });
      }
    }

    var wb = winbackInfo(lead, today);
    if (wb){
      items.push({
        type:"winback", leadId:lead.id, priority: wb.priority,
        label:"Win-back opportunity (" + (lead.status==="cold"?"cold lead":"lost deal") + ")",
        reason: wb.reasons.join(" · ")
      });
    }
  });

  items.sort(function(a,b){ return b.priority - a.priority; });
  return items;
}

function kpisFor(leads){
  var today = startOfToday();
  var monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  var activeCount = leads.filter(function(l){ return l.status==="active"; }).length;
  var pipelineValue = leads.filter(function(l){ return l.status==="active"; })
    .reduce(function(s,l){ return s + (l.loanAmount||0); }, 0);
  var closedThisMonth = leads.filter(function(l){
    return l.status==="closed" && l.closeDate && new Date(l.closeDate+"T00:00:00") >= monthStart;
  });
  var closedValue = closedThisMonth.reduce(function(s,l){ return s + (l.loanAmount||0); }, 0);
  var callsDue = computeQueue(ui.viewAs).length;
  return { activeCount:activeCount, pipelineValue:pipelineValue, closedCount:closedThisMonth.length, closedValue:closedValue, callsDue:callsDue };
}

/* ---------------------------------------------------------------------
   Win-back / retargeting
--------------------------------------------------------------------- */
function lastTouchDate(lead){
  var dates = [];
  (lead.callAttempts||[]).forEach(function(a){ if (a.date) dates.push(a.date); });
  (lead.activity||[]).forEach(function(a){ if (a.date) dates.push(a.date); });
  if (lead.createdAt) dates.push(lead.createdAt);
  if (!dates.length) return null;
  dates.sort();
  return new Date(dates[dates.length-1] + "T00:00:00");
}
function winbackInfo(lead, today){
  if (lead.status !== "cold" && lead.status !== "lost") return null;
  var reasons = [];
  var priority = 1;
  var rk = RATE_KEY_BY_LOAN_TYPE[lead.loanType];
  if (rk && state.marketRates[rk] && state.marketRates[rk].current < state.marketRates[rk].previous){
    reasons.push(lead.loanType + " rates just dropped to " + fmtPct(state.marketRates[rk].current) + " (was " + fmtPct(state.marketRates[rk].previous) + ")");
    priority = 3;
  }
  var lt = lastTouchDate(lead);
  var days = lt ? daysDiff(lt, today) : null;
  var bucket = null;
  if (days !== null){
    if (days >= 90) bucket = 90; else if (days >= 60) bucket = 60; else if (days >= 30) bucket = 30;
  }
  if (bucket){
    reasons.push("It's been " + days + " days since last contact — a check-in is due");
    priority = Math.max(priority, bucket >= 90 ? 2 : 1);
  }
  if (!reasons.length) return null;
  return { reasons:reasons, days:days, priority:priority };
}
function applicationLink(lead){
  var qp = new URLSearchParams();
  qp.set("lead", lead.id);

function defaultOutreachMessage(lead){

var publishTimer = null;
function persist(){
  render();
  if (publishTimer) clearTimeout(publishTimer);
  publishTimer = setTimeout(doPublish, 500);
}
var artifactApiPromise = null;
function getArtifactApi(){
  if (!artifactApiPromise){
    artifactApiPromise = (window.claude && window.claude.use) ? window.claude.use("artifact") : Promise.resolve(null);
  }
  return artifactApiPromise;
}
function saveLocalFallback(){
  try { localStorage.setItem("bp_lending_state_backup", JSON.stringify(state)); } catch(e){}
}
function doPublish(){
  getArtifactApi().then(function(api){
    if (!api){ saveLocalFallback(); return; }
    var html = buildFullDocument(state);
    api.publish(html).then(function(){
      /* view reloads to the new version */
    }).catch(function(err){
      if (err && err.code === "conflict") return;
      saveLocalFallback();
      showToast("Couldn't save changes — kept locally");
    });
  }).catch(function(){ saveLocalFallback(); });
}
function buildFullDocument(st){

    "<div id=\"app\"></div>\n" +
    "<script id=\"state-json\" type=\"application/json\">" + json + "<" + "/script>\n" +
    "<script id=\"app-script\">" + scriptSrc + "<" + "/script>\n" +
    "</body>\n</html>";
}

function logCall(leadId, outcome, notes){
  var lead = leadById(leadId);
  if (!lead) return;
  var d = todayISO();
  if (!lead.firstAttemptAt) lead.firstAttemptAt = nowTs();
  lead.callAttempts = lead.callAttempts || [];
  lead.callAttempts.push({ date:d, outcome:outcome, notes:notes||"" });
  lead.activity = lead.activity || [];
  var outLabel = (CALL_OUTCOMES.filter(function(o){ return o.key===outcome; })[0] || {}).label || outcome;
  lead.activity.push({ date:d, type:"call", text:"Call logged — " + outLabel + (notes ? ": " + notes : ""), author: currentUser().name });
  lead.lastContactAt = d;
  if (outcome === "connected"){
    if (lead.status==="cold" || lead.status==="lost"){
      lead.status = "active";
      lead.stage = "qualifying";
      lead.activity.push({ date:d, type:"system", text:"Reactivated via win-back outreach", author: currentUser().name });
    } else if (lead.stage==="new" || lead.stage==="attempting"){
      lead.stage = "qualifying";
    }
  } else {
    var unanswered = lead.callAttempts.filter(function(a){ return a.outcome!=="connected"; }).length;
    if (unanswered >= CADENCE_MAX && lead.status==="active"){
      lead.status = "cold";
      lead.activity.push({ date:d, type:"system", text:"Auto-marked cold after " + CADENCE_MAX + " unanswered attempts", author:"System" });
    }
  }
  showToast("Call logged for " + lead.name);
  persist();
}

function moveStage(leadId, target){
  var lead = leadById(leadId);

  var d = todayISO();
  lead.activity = lead.activity || [];
  if (target === "cold"){
    lead.status = "cold";
    lead.activity.push({ date:d, type:"system", text:"Marked cold", author: currentUser().name });
  } else if (target === "lost"){
    lead.status = "lost"; lead.stage = "lost";
    lead.activity.push({ date:d, type:"system", text:"Marked lost / dead", author: currentUser().name });
  } else if (target === "reactivate"){
    lead.status = "active";
    lead.activity.push({ date:d, type:"system", text:"Reactivated", author: currentUser().name });
  } else {
    var oldLabel = stageLabel(lead.stage);
    lead.stage = target;
    lead.status = (target==="closed" || target==="postclosing") ? "closed" : "active";
    if (target==="closed" && !lead.closeDate) lead.closeDate = d;
    lead.activity.push({ date:d, type:"stage", text:"Stage moved: " + oldLabel + " → " + stageLabel(target), author: currentUser().name });
    (lead.thirdParties||[]).forEach(function(tp){
      if (tp.notify){
        lead.activity.push({ date:d, type:"notify", text:"Notified " + tp.role + " " + tp.name + " — stage is now " + stageLabel(target), author:"System" });
      }
    });
  }

  persist();
}

function requestDoc(leadId, name){
  var lead = leadById(leadId);
  if (!lead || !name) return;
  lead.documents = lead.documents || [];
  lead.documents.push({ name:name, status:"requested" });
  lead.activity = lead.activity || [];
  var d = todayISO();
  lead.activity.push({ date:d, type:"document", text:"Requested document: " + name, author: currentUser().name });
  lead.activity.push({ date:d, type:"notify", text:"Emailed and texted " + lead.name + " about the new document request — now showing in their borrower portal.", author:"System" });
  showToast("Requested " + name + " — borrower notified by email & text");
  persist();
}
function markDocReceived(leadId, idx){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx]) return;
  var doc = lead.documents[idx];
  doc.status = "received"; doc.receivedAt = todayISO();
  lead.activity = lead.activity || [];
  lead.activity.push({ date:todayISO(), type:"document", text:"Received document: " + doc.name, author: currentUser().name });
  persist();
}
function borrowerUploadDoc(leadId, idx, fileName){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx]) return;
  var doc = lead.documents[idx];
  doc.status = "received"; doc.receivedAt = todayISO(); doc.fileName = fileName;
  lead.activity = lead.activity || [];
  lead.activity.push({ date:todayISO(), type:"document", text:"Borrower uploaded: " + doc.name + " (" + fileName + ")", author: lead.name });
  showToast("Uploaded " + doc.name);
  persist();
}

/* ---------------------------------------------------------------------
   AI document review (simulated — prototype has no real file content
   to inspect, so findings are drawn deterministically per document so
   the same document always reviews the same way)
--------------------------------------------------------------------- */
var AI_DOC_FINDINGS = {
  "Government ID": [
    { status:"clear", note:"Name, date of birth, and expiration date are legible and match the borrower record." },
    { status:"flag", note:"ID expiration date appears to be in the past — request a current, unexpired copy." },
    { status:"flag", note:"Name on the ID doesn't exactly match the borrower name on file — confirm spelling/legal name." }
  ],
  "Bank Statements (2mo)": [
    { status:"clear", note:"Account holder name and statement period match; balances are consistent across pages." },
    { status:"flag", note:"Most recent statement is more than 60 days old — request an updated copy before underwriting." },
    { status:"flag", note:"Large unexplained deposit on this statement — will likely need a letter of explanation." }
  ],
  "Purchase Contract": [
    { status:"clear", note:"Purchase price and property address match what's on file, and the contract is signed by all parties." },
    { status:"flag", note:"Contract is missing a signature or date on the signature page." },
    { status:"flag", note:"Purchase price on the contract doesn't match the amount entered on this loan." }
  ],
  "Entity Docs (Operating Agreement)": [
    { status:"clear", note:"Entity name, formation state, and authorized signer match the borrower record." },
    { status:"flag", note:"Operating agreement doesn't clearly name an authorized signer — may need a certification page." }
  ],
  "Appraisal": [
    { status:"clear", note:"Appraised value supports the requested loan amount at the target LTV." },
    { status:"flag", note:"Appraised value came in below the value used to calculate LTV — loan terms may need revisiting." }
  ],
  "Insurance Binder": [
    { status:"clear", note:"Coverage amount and effective dates look sufficient for this property and loan." },
    { status:"flag", note:"Coverage amount looks lower than the loan amount — confirm with the insurance agent." }
  ],
  "_default": [
    { status:"clear", note:"Document looks complete and consistent with the loan file." },
    { status:"flag", note:"Scan quality is low in places — some fields may be hard to verify. Consider requesting a clearer copy." }
  ]
};
function hashStr(s){
  var h = 0;
  for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function runAiDocReview(leadId, idx){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx]) return;
  var doc = lead.documents[idx];
  var pool = AI_DOC_FINDINGS[doc.name] || AI_DOC_FINDINGS["_default"];
  var pick = pool[hashStr(lead.id + "|" + doc.name + "|" + (doc.fileName||"")) % pool.length];
  doc.aiReview = { status: pick.status, note: pick.note, reviewedAt: todayISO(), dismissed:false };
  lead.activity = lead.activity || [];
  lead.activity.push({
    date: todayISO(), type:"note",
    text: "AI review — " + doc.name + ": " + (pick.status==="clear" ? "looks good, no issues found." : ("flagged — " + pick.note)),
    author: "AI Assistant"
  });
  showToast(pick.status === "clear" ? "AI review: looks good" : "AI review: flagged for follow-up");
  persist();
}
function dismissAiFlag(leadId, idx){
  var lead = leadById(leadId);
  if (!lead || !lead.documents[idx] || !lead.documents[idx].aiReview) return;
  lead.documents[idx].aiReview.dismissed = true;
  persist();
}
function aiFlaggedDocs(){
  var out = [];
  state.leads.forEach(function(lead){
    (lead.documents||[]).forEach(function(d, i){
      if (d.aiReview && d.aiReview.status === "flag" && !d.aiReview.dismissed){
        out.push({ lead:lead, doc:d, idx:i });
      }
    });
  });
  return out;
}

function updateMarketRate(key, newVal){
  var r = state.marketRates[key];
  if (!r || isNaN(newVal)) return;
  if (newVal === r.current) return;
  r.previous = r.current;
  r.current = newVal;
  r.updatedAt = todayISO();
  showToast(r.label + " rate updated to " + fmtPct(newVal));
  persist();
}

function renderTeamSnapshot(){
  var today = startOfToday();
  var monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  var rows = loanOfficers().map(function(u){
    var mine = state.leads.filter(function(l){ return l.assignedTo===u.id && l.status!=="lost" && l.status!=="cold"; });
    var groupCounts = STAGE_GROUPS.map(function(g){
      return mine.filter(function(l){ return g.stages.indexOf(l.stage)!==-1; }).length;
    });
    var closedThisMonth = mine.filter(function(l){ return l.status==="closed" && l.closeDate && new Date(l.closeDate+"T00:00:00")>=monthStart; }).length;
    var due = computeQueue(u.id).length;

    return '<tr data-action="filter-lo-jump" data-lo="' + u.id + '" style="cursor:pointer">' +

        '<div class="queue-main">' +
          '<div class="queue-title">' + esc(lead.name) + ' — ' + esc(item.label) + '</div>' +
          '<div class="queue-reason">' + esc(item.reason) + '</div>' +
          '<div class="queue-meta"><span>' + esc(lead.loanType) + '</span><span>' + esc(lead.phone) + '</span>' +
            (isOwner() ? ('<span>LO: ' + esc(userName(lead.assignedTo)) + '</span>') : '') + '</div>' +
        '</div>' +
        '<div class="queue-actions">' +
          '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="logCall" data-lead="' + lead.id + '">Log Call</button>' +
          '<button class="btn btn-sm btn-ghost" data-action="select-lead" data-lead="' + lead.id + '">View</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  var dialerBtn = queue.length ? '<button class="btn btn-sm btn-primary" data-action="start-dialer">▶ Start Power Dialer</button>' : '';
  return topbar("Today", "Call list generated from new-lead cadence, market rate moves, and refinance timing.", "") +

      '<div class="section"><div class="section-head"><h2>Priority call list</h2>' +

function renderPipeline(){
  var leads = scopedLeads();
  var cols = STAGES.map(function(s){
    var inStage = leads.filter(function(l){ return l.stage===s.key && l.status!=="cold" && l.status!=="lost"; });
    var cards = inStage.map(function(l){
      return '<div class="pcard" data-action="select-lead" data-lead="' + l.id + '">' +
        '<div class="nm">' + esc(l.name) + '</div>' +
        '<div class="ty">' + esc(l.loanType) + '</div>' +
        '<div class="amt">' + fmtUSD(l.loanAmount) + '</div>' +
        '<div class="lo">' + esc(userName(l.assignedTo)) + '</div>' +
      '</div>';
    }).join("");
    return '<div class="col"><div class="col-head"><span class="name">' + s.label + '</span><span class="n num">' + inStage.length + '</span></div>' +
      '<div class="col-cards">' + (cards || '') + '</div></div>';
  }).join("");

  var coldLost = leads.filter(function(l){ return l.status==="cold" || l.status==="lost"; });
  var coldCards = coldLost.map(function(l){
    return '<div class="pcard" data-action="select-lead" data-lead="' + l.id + '">' +
      '<div class="nm">' + esc(l.name) + '</div>' +
      '<div class="ty">' + esc(l.loanType) + '</div>' +
      badgeForStage(l) +
    '</div>';
  }).join("");
  cols += '<div class="col" style="background:var(--c-rust-bg)"><div class="col-head"><span class="name">Cold / Lost</span><span class="n num">' + coldLost.length + '</span></div><div class="col-cards">' + (coldCards||'') + '</div></div>';

  return topbar("Pipeline", "Lead intake through post-closing, in one board.", "") +
    '<div class="content"><div class="board">' + cols + '</div></div>';
}

function renderLeadsTable(){
  var f = ui.leadFilter;
  var leads = scopedLeads().filter(function(l){
    if (f.status && l.status!==f.status) return false;
    if (f.stage && l.stage!==f.stage) return false;
    if (f.loanType && l.loanType!==f.loanType) return false;
    if (f.assignedTo && l.assignedTo!==f.assignedTo) return false;
    if (f.q){
      var q = f.q.toLowerCase();
      if (l.name.toLowerCase().indexOf(q)===-1 && (l.propertyAddress||"").toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });

  var loOptions = loanOfficers().map(function(u){ return '<option value="' + u.id + '"' + (f.assignedTo===u.id?" selected":"") + '>' + esc(u.name) + '</option>'; }).join("");
  var stageOptions = STAGES.map(function(s){ return '<option value="' + s.key + '"' + (f.stage===s.key?" selected":"") + '>' + s.label + '</option>'; }).join("");
  var typeOptions = LOAN_TYPES.map(function(t){ return '<option value="' + t + '"' + (f.loanType===t?" selected":"") + '>' + t + '</option>'; }).join("");

  var filters = '<div class="filters">' +
    '<input class="input" placeholder="Search name or address…" value="' + esc(f.q) + '" data-action="filter" data-key="q" style="min-width:220px">' +
    '<select class="select" data-action="filter" data-key="status">' +
      '<option value="active"' + (f.status==="active"?" selected":"") + '>Active</option>' +
      '<option value="closed"' + (f.status==="closed"?" selected":"") + '>Closed</option>' +
      '<option value="cold"' + (f.status==="cold"?" selected":"") + '>Cold</option>' +
      '<option value="lost"' + (f.status==="lost"?" selected":"") + '>Lost</option>' +
      '<option value=""' + (f.status===""?" selected":"") + '>All</option>' +
    '</select>' +
    '<select class="select" data-action="filter" data-key="stage"><option value="">Any stage</option>' + stageOptions + '</select>' +
    '<select class="select" data-action="filter" data-key="loanType"><option value="">Any loan type</option>' + typeOptions + '</select>' +
    (isOwner() ? ('<select class="select" data-action="filter" data-key="assignedTo"><option value="">Any officer</option>' + loOptions + '</select>') : '') +
  '</div>';

  var rows = leads.map(function(l){
    return '<tr data-action="select-lead" data-lead="' + l.id + '">' +
      '<td><div class="cell-name">' + esc(l.name) + '</div><div class="cell-sub">' + esc(l.propertyAddress||"") + '</div></td>' +
      '<td>' + esc(l.loanType) + '</td>' +
      '<td>' + badgeForStage(l) + '</td>' +
      '<td class="num">' + fmtUSD(l.loanAmount) + '</td>' +
      '<td>' + esc(l.source) + '</td>' +
      '<td>' + esc(userName(l.assignedTo)) + '</td>' +
      '<td>' + fmtDate(l.createdAt) + '</td>' +
    '</tr>';
  }).join("");

  var table = leads.length ? (
    '<div class="table-wrap"><table><thead><tr><th>Borrower</th><th>Loan Type</th><th>Stage</th><th>Amount</th><th>Source</th><th>Loan Officer</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  ) : '<div class="empty">No leads match these filters.</div>';

  var actions = '<button class="btn btn-primary" data-action="open-modal" data-modal="addLead">+ New Lead</button>';

  return topbar("Leads & Loans", leads.length + " record(s)", actions) +
    '<div class="content">' + filters + table + '</div>';
}

function tabBtn(key, label){
  return '<button class="tab' + (ui.activeTab===key?" active":"") + '" data-action="set-tab" data-tab="' + key + '">' + label + '</button>';
}

function renderLeadDetail(){
  var lead = leadById(ui.selectedLeadId);
  if (!lead){
    return topbar("Lead not found","","") + '<div class="content"><div class="empty">Select a lead from Leads &amp; Loans or Pipeline.</div></div>';
  }
  var tabs = '<div class="tabs">' +
    tabBtn("overview","Overview") + tabBtn("scenario","Loan Scenario") + tabBtn("documents","Documents") +
    tabBtn("activity","Activity &amp; Calls") + tabBtn("thirdparties","Third Parties") +
  '</div>';

  var tabContent = "";
  if (ui.activeTab === "scenario") tabContent = renderTabScenario(lead);
  else if (ui.activeTab === "documents") tabContent = renderTabDocuments(lead);
  else if (ui.activeTab === "activity") tabContent = renderTabActivity(lead);
  else if (ui.activeTab === "thirdparties") tabContent = renderTabThirdParties(lead);
  else tabContent = renderTabOverview(lead);

  var main = '<div class="panel">' + tabs + '<div class="panel-pad">' + tabContent + '</div></div>';
  var rail = renderRail(lead);

  var actions = '<button class="btn btn-ghost" data-action="nav" data-view="leads">← Back</button>';

  return topbar(esc(lead.name), esc(lead.loanType) + " · " + esc(lead.propertyAddress||""), actions) +
    '<div class="content"><div class="detail-grid">' + main + rail + '</div></div>';
}

function field(label, value, mono){

}

    '<div class="field" style="grid-column:1/-1"><label>Next follow-up</label>' +
      '<form data-form="follow-up" data-lead="' + lead.id + '" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:4px">' +
        '<input class="input" type="date" name="date" value="' + (lead.nextFollowUp||"") + '">' +
        '<input class="input" type="text" name="note" placeholder="What to follow up on…" value="' + esc(lead.nextFollowUpNote||"") + '" style="flex:1;min-width:180px">' +
        '<button class="btn btn-sm" type="submit">Save</button>' +
      '</form>' +
    '</div></div>';

  return '<div class="field-grid">' +
    field("Borrower", esc(lead.name)) +
    field("Entity Type", esc(lead.entityType||"—")) +

function renderTabScenario(lead){
  return '<div class="field-grid">' +
    field("Property Address", esc(lead.propertyAddress||"—")) +
    field("Property Type", esc(lead.propertyType||"—")) +
    field("Purchase Price", fmtUSD(lead.purchasePrice), true) +
    field("After-Repair Value (ARV)", fmtUSD(lead.arv), true) +
    field("Rehab / Construction Budget", fmtUSD(lead.rehabBudget), true) +
    field("Monthly Rent Estimate", fmtUSD(lead.rentEstimate), true) +
    field("Loan Amount Requested", fmtUSD(lead.loanAmount), true) +
    field("LTV / LTC", lead.ltv ? lead.ltv + "%" : "—", true) +
    field("Rate", fmtPct(lead.rate), true) +
    field("Term", lead.termMonths ? (lead.termMonths + " months") : "—", true) +
    field("Exit Strategy", esc(lead.exitStrategy||"—")) +
    field("Target Close Date", fmtDate(lead.closeDate)) +
  '</div>';
}

function renderTabDocuments(lead){
  var docs = lead.documents||[];
  var canAiReview = isProcessor() || isOwner();
  var receivedCount = docs.filter(function(d){ return d.status==="received"; }).length;
  var reviewedCount = docs.filter(function(d){ return d.aiReview; }).length;
  var flaggedCount = docs.filter(function(d){ return d.aiReview && d.aiReview.status==="flag" && !d.aiReview.dismissed; }).length;
  var summary = (canAiReview && receivedCount) ? (
    '<div class="hint" style="margin-bottom:10px">' + reviewedCount + ' of ' + receivedCount + ' received document(s) AI-reviewed' +
    (flaggedCount ? (' — <b style="color:var(--c-rust)">' + flaggedCount + ' flagged</b>') : (reviewedCount ? ' — all clear' : '')) +
    '.</div>'
  ) : '';

  var rows = docs.map(function(d,i){
    var statusBadge = d.status==="received" ? '<span class="badge badge-forest">Received</span>' : '<span class="badge badge-slate">Requested</span>';
    var aiBadge = "", aiNote = "", reviewBtn = "";
    if (canAiReview && d.aiReview){
      aiBadge = d.aiReview.status === "clear"
        ? '<span class="badge badge-forest">AI: Clear</span>'
        : '<span class="badge badge-rust">AI: Flagged</span>';
      aiNote = '<div class="cell-sub" style="margin-top:4px;max-width:360px">' + esc(d.aiReview.note) + '</div>';
    }
    if (d.status==="received"){
      if (canAiReview) reviewBtn = '<button class="btn btn-sm" data-action="ai-review-doc" data-lead="' + lead.id + '" data-idx="' + i + '">' + (d.aiReview ? "Re-run AI Review" : "Run AI Review") + '</button>';
    } else {
      reviewBtn = '<button class="btn btn-sm" data-action="mark-doc-received" data-lead="' + lead.id + '" data-idx="' + i + '">Mark Received</button>';
    }
    return '<div class="doc-row" style="align-items:flex-start"><div><div>' + esc(d.name) + '</div>' +
      '<div class="cell-sub">' + (d.status==="received" ? ("Received " + fmtDate(d.receivedAt) + (d.fileName?(" · " + esc(d.fileName)):"")) : "Awaiting borrower") + '</div>' +
      aiNote +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">' + statusBadge + aiBadge + reviewBtn + '</div></div>';
  }).join("");
  return summary + (rows || '<div class="empty">No documents requested yet.</div>') +
    '<form data-form="request-doc" data-lead="' + lead.id + '" style="display:flex;gap:8px;margin-top:14px">' +
      '<input class="input" name="name" placeholder="Document name (e.g. Bank Statements)" style="flex:1">' +
      '<button class="btn btn-sm" type="submit">Request Document</button>' +
    '</form>';
}

var ACTIVITY_ICON_CLASS = { call:"call", stage:"stage", notify:"notify", document:"document", text:"text", email:"email", application:"application", credit:"credit" };
function renderTabActivity(lead){
  var items = (lead.activity||[]).slice().reverse().map(function(a){
    var cls = ACTIVITY_ICON_CLASS[a.type] || "";
    return '<div class="activity-item ' + cls + '"><div class="activity-dot"></div>' +
      '<div class="activity-text">' + esc(a.text) + '<div class="activity-date">' + fmtDate(a.date) + (a.author ? (" · " + esc(a.author)) : "") + '</div></div></div>';
  }).join("");
  return '<div>' + (items || '<div class="empty">No activity yet.</div>') + '</div>' +
    '<form data-form="add-note" data-lead="' + lead.id + '" style="margin-top:14px">' +
      '<textarea class="textarea" name="note" placeholder="Add a note…"></textarea>' +
      '<button class="btn btn-sm" type="submit" style="margin-top:8px">Add Note</button>' +
    '</form>';
}

function renderTabThirdParties(lead){
  var rows = (lead.thirdParties||[]).map(function(tp, i){
    return '<div class="tp-row"><div class="r">' + esc(tp.role) + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div><b>' + esc(tp.name) + '</b><div class="cell-sub">' + esc(tp.phone||"") + (tp.email?(" · " + esc(tp.email)):"") + '</div></div>' +
        '<label style="display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-muted)"><input type="checkbox" data-action="toggle-notify" data-lead="' + lead.id + '" data-idx="' + i + '"' + (tp.notify?" checked":"") + '> Notify on stage change</label>' +
      '</div></div>';
  }).join("");
  var roleOptions = TP_ROLES.map(function(r){ return '<option value="' + r + '">' + r + '</option>'; }).join("");
  return (rows || '<div class="empty">No third parties linked yet.</div>') +
    '<form data-form="add-third-party" data-lead="' + lead.id + '" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<select class="select" name="role">' + roleOptions + '</select>' +
      '<input class="input" name="name" placeholder="Name" required>' +
      '<input class="input" name="phone" placeholder="Phone">' +
      '<input class="input" name="email" placeholder="Email">' +
      '<button class="btn btn-sm" type="submit">Add</button>' +
    '</form>';
}

function renderRail(lead){
  var idx = stageIndex(lead.stage);
  var nextStage = (idx>=0 && idx<STAGES.length-1 && lead.status==="active") ? STAGES[idx+1] : null;
  var stageOptions = STAGES.map(function(s){ return '<option value="' + s.key + '"' + (s.key===lead.stage?" selected":"") + '>' + s.label + '</option>'; }).join("");

  var statusRow = "";
  if (lead.status === "cold") statusRow = '<button class="btn btn-sm" data-action="move-stage" data-lead="' + lead.id + '" data-target="reactivate">Reactivate</button>';
  else if (lead.status === "lost") statusRow = '<span class="badge badge-neutral">Lost / Dead</span>';
  else statusRow = '<button class="btn btn-sm btn-danger" data-action="move-stage" data-lead="' + lead.id + '" data-target="cold">Mark Cold</button>' +
      '<button class="btn btn-sm btn-danger" data-action="move-stage" data-lead="' + lead.id + '" data-target="lost">Mark Lost</button>';

  return '<div class="panel" style="align-self:flex-start">' +
    '<div class="rail-block">' +
      '<div class="rail-title">Borrower</div>' +
      '<div class="rail-name">' + esc(lead.name) + '</div>' +
      '<div class="stage-line">' + badgeForStage(lead) + '</div>' +
    '</div>' +
    '<div class="rail-block">' +
      '<div class="rail-title">Lead Owner</div>' +
      (isOwner() ? (
        '<select class="select" style="width:100%" data-action="reassign-lead" data-lead="' + lead.id + '">' +

    '<div class="rail-block">' +
      '<div class="rail-title">Contact</div>' +

        '<a class="btn btn-sm" href="tel:' + esc((lead.phone||"").replace(/[^0-9+]/g,"")) + '">Call</a>' +

          '<button class="btn btn-sm" data-action="open-modal" data-modal="sendApplication" data-lead="' + lead.id + '">Send Application' + (lead.applicationSentAt ? ' ✓' : '') + '</button>' +

      (lead.applicationTakenByPhone ? ('<div class="footnote" style="padding:2px 0 0">Application taken by phone ' + fmtDate(lead.applicationTakenAt) + '</div>') : '') +
      (lead.creditOrderedAt ? ('<div class="footnote" style="padding:2px 0 0">Credit portal opened ' + fmtDate(lead.creditOrderedAt) + '</div>') : '') +

function renderPerformance(){

  var stlRows = leads.slice().sort(function(a,b){
    var da = a.createdAtTs || (a.createdAt+"T00:00:00Z"), db = b.createdAtTs || (b.createdAt+"T00:00:00Z");

    } else if (l.status==="active"){
      var elapsed = l.createdAtTs ? (Date.now() - new Date(l.createdAtTs).getTime()) : null;

      '<td>' + esc(l.source) + '</td>' +
      '<td>' + fmtDate(l.createdAt) + '</td>' +
      '<td>' + statusCell + '</td>' +
    '</tr>';

  var loRankingHTML = "";

    var ranking = loanOfficers().map(function(u){
      var mine = state.leads.filter(function(l){ return l.assignedTo===u.id; });

          '<td class="num">' + (r.pctWithin1hr===null ? "—" : r.pctWithin1hr+"%") + '</td>' +
          '<td class="num">' + (r.uncontacted ? ('<span class="badge badge-rust">' + r.uncontacted + '</span>') : "0") + '</td></tr>';
      }).join("") +
      '</tbody></table></div></div>';

        '<td class="num"><b>' + b.rate + '%</b></td><td class="num">' + b.active + '</td><td class="num">' + b.lostCold + '</td>' +
        '<td class="num">' + fmtUSD(b.closedValue) + '</td></tr>';

    '</tbody></table></div>';

  return topbar("Speed & Conversion", "How fast leads get their first call, and which sources actually convert — " + (isOwner() ? "across the whole team." : "for your own leads."), "") +
    '<div class="content">' +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="kpi-label">Avg. Speed to Lead</div><div class="kpi-value num">' + fmtDuration(stl.avgMs) + '</div><div class="kpi-sub">' + stl.contactedCount + ' lead(s) contacted</div></div>' +
        '<div class="kpi"><div class="kpi-label">Contacted Within 1 Hr</div><div class="kpi-value num">' + (stl.pctWithin1hr===null?"—":stl.pctWithin1hr+"%") + '</div><div class="kpi-sub">Fast follow-up sets the odds of a call-back</div></div>' +

      '</div>' +
      loRankingHTML +
      '<div class="section"><div class="section-head"><h2>Speed to Lead — by Lead</h2><span class="hint">First call/text attempt after creation</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Lead</th>' + (isOwner() ? '<th>Loan Officer</th>' : '') + '<th>Source</th><th>Created</th><th>Speed to Lead</th></tr></thead><tbody>' + stlRows + '</tbody></table></div>' +

function renderPortal(){

  var body = "";
  if (lead){
    var idx = Math.max(stageIndex(lead.stage), 0);
    var steps = STAGES.map(function(s,i){
      var cls = i < idx ? "done" : (i===idx ? "now" : "");
      return '<div class="portal-step ' + cls + '" title="' + s.label + '"></div>';
    }).join("");

    var docs = (lead.documents||[]).map(function(d,i){
      var received = d.status==="received";
      return '<div class="doc-row"><div><div>' + esc(d.name) + '</div><div class="cell-sub">' + (received ? ("Received " + fmtDate(d.receivedAt)) : "Needed to move forward") + '</div></div>' +
        (received ? '<span class="badge badge-forest">Received</span>' :
          '<label class="btn btn-sm btn-primary" style="cursor:pointer">Upload<input type="file" style="display:none" data-action="upload-doc" data-lead="' + lead.id + '" data-idx="' + i + '"></label>') +
        '</div>';
    }).join("");

    body = '<div class="panel panel-pad portal-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div>' + BRAND_MARK + '</div>' +
        '<select class="select" data-action="portal-select">' + options + '</select>' +
      '</div>' +
      '<h2 class="font-display" style="margin:18px 0 2px">Welcome back, ' + esc(lead.name.split(" ")[0]) + '</h2>' +
      '<div class="view-sub">' + esc(lead.loanType) + ' · ' + esc(lead.propertyAddress||"") + '</div>' +
      '<div class="portal-progress">' + steps + '</div>' +
      '<div class="view-sub" style="margin-bottom:18px">Current status: <b>' + esc(stageLabel(lead.stage)) + '</b></div>' +
      '<div class="rail-title" style="margin-top:10px">Your loan officer</div>' +
      '<div style="margin:6px 0 18px">' + esc(userName(lead.assignedTo)) + ' · ' + esc((userById(lead.assignedTo)||{}).phone||"") + '</div>' +
      '<div class="rail-title">Document checklist</div>' +
      (docs || '<div class="empty">No documents requested yet.</div>') +
    '</div>';
  } else {

  return '<div class="portal">' + body + '</div>' +

/* ---------------------------------------------------------------------
   Event delegation
--------------------------------------------------------------------- */
var appEl = document.getElementById("app");

appEl.addEventListener("click", function(e){
  var backdrop = e.target.closest && e.target.closest("[data-action='backdrop']");
  if (backdrop && e.target === backdrop){ ui.modal = null; ui.dialer = null; render(); return; }

  var t = e.target.closest && e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;

  if (action === "nav"){ ui.view = t.dataset.view; if (ui.view!=="detail") ui.selectedLeadId=null; render(); }
  else if (action === "select-lead"){ ui.view="detail"; ui.selectedLeadId=t.dataset.lead; ui.activeTab="overview"; render(); }
  else if (action === "filter-lo-jump"){ ui.view="leads"; ui.leadFilter.assignedTo=t.dataset.lo; ui.leadFilter.status=""; render(); }
  else if (action === "set-tab"){ ui.activeTab = t.dataset.tab; render(); }
  else if (action === "open-modal"){ ui.modal = { type:t.dataset.modal, leadId:t.dataset.lead||null, kind:t.dataset.kind||null }; render(); }
  else if (action === "close-modal"){ ui.modal = null; render(); }
  else if (action === "move-stage" && t.dataset.target){ moveStage(t.dataset.lead, t.dataset.target); }
  else if (action === "mark-doc-received"){ markDocReceived(t.dataset.lead, parseInt(t.dataset.idx,10)); }
  else if (action === "ai-review-doc"){ runAiDocReview(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "dismiss-ai-flag"){ dismissAiFlag(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "toggle-processing"){ toggleProcessingAction(t.dataset.lead, t.dataset.kind); }
  else if (action === "mark-notif-read"){ markNotificationRead(t.dataset.id); }
  else if (action === "log-email"){ logEmailSent(t.dataset.lead); }
  else if (action === "send-application"){
    sendApplicationAction(t.dataset.lead, t.dataset.channel);
    if (t.dataset.channel === "manually"){ ui.modal = null; render(); }
  }
  else if (action === "send-document"){
    sendDocumentAction(t.dataset.lead, t.dataset.kind, t.dataset.channel);
    if (t.dataset.channel === "manually"){ ui.modal = null; render(); }
  }
  else if (action === "order-credit"){ logCreditOrder(t.dataset.lead); }
  else if (action === "logout"){ logout(); }
  else if (action === "tour-next"){ ui.tourStep = (ui.tourStep||0)+1; render(); }
  else if (action === "tour-back"){ ui.tourStep = Math.max((ui.tourStep||0)-1,0); render(); }
  else if (action === "tour-skip" || action === "tour-finish"){ ui.view = "today"; render(); }
  else if (action === "start-dialer"){ startDialer(); }
  else if (action === "dialer-skip"){ dialerAdvance(); }
  else if (action === "close-dialer"){ closeDialer(); }
  else if (action === "copy-app-link"){
    var linkBox = document.getElementById("app-link-box");
    if (linkBox){
      var lnk = linkBox.value;
      var okFn = function(){ showToast("Link copied"); };
      var failFn = function(){ linkBox.focus(); linkBox.select(); showToast("Couldn't auto-copy — link is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(lnk).then(okFn).catch(failFn);
      } else { failFn(); }
    }
  }
  else if (action === "copy-message"){
    var box = document.getElementById("text-message-box");
    if (box){
      var text = box.value;
      var done = function(){ showToast("Message copied"); };
      var fail = function(){ box.focus(); box.select(); showToast("Couldn't auto-copy — text is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    }
  }
});

appEl.addEventListener("change", function(e){
  var t = e.target;
  if (!t.dataset) return;
  var action = t.dataset.action;
  if (action === "filter"){
    ui.leadFilter[t.dataset.key] = t.value; render();
  } else if (action === "filter-comm"){
    ui.commFilter = t.value; render();
  } else if (action === "move-stage" && t.tagName==="SELECT"){
    moveStage(t.dataset.lead, t.value);
  } else if (action === "reassign-lead"){
    reassignLead(t.dataset.lead, t.value);
  } else if (action === "toggle-notify"){
    toggleNotify(t.dataset.lead, parseInt(t.dataset.idx,10));
  } else if (action === "portal-select"){
    ui.portalLeadId = t.value; render();
  } else if (action === "upload-doc"){
    var file = t.files && t.files[0];
    if (file) borrowerUploadDoc(t.dataset.lead, parseInt(t.dataset.idx,10), file.name);
  }
});

appEl.addEventListener("submit", function(e){
  var form = e.target;
  if (!form.dataset || !form.dataset.form) return;
  e.preventDefault();
  var type = form.dataset.form;
  var fd = new FormData(form);
  if (type === "add-lead"){
    addLead({
      name: fd.get("name"), email: fd.get("email"), phone: fd.get("phone"),
      source: fd.get("source"), loanType: fd.get("loanType"), assignedTo: fd.get("assignedTo"),
      loanAmount: fd.get("loanAmount") ? Number(fd.get("loanAmount")) : null,
      propertyAddress: fd.get("propertyAddress")
    });
  } else if (type === "take-application"){
    var numOrNull = function(k){ var x = fd.get(k); return (x===null||x==="") ? null : Number(x); };
    submitPhoneApplication(form.dataset.lead, {
      entityType: fd.get("entityType"),
      creditScore: numOrNull("creditScore"),
      experienceDeals: numOrNull("experienceDeals"),
      liquidity: numOrNull("liquidity"),
      propertyAddress: fd.get("propertyAddress"),
      propertyType: fd.get("propertyType"),
      exitStrategy: fd.get("exitStrategy"),
      purchasePrice: numOrNull("purchasePrice"),
      arv: numOrNull("arv"),
      rehabBudget: numOrNull("rehabBudget"),
      rentEstimate: numOrNull("rentEstimate"),
      loanAmount: numOrNull("loanAmount"),
      termMonths: numOrNull("termMonths")
    });
    render();
  } else if (type === "send-back"){
    sendBackToLO(form.dataset.lead, fd.get("note"));
    render();
  } else if (type === "log-call"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    ui.modal = null; render();
  } else if (type === "add-third-party"){
    addThirdParty(form.dataset.lead, { role:fd.get("role"), name:fd.get("name"), phone:fd.get("phone"), email:fd.get("email"), notify:true });
  } else if (type === "add-note"){
    addNote(form.dataset.lead, fd.get("note"));
    form.reset();
  } else if (type === "request-doc"){
    requestDoc(form.dataset.lead, fd.get("name"));
    form.reset();
  } else if (type === "follow-up"){
    setFollowUp(form.dataset.lead, fd.get("date"), fd.get("note"));
  } else if (type === "rate"){
    updateMarketRate(form.dataset.key, Number(fd.get("rate")));
    form.reset();
  } else if (type === "send-text"){
    var box = document.getElementById("text-message-box");
    logTextSent(form.dataset.lead, box ? box.value : "");
    ui.modal = null; render();
  } else if (type === "login"){
    attemptLogin(fd.get("username"), fd.get("pin"));
  } else if (type === "save-signature"){
    saveSignature(fd.get("emailSignature"), fd.get("textSignoff"));
  } else if (type === "change-pin"){
    changeMyPin(fd.get("oldPin"), fd.get("newPin"));
  } else if (type === "reset-pin"){
    resetUserPin(form.dataset.user, fd.get("pin"));
    form.reset();
  } else if (type === "set-points"){
    setPointsCharged(form.dataset.lead, fd.get("points"));
  } else if (type === "dialer-log"){
    logCall(form.dataset.lead, fd.get("outcome"), fd.get("notes"));
    dialerAdvance();
  }
});

/* ---------------------------------------------------------------------
   Init
--------------------------------------------------------------------- */
render();

})();
</script>
