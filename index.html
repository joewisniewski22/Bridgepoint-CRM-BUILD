  return wrap(buildBorrowerPortalHTML(lead, { justSubmitted: pa.status === "submitted" }), true);
}
/* ---------------------------------------------------------------------
   Borrower portal — the one page a borrower ever needs: reachable the
   moment they're first sent a link (before the application's even done)
   and for the life of the loan after. Same markup powers the real public
   link (renderPublicApply) and the staff-facing preview (renderPortal).
--------------------------------------------------------------------- */
function buildBorrowerPortalHTML(lead, opts){
  opts = opts || {};
  var lang = lead.preferredLanguage || "en";
  var L = function(s){ return esc(tr(s, lang)); };
  var hasCompletedIntake = !!lead.applicationTakenAt;
  var idx = borrowerStageGroupIndex(lead.stage);

  var stepper = '<div class="portal-stepper">' + BORROWER_STAGE_GROUPS.map(function(s,i){
    var cls = i < idx ? "done" : (i===idx ? "now" : "");
    return '<div class="portal-stepper-item ' + cls + '">' +
      '<div class="portal-stepper-dot">' + (i < idx ? "✓" : (i+1)) + '</div>' +
      '<div class="portal-stepper-label">' + L(s.label) + '</div>' +
    '</div>';
  }).join("") + '</div>';

  var propertyImageHTML = (lead.propertyAddress && GOOGLE_MAPS_API_KEY) ? (
    '<img src="https://maps.googleapis.com/maps/api/streetview?size=340x220&location=' + encodeURIComponent(lead.propertyAddress) + '&key=' + GOOGLE_MAPS_API_KEY + '" ' +
    'alt="" style="width:150px;height:104px;object-fit:cover;border-radius:10px;box-shadow:var(--shadow-card);display:block;margin-left:auto" ' +
    'onerror="this.style.display=\'none\'">'
  ) : '';
  var header = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
      '<div class="portal-hero"><img src="' + LOGO_URL + '" alt="Bridgepoint Lending"></div>' +
      '<div style="text-align:right">' + (opts.selectorHTML || '') + propertyImageHTML + '</div>' +
    '</div>' +
    '<h2 class="font-display" style="margin:16px 0 2px">' + L("Welcome") + ', ' + esc((lead.name||"").split(" ")[0]) + '</h2>' +
    '<div class="view-sub">' + L(lead.loanType) + (lead.propertyAddress ? (' · ' + esc(lead.propertyAddress)) : '') + '</div>' +
    '<div class="portal-status-badge">' + esc(tr(borrowerStageLabel(lead.stage), lang)) + '</div>' +
    stepper +
    (opts.justSubmitted ? ('<div class="hint" style="color:var(--c-forest);margin:6px 0 0">' + L("Thanks — we've got your application! Here's where things stand.") + '</div>') : '');

  var isInProcessing = stageIndex(lead.stage) >= stageIndex("processing");

  if (!hasCompletedIntake && !isInProcessing){
    return header +
      '<div class="portal-cta">' +
        '<b>' + L("Let's get your application started") + '</b>' +
        '<div class="footnote" style="padding:4px 0 0">' + L("Takes about 10 minutes — fill in what you can, sign at the end.") + '</div>' +
      '</div>' +
      '<form data-form="public-application" data-lead="' + lead.id + '" style="margin-top:10px">' +
        buildApplicationFieldsHTML(lead, lang) +
        '<button class="btn btn-primary" style="width:100%;margin-top:14px" type="submit">' + L("Submit Application") + '</button>' +
      '</form>';
  }

  var termsCard = (lead.loanAmount || lead.rate) ? (
    '<div class="portal-section">' +
      '<div class="rail-title">' + L("Your Loan Details") + '</div>' +
      '<div class="footnote" style="padding:2px 0 8px">' + L("Preliminary — subject to change") + '</div>' +
      '<div class="field-grid">' +
        (lead.propertyAddress ? field(L("Property"), esc(lead.propertyAddress)) : "") +
        (lead.loanAmount ? field(L("Loan Amount"), fmtUSD(lead.loanAmount), true) : "") +
        (lead.rate ? field(L("Rate"), fmtPct(lead.rate), true) : "") +
        (lead.termMonths ? field(L("Term"), lead.termMonths + " " + L("months"), true) : "") +
      '</div>' +
      '<button class="btn btn-sm" type="button" style="margin-top:10px" data-action="view-term-sheet" data-lead="' + lead.id + '">📄 ' + L("View Term Sheet") + '</button>' +
    '</div>'
  ) : "";

  var dealAnalysisCard = (function(){
    var d = computeDealAnalysis(lead);
    if (!d) return "";
    return '<div class="portal-section">' +
      '<div class="rail-title">' + L("Your Options When This Loan Comes Due") + '</div>' +
      '<div class="footnote" style="padding:2px 0 8px">' + L("Rough estimates — your loan officer can run exact numbers anytime.") + '</div>' +
      '<div class="field-grid">' +
        field(L("Est. Proceeds If You Sell"), fmtUSD(d.sellProfit), true) +
        field(L("Est. Cash-Out If You Refinance"), d.cashOutProceeds!=null ? fmtUSD(d.cashOutProceeds) : "—", true) +
      '</div>' +
      '<div class="footnote" style="padding-top:8px">' + L("Refinancing into a long-term DSCR loan lets you keep the property, pull cash out, and start collecting rent — without paying selling costs or losing the upside if the area keeps appreciating. Ask your loan officer about refinancing whenever you're ready.") + '</div>' +
    '</div>';
  })();

  var lo = userById(lead.assignedTo) || {};
  var loCard = '<div class="portal-section">' +
    '<div class="rail-title">' + L("Your Loan Officer") + '</div>' +
    '<div class="portal-lo-card">' +
      (lo.photoUrl ? ('<img class="portal-lo-photo" src="' + esc(lo.photoUrl) + '">') : '<div class="portal-lo-photo"></div>') +
      '<div>' +
        '<div style="font-weight:700">' + esc(lo.name||"—") + '</div>' +
        '<div class="portal-lo-actions">' +
          (lo.phone ? ('<a href="tel:' + esc(lo.phone) + '">📞 ' + esc(lo.phone) + '</a>') : '') +
          (lo.email ? ('<a href="mailto:' + esc(lo.email) + '">✉️ ' + L("Email") + '</a>') : '') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  var uwConditionRows = (lead.uwConditions||[]).map(function(c){
    return '<div class="doc-row" style="align-items:flex-start"><div>' +
      '<div>' + esc(c.description) + '</div>' +
      (c.fileName ? ('<div class="cell-sub">' + L("Attachment") + ': ' + esc(c.fileName) + '</div>') : '') +
      '</div>' +
      (c.status==="received"
        ? ('<span class="badge badge-forest">' + L("Received") + '</span>')
        : ('<label class="btn btn-sm btn-primary" style="cursor:pointer">' + L("Upload") + '<input type="file" style="display:none" data-action="upload-uw-condition-response" data-lead="' + lead.id + '" data-condid="' + c.id + '"></label>')) +
    '</div>';
  }).join("");
  var uwConditionsCard = (lead.uwConditions && lead.uwConditions.length) ? (
    '<div class="portal-section">' +
      '<div class="rail-title">' + L("Underwriting Needs From You") + '</div>' +
      uwConditionRows +
    '</div>'
  ) : "";

  if (isInProcessing){
    return header + termsCard + loCard + uwConditionsCard +
      '<div class="portal-section">' +
        '<div class="rail-title">' + L("Your File Is In Processing") + '</div>' +
        '<div class="footnote" style="padding:2px 0 0">' + L("Your loan officer and our processing team are handling everything from here. If you need to send a document or have a question, please contact your loan officer directly.") + '</div>' +
      '</div>';
  }

  var visibleDocs = (lead.documents||[]).map(function(d,i){ return {d:d, i:i}; }).filter(function(x){ return !x.d.staffOnly; });
  var docs = visibleDocs.map(function(x){
    var d = x.d, i = x.i;
    var received = d.status==="received";
    return '<div class="doc-row"><div><div>' + L(d.name) + '</div><div class="cell-sub">' + (received ? (L("Received") + " " + fmtDate(d.receivedAt)) : L("Needed to move forward")) + '</div></div>' +
      (received ? '<span class="badge badge-forest">' + L("Received") + '</span>' :
        '<label class="btn btn-sm btn-primary" style="cursor:pointer">' + L("Upload") + '<input type="file" style="display:none" data-action="upload-doc" data-lead="' + lead.id + '" data-idx="' + i + '"></label>') +
      '</div>';
  }).join("");
  var docsCard = '<div class="portal-section">' +
    '<div class="rail-title">' + L("Document Checklist") + '</div>' +
    (docs || '<div class="empty">' + L("No documents requested yet.") + '</div>') +
  '</div>';

  var tpRows = (lead.thirdParties||[]).map(function(tp){
    return '<div class="doc-row"><div><div><b>' + esc(tp.name) + '</b></div>' +
      '<div class="cell-sub">' + L(tp.role) + (tp.phone?(' · '+esc(tp.phone)):'') + (tp.email?(' · '+esc(tp.email)):'') + '</div></div></div>';
  }).join("");
  var tpRoleOptions = TP_ROLES.map(function(r){ return '<option value="' + r + '">' + L(r) + '</option>'; }).join("");
  var thirdPartiesCard = '<div class="portal-section">' +
    '<div class="rail-title">' + L("Your Contacts") + '</div>' +
    '<div class="footnote" style="padding:2px 0 8px">' + L("Title company, insurance agent, or anyone else involved in this loan — add them here so we can coordinate directly.") + '</div>' +
    (tpRows || '<div class="empty">' + L("No contacts added yet.") + '</div>') +
    '<form data-form="portal-add-third-party" data-lead="' + lead.id + '" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">' +
      '<select class="select" name="role">' + tpRoleOptions + '</select>' +
      '<input class="input" name="name" placeholder="' + L("Name") + '" required style="flex:1;min-width:120px">' +
      '<input class="input" name="phone" placeholder="' + L("Phone") + '" style="flex:1;min-width:100px">' +
      '<input class="input" name="email" placeholder="' + L("Email") + '" style="flex:1;min-width:120px">' +
      '<button class="btn btn-sm btn-primary" type="submit">' + L("Add Contact") + '</button>' +
    '</form>' +
  '</div>';

  var chatMessages = (lead.portalChat||[]).map(function(m){
    var mine = m.from === "borrower";
    return '<div style="display:flex;' + (mine?'justify-content:flex-end':'justify-content:flex-start') + ';margin-bottom:8px">' +
      '<div style="max-width:80%;padding:8px 12px;border-radius:14px;background:' + (mine?'var(--brand)':'var(--brand-tint)') + ';color:' + (mine?'#fff':'var(--ink)') + ';font-size:.9rem">' +
        esc(m.text) +
        '<div style="font-size:.7rem;opacity:.7;margin-top:3px">' + (mine ? L("You") : esc(m.authorName || lo.name || L("Loan Officer"))) + '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  var chatCard = '<div class="portal-section">' +
    '<div class="rail-title">' + L("Chat with Your Loan Officer") + '</div>' +
    '<div style="max-height:280px;overflow-y:auto;padding:4px 2px;margin-bottom:10px">' +
      (chatMessages || '<div class="empty">' + L("No messages yet — ask a question below.") + '</div>') +
    '</div>' +
    '<form data-form="portal-message" data-lead="' + lead.id + '" style="display:flex;gap:8px">' +
      '<input class="input" type="text" name="message" placeholder="' + L("Type a message…") + '" required style="flex:1">' +
      '<button class="btn btn-sm btn-primary" type="submit">' + L("Send") + '</button>' +
    '</form>' +
    '<div class="footnote" style="padding-top:6px">' + L("Your loan officer gets this as a text and can reply right from their phone.") + '</div>' +
  '</div>';

  return header + termsCard + dealAnalysisCard + loCard + uwConditionsCard + docsCard + thirdPartiesCard + chatCard;
}

    { title:"Documents", body:"The required checklist loads automatically the moment you open the tab. Upload anything a client emails you directly, click View File to open what's on file, and run AI Review to catch issues on anything received." },

function renderTour(){
  var steps = tourStepsForRole();
  var i = Math.min(ui.tourStep||0, steps.length-1);
  var s = steps[i];
  var dots = steps.map(function(_,idx){
    return '<span style="width:7px;height:7px;border-radius:50%;display:inline-block;margin:0 3px;background:' + (idx===i?'var(--brand)':'var(--border)') + '"></span>';
  }).join("");
  return '<div class="login-screen"><div class="login-card" style="max-width:460px;text-align:center">' +
    '<div class="login-brand" style="justify-content:center">' + BRAND_MARK + '</div>' +
    '<h2 class="font-display" style="margin-top:14px">' + esc(s.title) + '</h2>' +
    '<div class="login-sub" style="margin:10px 0 20px">' + esc(s.body) + '</div>' +
    '<div style="margin-bottom:18px">' + dots + '</div>' +
    '<div style="display:flex;gap:8px">' +
      (i>0 ? '<button class="btn" style="flex:1" data-action="tour-back">Back</button>' : '<button class="btn btn-ghost" style="flex:1" data-action="tour-skip">Skip</button>') +
      (i<steps.length-1 ? '<button class="btn btn-primary" style="flex:1" data-action="tour-next">Next</button>' : '<button class="btn btn-primary" style="flex:1" data-action="tour-finish">Get Started</button>') +
    '</div>' +
  '</div></div>';
}

function navItem(view, icon, label, count){
  var cls = "nav-item" + (ui.view===view ? " active" : "");
  var countHTML = (count!==undefined && count!==null) ? ('<span class="count">' + count + '</span>') : "";

    '<span class="ic">' + icon + '</span><span>' + label + '</span>' + countHTML + '</button>';
}

function staleTitleInsuranceItems(){
  var today = startOfToday();
  var items = [];
  state.leads.forEach(function(lead){
    if (lead.status !== "active") return;
    [
      { requestedAt: lead.titleRequestedAt, docName: "Title Commitment" },
      { requestedAt: lead.insuranceRequestedAt, docName: "Insurance Policy" }
    ].forEach(function(check){
      if (!check.requestedAt) return;
      var received = (lead.documents||[]).some(function(d){ return d.name === check.docName && d.status === "received"; });
      if (received) return;
      var days = daysDiff(new Date(check.requestedAt+"T00:00:00"), today);
      if (days >= 5) items.push({ lead: lead, docName: check.docName, days: days });
    });
  });
  return items;
}

var STANDALONE_PRICER_LOAN_TYPES = ["DSCR","Fix & Flip","Bridge","Ground Up Construction","Portfolio/Blanket"];
var STANDALONE_PRICER_NUMERIC_KEYS = ["creditScore","purchasePrice","currentValue","rentEstimate","experienceDeals","rehabBudget","propertyCount","termMonths","arv"];
function defaultStandalonePricer(){
  return {

function computeMaxLoanAmount(sp){
  var type = sp.loanType;
  if (type === "Fix & Flip" || type === "Bridge" || type === "Ground Up Construction"){
    if (!sp.purchasePrice) return null;
    var tierName = experienceTier(sp.experienceDeals);
    var isGuc = type === "Ground Up Construction";
    var limits = isGuc ? GROUNDUP_TIERS[tierName] : RTL_TIERS[tierName][type==="Bridge"?"bridge":rehabClass(sp)];
    if (!limits) return null;
    var stateAdj = rtlStateLeverageAdj(sp.propertyAddress);
    limits = Object.assign({}, limits);
    if (stateAdj.adj){
      if (limits.ltc!=null) limits.ltc += stateAdj.adj;
      if (limits.iltc!=null) limits.iltc += stateAdj.adj;
      if (limits.ltarv!=null) limits.ltarv += stateAdj.adj;
      if (limits.totalLtc!=null) limits.totalLtc += stateAdj.adj;
    }
    var caps = [2000000];
    if (type === "Bridge"){
      if (limits.ltc!=null) caps.push(limits.ltc/100 * sp.purchasePrice);
    } else if (isGuc){
      if (limits.iltc!=null) caps.push(limits.iltc/100*sp.purchasePrice + (sp.rehabBudget||0));
      if (limits.totalLtc!=null) caps.push(limits.totalLtc/100 * (sp.purchasePrice+(sp.rehabBudget||0)));
      if (limits.ltarv!=null && sp.arv) caps.push(limits.ltarv/100 * sp.arv);
    } else {
      if (limits.iltc!=null) caps.push(limits.iltc/100*sp.purchasePrice + (sp.rehabBudget||0));
      if (limits.ltc!=null) caps.push(limits.ltc/100 * (sp.purchasePrice+(sp.rehabBudget||0)));
      if (limits.ltarv!=null && sp.arv) caps.push(limits.ltarv/100 * sp.arv);
    }
    return { amount: Math.max(0, Math.min.apply(null, caps)), stateAdj: stateAdj, tierName: tierName };
  }
  if (type === "DSCR" || type === "Portfolio/Blanket"){
    var dscrValueBasisForCap = dscrValueBasis(sp, sp);
    if (!dscrValueBasisForCap || !sp.creditScore) return null;
    var isRural = sp.ruralStatus === "rural";
    var fTier = DSCR_LTV_BY_FICO.filter(function(t){ return sp.creditScore >= t.minFico; })[0];
    var ltvTierKey = sp.transactionType === "cashout" ? "cashOut" : (sp.transactionType === "ratetermrefi" ? "rateTerm" : "purchase");
    var maxLtvPct = isRural ? 65 : (fTier ? fTier[ltvTierKey] : DSCR_LTV_BY_FICO[DSCR_LTV_BY_FICO.length-1][ltvTierKey]);
    var ltvCap = dscrValueBasisForCap * (maxLtvPct/100);
    var dscrCap = Infinity;
    if (sp.rentEstimate){
      var minDscr = isRural ? 1.20 : 1.0;
      var trialAmt = Math.min(ltvCap, 2000000);
      var trialResult = evaluateDscrPricing(Object.assign({}, sp, {loanAmount:trialAmt}), sp);
      var rate = (trialResult && !trialResult.ineligible && trialResult.rate) ? trialResult.rate : 7.0;
      var termM = sp.termMonths || 360;
      var r = (rate/100)/12;
      var factor = r / (1 - Math.pow(1+r, -termM));
      var targetPI = (sp.rentEstimate / minDscr) / 1.2;
      dscrCap = targetPI / factor;
    }
    return { amount: Math.max(0, Math.min(ltvCap, dscrCap, 2000000)), isRural: isRural };
  }
  return null;
}

function standaloneRateAdjustField(currentRate, parRate){
  var maxRate = Math.round((parRate + DSCR_MAX_BUYUP)*1000)/1000;
  return '<div class="field"><label>Rate</label><div class="val mono">' +
    '<input type="number" step="0.125" min="' + parRate + '" max="' + maxRate + '" data-action="standalone-pricer-rate-live" value="' + currentRate + '" style="width:90px;font:inherit;padding:2px 4px">%' +
  '</div></div>';
}
function buildStandalonePricerOutputHTML(sp){
  var isDSCR = sp.loanType === "DSCR" || sp.loanType === "Portfolio/Blanket";
  var maxLoanInfo = computeMaxLoanAmount(sp);
  var effectiveLoanAmount = maxLoanInfo ? Math.floor(maxLoanInfo.amount) : null;
  var result = effectiveLoanAmount ? evaluatePricing(Object.assign({}, sp, { loanAmount: effectiveLoanAmount }), sp) : null;
  if (!maxLoanInfo){
    return '<div class="hint">Fill in credit score (DSCR/Portfolio) or investing experience (Fix & Flip/Bridge/Ground Up), plus purchase price, to see the max loan amount and pricing.</div>';
  } else if (!result){
    return '<div class="hint">Add a bit more info to see live pricing at the max qualifying amount.</div>';
  } else if (result.ineligible){
    return '<div class="hint" style="color:var(--c-rust)">' + esc(result.reason) + '</div>';
  }
  var rateField = (isDSCR && result.parRate!=null) ? standaloneRateAdjustField(result.rate, result.parRate) : field("Rate", fmtPct(result.rate), true);
  var rows = field("Max Loan Amount You Qualify For", fmtUSD(effectiveLoanAmount), true) +
    rateField +
    field("Lender Fee", fmtUSD(result.fee), true) +
    (isDSCR ? field("Wholesale Price", result.price!=null ? result.price.toFixed(3) : "—", true) : "") +
    (isDSCR ? field("Yield Spread (YSP)", (result.ysp!=null && result.ysp>0) ? (fmtPct(result.ysp) + " — " + fmtUSD(result.yspDollar)) : (result.noYspAllowed ? "Not available" : (result.ysp===0 ? "$0 (at par)" : "None (par or better)")), true) : "") +
    (isDSCR && result.dscr ? field("DSCR at this rate", result.dscr.toFixed(2) + "x", true) : "") +
    (!isDSCR ? field("Experience Tier", esc(result.tier), true) : "");
  return '<div class="field-grid">' + rows + '</div>' +
    (isDSCR ? '<div class="footnote" style="padding-top:8px">Defaults to this borrower\'s par rate (no yield spread). Use the up/down arrows on Rate to quote higher and earn yield spread — updates live.</div>' : '') +
    (maxLoanInfo.stateAdj && maxLoanInfo.stateAdj.adj ? ('<div class="footnote" style="padding-top:8px">' + maxLoanInfo.stateAdj.state + ' property — max leverage reduced ' + maxLoanInfo.stateAdj.adj + '% per the matrix\'s state adjustment table.</div>') : '') +
    (maxLoanInfo.stateAdj && maxLoanInfo.stateAdj.needsManualCheck ? '<div class="footnote" style="padding-top:8px;color:var(--c-rust)">NY property — county-specific leverage reduction applies (-15% for the five boroughs, -5% Suffolk/Nassau). Verify manually, not applied here.</div>' : '') +
    (result.notes && result.notes.length ? ('<div class="footnote" style="padding-top:8px">' + result.notes.map(esc).join(" · ") + '</div>') : '') +
    '<div style="margin-top:14px"><button class="btn btn-primary" type="button" data-action="open-modal" data-modal="createLeadFromPricer">Create Lead From This Scenario →</button></div>';
}
function renderMyCalendarWidget(){
  if (isDemo()) return "";
  var uid = currentUser().id;
  var link = bookingLinkFor(uid);
  var nowTsVal = Date.now();
  var upcoming = (state.appointments||[]).filter(function(a){ return a.userId===uid && a.status!=="canceled" && new Date(a.startAt).getTime() >= nowTsVal; }).sort(function(a,b){ return new Date(a.startAt)-new Date(b.startAt); });
  var next3 = upcoming.slice(0,3).map(function(a){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-soft)">' +
      '<span><b>' + esc(a.name) + '</b> — ' + new Date(a.startAt).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) + '</span>' +
    '</div>';
  }).join("");
  return '<div class="panel panel-pad" style="margin-bottom:16px;border-color:var(--brand)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<div class="rail-title">📅 My Calendar' + (upcoming.length ? (' — ' + upcoming.length + ' upcoming') : '') + '</div>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="btn btn-sm" type="button" data-action="copy-booking-link" data-link="' + esc(link) + '">🔗 Copy My Booking Link</button>' +
        '<button class="btn btn-sm btn-ghost" type="button" data-action="open-modal" data-modal="mySchedule">My Schedule</button>' +
      '</div>' +
    '</div>' +
    (next3 || '<div class="hint" style="padding-top:4px">Nothing booked yet — share your link above so clients can grab a time.</div>') +
  '</div>';
}

function renderPipeline(){
  var leads = scopedLeads();
  var cols = STAGES.map(function(s){
    var inStage = leads.filter(function(l){ return l.stage===s.key && l.status!=="cold" && l.status!=="lost"; });
    var cards = inStage.map(function(l){
      return '<div class="pcard" data-action="select-lead" data-lead="' + l.id + '">' +
        '<div class="nm">' + esc(l.name) + '</div>' +
        '<div class="ty">' + esc(l.loanType) + '</div>' +
        '<div class="amt">' + fmtUSD(l.loanAmount) + '</div>' +
        '<div class="lo">' + esc(userName(l.assignedTo)) + '</div>' +
      '</div>';
    }).join("");
    return '<div class="col"><div class="col-head"><span class="name">' + s.label + '</span><span class="n num">' + inStage.length + '</span></div>' +
      '<div class="col-cards">' + (cards || '') + '</div></div>';
  }).join("");

  var coldLost = leads.filter(function(l){ return l.status==="cold" || l.status==="lost"; });
  var coldCards = coldLost.map(function(l){
    return '<div class="pcard" data-action="select-lead" data-lead="' + l.id + '">' +
      '<div class="nm">' + esc(l.name) + '</div>' +
      '<div class="ty">' + esc(l.loanType) + '</div>' +
      badgeForStage(l) +
    '</div>';
  }).join("");
  cols += '<div class="col" style="background:var(--c-rust-bg)"><div class="col-head"><span class="name">Cold / Lost</span><span class="n num">' + coldLost.length + '</span></div><div class="col-cards">' + (coldCards||'') + '</div></div>';

  return topbar("Pipeline", "Lead intake through post-closing, in one board.", "") +
    '<div class="content"><div class="board">' + cols + '</div></div>';
}

function renderLeadsTable(){
  var f = ui.leadFilter;
  var leads = scopedLeads().filter(function(l){
    if (f.status && l.status!==f.status) return false;
    if (f.stage && l.stage!==f.stage) return false;
    if (f.loanType && l.loanType!==f.loanType) return false;
    if (f.assignedTo && l.assignedTo!==f.assignedTo) return false;
    if (f.q){
      var q = f.q.toLowerCase();
      if (l.name.toLowerCase().indexOf(q)===-1 && (l.propertyAddress||"").toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });

  var loOptions = ownerOptions(f.assignedTo);
  var stageOptions = STAGES.map(function(s){ return '<option value="' + s.key + '"' + (f.stage===s.key?" selected":"") + '>' + s.label + '</option>'; }).join("");
  var typeOptions = LOAN_TYPES.map(function(t){ return '<option value="' + t + '"' + (f.loanType===t?" selected":"") + '>' + t + '</option>'; }).join("");

      '<option value="cold"' + (f.status==="cold"?" selected":"") + '>Cold</option>' +
      '<option value="lost"' + (f.status==="lost"?" selected":"") + '>Lost</option>' +
      '<option value=""' + (f.status===""?" selected":"") + '>All</option>' +
    '</select>' +
    '<select class="select" data-action="filter" data-key="stage"><option value="">Any stage</option>' + stageOptions + '</select>' +
    '<select class="select" data-action="filter" data-key="loanType"><option value="">Any loan type</option>' + typeOptions + '</select>' +
    (isOwner() ? ('<select class="select" data-action="filter" data-key="assignedTo"><option value="">Any officer</option>' + loOptions + '</select>') : '') +
  '</div>';

  var rows = leads.map(function(l){
    return '<tr data-action="select-lead" data-lead="' + l.id + '">' +
      '<td><div class="cell-name">' + esc(l.name) + '</div><div class="cell-sub">' + esc(l.propertyAddress||"") + '</div></td>' +
      '<td>' + esc(l.loanType) + '</td>' +
      '<td>' + badgeForStage(l) + '</td>' +
      '<td class="num">' + fmtUSD(l.loanAmount) + '</td>' +
      '<td>' + esc(l.source) + '</td>' +
      '<td>' + esc(userName(l.assignedTo)) + '</td>' +
      '<td>' + fmtDate(l.createdAt) + '</td>' +

  }).join("");

  var table = leads.length ? (
    '<div class="table-wrap"><table><thead><tr><th>Borrower</th><th>Loan Type</th><th>Stage</th><th>Amount</th><th>Source</th><th>Loan Officer</th><th>Created</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
  ) : '<div class="empty">No leads match these filters.</div>';

  var actions = '<button class="btn btn-ghost" data-action="open-modal" data-modal="importLeads">⬆ Import</button>' +
    '<button class="btn btn-primary" data-action="open-modal" data-modal="addLead">+ New Lead</button>';

  return topbar("Leads & Loans", leads.length + " record(s)", actions) +

  ensureStaffLeadPolling(lead.id);
  var tabs = '<div class="tabs">' +

function renderGuidelineCheck(lead){
  var gc = lead.guidelineCheck;
  var btnLabel = gc ? "Re-check Guidelines" : "Check Guidelines";
  var header = '<div class="section-head" style="margin-top:20px"><h2>Guideline Check</h2>' +
    '<button class="btn btn-sm" data-action="run-guideline-check" data-lead="' + lead.id + '">' + btnLabel + '</button></div>';
  if (GUIDELINE_LOAN_TYPES.indexOf(lead.loanType) === -1){
    return header + '<div class="hint">No guideline sheet loaded for ' + esc(lead.loanType||"this loan type") + ' yet.</div>';
  }
  if (!gc){
    return header + '<div class="hint">Run a check once purchase price, loan amount, credit score, and (for DSCR) rent are filled in.</div>';
  }
  var badge = gc.status === "pass"
    ? '<span class="badge badge-forest">Pass</span>'
    : '<span class="badge badge-rust">Needs Review</span>';
  var rows = gc.checks.map(function(c){
    var icon = c.pass ? '<span class="badge badge-forest">Pass</span>' : '<span class="badge badge-rust">Review</span>';
    return '<div class="doc-row"><div><div>' + esc(c.label) + '</div><div class="cell-sub">' + esc(c.detail) + '</div></div>' + icon + '</div>';
  }).join("");
  var explainSection = gc.status === "review"
    ? ('<div style="margin-top:10px"><button class="btn btn-sm" type="button" data-action="ai-explain-guideline" data-lead="' + lead.id + '">✨ Explain to LO</button>' +
       '<div id="guideline-explain-box" class="footnote" style="padding-top:8px;white-space:pre-wrap"></div></div>')
    : '';
  var outsideLenderSection = (gc.status === "review" && canViewOutsideLender()) ? renderOutsideLenderBox(lead) : '';
  var rcnFitSection = gc.status === "review" ? renderOutsideLenderFitBox(lead) : '';
  return header +
    '<div style="margin-bottom:10px">' + badge + ' <span class="hint">as of ' + fmtDate(gc.evaluatedAt) + '</span></div>' +
    rows + explainSection + outsideLenderSection + rcnFitSection +
    '<div class="footnote" style="padding-top:8px">Preliminary check against BPL/Constructive Loans matrices — not a substitute for full underwriting. Internal use only, never shown to the borrower.</div>';
}
function renderOutsideLenderFitBox(lead){
  if (!isOwner()) return '';
  var evaluators = Object.keys(OUTSIDE_LENDER_FIT_EVALUATORS).filter(function(k){ return typeof OUTSIDE_LENDER_FIT_EVALUATORS[k] === "function"; });
  if (!evaluators.length) return '';
  var blocks = evaluators.map(function(name){
    var fit = OUTSIDE_LENDER_FIT_EVALUATORS[name](lead);
    if (!fit) return '';
    var rec = rcnRecommendation(lead, fit);
    var statusBadge = fit.eligible ? '<span class="badge badge-forest">Likely Eligible</span>' : '<span class="badge badge-rust">Likely Decline</span>';
    var reasonsHTML = fit.reasons.length ? ('<div class="footnote" style="padding-top:4px">' + fit.reasons.map(esc).join(' · ') + '</div>') : '';
    var notesHTML = fit.notes.length ? ('<div class="footnote" style="padding-top:4px">' + fit.notes.map(esc).join(' · ') + '</div>') : '';

function buildPricerOutputHTML(lead, inputs){
  var isDSCR = lead.loanType === "DSCR" || lead.loanType === "Portfolio/Blanket";
  var maxLoanInfo = computeMaxLoanAmount(lead);
  var lockedToActualRate = false;
  var result, effectiveLoanAmount, parRateForDisplay = null;
  if (isDSCR && lead.rate){
    effectiveLoanAmount = lead.loanAmount;
    result = evaluatePricing(lead, inputs);
    if (result && !result.ineligible){
      var lockedNoYsp = (inputs.prepayTerm === "none") || (inputs.propertyType === "Multifamily 5+");
      var lockedInfo = dscrLockedRateInfo(lead);
      var lockedPriceRow = lockedInfo ? lockedInfo.priceRow : null;
      var lockedAtPar = lockedInfo && lockedInfo.delta === 0;
      result = Object.assign({}, result, {
        rate: lead.rate,
        price: lockedPriceRow ? lockedPriceRow.price : (lockedAtPar ? 100.000 : null),
        noYspAllowed: lockedNoYsp,
        ysp: (lockedPriceRow && !lockedNoYsp) ? Math.round((lockedPriceRow.price-100)*1000)/1000 : ((lockedAtPar && !lockedNoYsp) ? 0 : null),
        yspDollar: (lockedPriceRow && !lockedNoYsp) ? Math.max(0, Math.round((lockedPriceRow.price-100)/100*lead.loanAmount*100)/100) : ((lockedAtPar && !lockedNoYsp) ? 0 : null)
      });
      lockedToActualRate = true;
    }
  } else {
    effectiveLoanAmount = maxLoanInfo ? Math.floor(maxLoanInfo.amount) : lead.loanAmount;
    result = effectiveLoanAmount ? evaluatePricing(Object.assign({}, lead, { loanAmount: effectiveLoanAmount }), inputs) : null;
    if (result && !result.ineligible) parRateForDisplay = result.parRate;
  }
  var output;
  if (!result){
    output = '<div class="hint">Fill in credit score, purchase price, and the pricing inputs above to see live pricing.</div>';
  } else if (result.ineligible){
    output = '<div class="hint" style="color:var(--c-rust)">' + esc(result.reason) + '</div>';
  } else {
    var rateField = (isDSCR && !lockedToActualRate && parRateForDisplay!=null)
      ? dscrRateAdjustField(lead, result.rate, parRateForDisplay)
      : field("Rate" + (lockedToActualRate ? " (locked on this loan)" : ""), fmtPct(result.rate), true);
    var rows = (maxLoanInfo && !lockedToActualRate ? field("Max Loan Amount You Qualify For", fmtUSD(effectiveLoanAmount), true) : "") +
      rateField +
      field("Lender Fee", fmtUSD(result.fee), true) +
      (isDSCR ? field("Wholesale Price", result.price!=null ? result.price.toFixed(3) : "—", true) : "") +
      (isDSCR ? field("Yield Spread (YSP)", (result.ysp!=null && result.ysp>0) ? (fmtPct(result.ysp) + " — " + fmtUSD(result.yspDollar)) : (result.noYspAllowed ? "Not available" : (result.ysp===0 ? "$0 (at par)" : "None (par or better)")), true) : "") +
      (isDSCR && result.dscr ? field("DSCR at this rate", result.dscr.toFixed(2) + "x", true) : "") +
      (!isDSCR ? field("Experience Tier", esc(result.tier), true) : "");
    output = '<div class="field-grid">' + rows + '</div>' +
      (isDSCR && !lockedToActualRate ? '<div class="footnote" style="padding-top:8px">Defaults to this borrower\'s par rate (no yield spread). Use the up/down arrows on Rate to quote higher and earn yield spread — updates live.</div>' : '') +
      (lockedToActualRate ? '<div class="footnote" style="padding-top:8px">This loan already has a locked-in rate, so these figures reflect that rate rather than the sheet\'s suggested one — matches "Yield Spread Earned" in the rail. Change the rate from Loan Details above, not here.</div>' : '') +
      (maxLoanInfo && maxLoanInfo.stateAdj && maxLoanInfo.stateAdj.adj ? ('<div class="footnote" style="padding-top:8px">' + maxLoanInfo.stateAdj.state + ' property — max leverage reduced ' + maxLoanInfo.stateAdj.adj + '% per the matrix\'s state adjustment table.</div>') : '') +

      (isDSCR && result.yspDollar ? ('<div class="footnote" style="padding-top:8px">Est. YSP commission to ' + esc(userName(lead.assignedTo)) + ' if this closes: <b>' + fmtUSD(result.yspDollar * YSP_SPLIT) + '</b> (50% of ' + fmtPct(result.ysp) + ' × ' + fmtUSD(effectiveLoanAmount) + ')</div>') : '') +

      (canEditApplication(lead) ? ('<div style="margin-top:10px"><button class="btn btn-sm" type="button" data-action="send-term-sheet-from-pricer" data-lead="' + lead.id + '">Send Term Sheet at This Rate</button></div>') : '');

// Deal Analysis -- for short-term (Fix & Flip / Bridge / GUC) loans, models
// the exit decision: sell now vs. refinance into a long-term DSCR loan.
// Explicitly leans toward recommending refi (per Joe's direction) since it
// keeps the client's equity working and is another loan for us -- but the
// lean only flips a genuinely close call, never overrides real numbers
// that clearly favor selling. All estimates, not underwriting.
var DEAL_ANALYSIS_SELLING_COST_PCT = 0.08; // realtor + closing, blended estimate
var DEAL_ANALYSIS_REFI_CLOSING_PCT = 0.02;
function computeDealAnalysis(lead){
  if (SHORT_TERM_TYPES.indexOf(lead.loanType) === -1) return null;
  var arv = lead.arv || lead.currentValue;
  if (!lead.purchasePrice || !lead.loanAmount || !arv) return null;

  var holdingMonths = lead.termMonths || 12;
  var rate = lead.rate != null ? lead.rate : 11.0;
  var loanInterestCost = lead.loanAmount * (rate/100) * (holdingMonths/12);
  var originationCost = lead.loanAmount * ((lead.pointsCharged||0)/100);
  var sellingCosts = arv * DEAL_ANALYSIS_SELLING_COST_PCT;
  var totalCostBasis = lead.purchasePrice + (lead.rehabBudget||0) + loanInterestCost + originationCost;
  var sellProfit = Math.round(arv - totalCostBasis - sellingCosts);

  var valueBasis = lead.currentValue || arv;
  var ficoTier = DSCR_LTV_BY_FICO.filter(function(t){ return (lead.creditScore||0) >= t.minFico; })[0] || DSCR_LTV_BY_FICO[DSCR_LTV_BY_FICO.length-1];
  var maxDscrLoan = Math.round(valueBasis * (ficoTier.cashOut/100));
  var refiClosingCosts = Math.round(maxDscrLoan * DEAL_ANALYSIS_REFI_CLOSING_PCT);
  var cashOutProceeds = Math.round(maxDscrLoan - lead.loanAmount - refiClosingCosts);
  var dscrRateEstimate = (state.marketRates.dscr && state.marketRates.dscr.current) || DSCR_BASE_PAR_RATE;
  var newPI = monthlyPayment(maxDscrLoan, dscrRateEstimate, 360);
  var monthlyCashFlow = (lead.rentEstimate && newPI) ? Math.round(lead.rentEstimate - newPI - (lead.monthlyTaxes||0) - (lead.monthlyInsurance||0) - (lead.monthlyHoa||0)) : null;

  // Lean refi: only recommend selling if it clearly and substantially wins
  // (25%+ more net value) -- a close call goes to refi.
  var recommendation = "refi";
  if (sellProfit > 0 && cashOutProceeds != null && sellProfit > cashOutProceeds * 1.25){
    recommendation = "sell";
  }
  if (cashOutProceeds < 0) recommendation = "sell"; // refi genuinely doesn't work, no real choice

  var rateTrend = (state.marketRates.dscr && state.marketRates.dscr.current < state.marketRates.dscr.previous) ? "down" : "flat_or_up";

  return {
    sellProfit: sellProfit, sellingCosts: Math.round(sellingCosts), loanInterestCost: Math.round(loanInterestCost),
    maxDscrLoan: maxDscrLoan, cashOutProceeds: cashOutProceeds, refiClosingCosts: refiClosingCosts,
    dscrRateEstimate: dscrRateEstimate, monthlyCashFlow: monthlyCashFlow, recommendation: recommendation,
    rateTrend: rateTrend, arv: arv
  };
}
function renderDealAnalysis(lead){
  var d = computeDealAnalysis(lead);
  if (!d) return "";
  var isRefi = d.recommendation === "refi";
  return '<div class="section-head" style="margin-top:20px"><h2>Deal Analysis</h2></div>' +
    '<div class="panel panel-pad">' +
      '<div class="rail-title" style="margin-bottom:6px">Market Conditions</div>' +
      '<div class="footnote" style="padding:0 0 12px">DSCR par rate currently ' + fmtPct(d.dscrRateEstimate) + (d.rateTrend==="down" ? " — trending down, a good window to refinance into" : "") + '.</div>' +
      '<div class="field-grid">' +
        field("Est. Profit If Sold", fmtUSD(d.sellProfit), true) +
        field("Est. Cash-Out If Refi'd to DSCR", d.cashOutProceeds!=null ? fmtUSD(d.cashOutProceeds) : "—", true) +
        field("New DSCR Loan Amount (est.)", fmtUSD(d.maxDscrLoan), true) +
        (d.monthlyCashFlow!=null ? field("Est. Monthly Cash Flow After Refi", fmtUSD(d.monthlyCashFlow), true) : "") +
      '</div>' +
      '<div class="footnote" style="padding-top:6px">Sell estimate assumes ' + (DEAL_ANALYSIS_SELLING_COST_PCT*100) + '% selling costs and full-term interest carry. Refi estimate assumes ' + (DEAL_ANALYSIS_REFI_CLOSING_PCT*100) + '% closing costs at today\'s DSCR rate — real quote may differ once pulled through the Pricer.</div>' +
      '<div style="margin-top:10px;padding:10px;border-radius:8px;background:var(--surface-2)">' +
        '<b>' + (isRefi ? "Recommendation: Refinance to DSCR" : "Recommendation: Sell") + '</b>' +
        '<div class="footnote" style="padding-top:4px">' + (isRefi
          ? "Keeps the client in the deal, generating cash flow" + (d.monthlyCashFlow!=null && d.monthlyCashFlow>0 ? " (positive)" : "") + " while pulling out equity — and it's a new loan for us."
          : "The sale nets meaningfully more than refinancing would right now.") + '</div>' +
      '</div>' +
    '</div>';
}

function payrollRows(){
  var closed = state.leads.filter(function(l){ return l.status === "closed"; });
  var entries = state.payrollEntries || [];
  var linked = entries.filter(function(e){ return e.leadId; });
  var manual = entries.filter(function(e){ return !e.leadId; });
  function findLinked(leadId, personId, role){
    return linked.filter(function(e){ return e.leadId===leadId && e.personId===personId && e.role===role; })[0];
  }
  var rows = [];
  closed.forEach(function(lead){
    var p = payrollFor(lead);
    if (!p.skipLo && p.loCommission){
      var e = findLinked(lead.id, lead.assignedTo, "lo");
      rows.push(e ? normalizeEntry(e) : {
        id:null, leadId:lead.id, personId:lead.assignedTo, role:"lo", amount:p.loCommission, status:"outstanding",
        fileLabel: lead.name + " · " + lead.loanType, entryDate: lead.closeDate, personName: p.loName
      });
    }
    var proc = processingContact(lead);
    if (proc && p.processorFee){
      var ep = findLinked(lead.id, proc.id, "processor");
      rows.push(ep ? normalizeEntry(ep) : {
        id:null, leadId:lead.id, personId:proc.id, role:"processor", amount:p.processorFee, status:"outstanding",
        fileLabel: lead.name + " · " + lead.loanType, entryDate: lead.closeDate, personName: p.processorName
      });
    }
  });
  manual.forEach(function(e){ rows.push(normalizeEntry(e)); });
  rows.sort(function(a,b){ return (b.entryDate||"").localeCompare(a.entryDate||""); });
  return rows;
}
function normalizeEntry(e){
  var person = userById(e.personId);
  return {
    id: e.id, leadId: e.leadId, personId: e.personId, role: e.role, amount: e.amount, status: e.status,
    fileLabel: e.leadId ? (leadById(e.leadId) ? (leadById(e.leadId).name + " · " + leadById(e.leadId).loanType) : e.fileLabel) : e.fileLabel,
    entryDate: e.entryDate, personName: (person && person.name) || e.personId, note: e.note
  };
}

  days = days || 21;
  var rules = (state.availabilityRules||[]).filter(function(r){ return r.userId===userId; });
  var existing = (state.appointments||[]).filter(function(a){ return a.userId===userId && a.status!=="canceled"; });
  var now = new Date();
  var out = [];
  for (var d=0; d<days; d++){
    var day = new Date(now.getFullYear(), now.getMonth(), now.getDate()+d);
    var dow = day.getDay();
    var dayRules = rules.filter(function(r){ return r.dayOfWeek===dow; });
    if (!dayRules.length) continue;
    var slots = [];
    dayRules.forEach(function(r){
      for (var m=r.startMinutes; m+r.slotMinutes<=r.endMinutes; m+=r.slotMinutes){
        var slotStart = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, m);
        var slotEnd = new Date(slotStart.getTime() + r.slotMinutes*60000);
        if (slotStart <= now) continue;
        var overlaps = existing.some(function(a){
          var aStart = new Date(a.startAt), aEnd = new Date(a.endAt);
          return slotStart < aEnd && slotEnd > aStart;
        });
        if (!overlaps) slots.push({ start: slotStart, end: slotEnd });
      }
    });
    slots.sort(function(a,b){ return a.start - b.start; });
    if (slots.length) out.push({ date: day, slots: slots });
  }
  return out;
}

function borrowerGroupKey(l){
  var phoneDigits = (l.phone||"").replace(/\D/g,"").slice(-10);
  if (phoneDigits.length === 10) return "p:" + phoneDigits;
  var email = (l.email||"").trim().toLowerCase();
  if (email) return "e:" + email;
  return null;
}
function computeRepeatClients(){
  var groups = {};
  state.leads.forEach(function(l){
    var key = borrowerGroupKey(l);
    if (!key) return;
    groups[key] = groups[key] || [];
    groups[key].push(l);
  });
  var out = [];
  Object.keys(groups).forEach(function(key){
    var leads = groups[key];
    if (leads.length < 2) return;
    leads.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    var closed = leads.filter(function(l){ return l.status === "closed" && l.stage !== "lost"; });
    var active = leads.filter(function(l){ return l.status === "active"; });
    var closedVolume = closed.reduce(function(s,l){ return s + (Number(l.loanAmount)||0); }, 0);
    var activeVolume = active.reduce(function(s,l){ return s + (Number(l.loanAmount)||0); }, 0);
    out.push({
      key: key, name: leads[0].name, leads: leads,
      totalLoans: leads.length, closedCount: closed.length,
      closedVolume: closedVolume, activeVolume: activeVolume,
      lastLoanDate: leads[0].createdAt
    });
  });
  out.sort(function(a,b){ return b.totalLoans - a.totalLoans || b.closedVolume - a.closedVolume; });
  return out;
}

var COMM_TYPES = ["call","text","email","notify"];

        '<div class="queue-reason">' + esc(i.text) + '</div>' +
        '<div class="queue-meta"><span>' + fmtDate(i.date) + '</span>' + (i.author ? ('<span>' + esc(i.author) + '</span>') : '') + (isOwner() ? ('<span>LO: ' + esc(userName(i.assignedTo)) + '</span>') : '') + '</div>' +
      '</div>' +

  return topbar("Communications", "Every call, text, and email logged across " + (isOwner() ? "the team" : "your leads") + ", newest first.", "") +

function renderPerformance(){
  var leads = scopedLeads();
  var stl = speedToLeadStats(leads);

  var stlRows = leads.slice().sort(function(a,b){
    var da = a.createdAtTs || (a.createdAt+"T00:00:00Z"), db = b.createdAtTs || (b.createdAt+"T00:00:00Z");
    return db.localeCompare(da);
  }).map(function(l){
    var ms = speedToLeadMs(l);
    var statusCell;
    if (ms !== null){
      statusCell = '<span class="badge ' + speedBadgeClass(ms) + '">' + fmtDuration(ms) + '</span>';
    } else if (l.status==="active"){
      var elapsed = l.createdAtTs ? (Date.now() - new Date(l.createdAtTs).getTime()) : null;
      statusCell = '<span class="badge badge-rust">Still waiting' + (elapsed!==null ? (" · " + fmtDuration(elapsed)) : "") + '</span>';
    } else {
      statusCell = '<span class="badge badge-neutral">No attempt logged</span>';
    }
    return '<tr data-action="select-lead" data-lead="' + l.id + '" style="cursor:pointer">' +
      '<td><b>' + esc(l.name) + '</b></td>' +
      (isOwner() ? ('<td>' + esc(userName(l.assignedTo)) + '</td>') : '') +
      '<td>' + esc(l.source) + '</td>' +
      '<td>' + fmtDate(l.createdAt) + '</td>' +
      '<td>' + statusCell + '</td>' +
    '</tr>';
  }).join("");

  var loRankingHTML = "";
  if (isOwner()){
    var ranking = loanOfficers().map(function(u){
      var mine = state.leads.filter(function(l){ return l.assignedTo===u.id; });
      var s = speedToLeadStats(mine);
      return { name:u.name, avgMs:s.avgMs, pctWithin1hr:s.pctWithin1hr, uncontacted:s.uncontactedCount };
    }).sort(function(a,b){
      if (a.avgMs===null) return 1; if (b.avgMs===null) return -1;
      return a.avgMs - b.avgMs;
    });
    loRankingHTML = '<div class="section"><div class="section-head"><h2>Speed to Lead — by Loan Officer</h2></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Loan Officer</th><th>Avg. Speed to Lead</th><th>% Contacted Within 1 Hr</th><th>Still Waiting</th></tr></thead><tbody>' +
      ranking.map(function(r){
        return '<tr><td><b>' + esc(r.name) + '</b></td><td class="num">' + fmtDuration(r.avgMs) + '</td>' +
          '<td class="num">' + (r.pctWithin1hr===null ? "—" : r.pctWithin1hr+"%") + '</td>' +
          '<td class="num">' + (r.uncontacted ? ('<span class="badge badge-rust">' + r.uncontacted + '</span>') : "0") + '</td></tr>';
      }).join("") +
      '</tbody></table></div></div>';
  }

  var funnel = funnelCounts(leads);
  var funnelMax = funnel.length ? funnel[0].reached : 0;
  var funnelHTML = '<div class="table-wrap"><table><thead><tr><th>Stage</th><th>Reached This Stage</th><th>Currently Here</th><th>Drop-off to Next Stage</th></tr></thead><tbody>' +
    funnel.map(function(f, i){
      var next = funnel[i+1];
      var dropPct = (next && f.reached) ? Math.round((1 - next.reached/f.reached) * 100) : null;
      var barPct = funnelMax ? Math.round((f.reached/funnelMax)*100) : 0;
      return '<tr><td><b>' + esc(f.label) + '</b>' +
          '<div style="background:var(--border-soft);border-radius:4px;height:6px;margin-top:4px;overflow:hidden"><div style="width:' + barPct + '%;height:100%;background:var(--brand)"></div></div>' +
        '</td>' +
        '<td class="num">' + f.reached + '</td>' +
        '<td class="num">' + f.current + '</td>' +
        '<td class="num">' + (dropPct===null ? '—' : (dropPct>0 ? ('<span style="color:var(--c-rust)">-' + dropPct + '%</span>') : '0%')) + '</td>' +
      '</tr>';
    }).join("") +
    '</tbody></table></div>';

  var velocity = computeStageVelocity(leads);
  var velocityHTML = '<div class="table-wrap"><table><thead><tr><th>Stage</th><th>Avg. Time Before Advancing</th><th>Based On</th></tr></thead><tbody>' +
    velocity.byStage.map(function(s){
      return '<tr><td><b>' + esc(s.label) + '</b></td>' +
        '<td class="num">' + (s.avgDays===null ? '—' : fmtDuration(s.avgDays*86400000)) + '</td>' +
        '<td class="num">' + (s.count ? (s.count + ' transition' + (s.count===1?'':'s')) : '—') + '</td></tr>';
    }).join("") +
    '</tbody></table></div>';

  var convRows = conversionBySource(leads);
  var convHTML = '<div class="table-wrap"><table><thead><tr><th>Source</th><th>Total Leads</th><th>Closed</th><th>Conversion Rate</th><th>Active</th><th>Lost / Cold</th><th>Closed Volume</th></tr></thead><tbody>' +
    (convRows.length ? convRows.map(function(b){
      return '<tr><td><b>' + esc(b.source) + '</b></td><td class="num">' + b.total + '</td><td class="num">' + b.closed + '</td>' +
        '<td class="num"><b>' + b.rate + '%</b></td><td class="num">' + b.active + '</td><td class="num">' + b.lostCold + '</td>' +
        '<td class="num">' + fmtUSD(b.closedValue) + '</td></tr>';
    }).join("") : '<tr><td colspan="7" class="cell-sub">No leads yet.</td></tr>') +
    '</tbody></table></div>';

  return topbar("Speed & Conversion", "How fast leads get their first call, and which sources actually convert — " + (isOwner() ? "across the whole team." : "for your own leads."), "") +
    '<div class="content">' +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="kpi-label">Avg. Speed to Lead</div><div class="kpi-value num">' + fmtDuration(stl.avgMs) + '</div><div class="kpi-sub">' + stl.contactedCount + ' lead(s) contacted</div></div>' +
        '<div class="kpi"><div class="kpi-label">Contacted Within 1 Hr</div><div class="kpi-value num">' + (stl.pctWithin1hr===null?"—":stl.pctWithin1hr+"%") + '</div><div class="kpi-sub">Fast follow-up sets the odds of a call-back</div></div>' +
        '<div class="kpi"><div class="kpi-label">Still Waiting</div><div class="kpi-value num">' + stl.uncontactedCount + '</div><div class="kpi-sub">Active leads with no attempt logged yet</div></div>' +
        '<div class="kpi"><div class="kpi-label">Avg. Days to Close</div><div class="kpi-value num">' + (velocity.avgDaysToClose===null?"—":(Math.round(velocity.avgDaysToClose*10)/10)) + '</div><div class="kpi-sub">Lead created → funded, closed loans only</div></div>' +
        '<div class="kpi"><div class="kpi-label">Pull-Through Rate</div><div class="kpi-value num">' + (velocity.pullThroughRate===null?"—":velocity.pullThroughRate+"%") + '</div><div class="kpi-sub">Of ' + velocity.everReachedApp + ' completed application(s), ' + velocity.closedCount + ' closed</div></div>' +
      '</div>' +
      loRankingHTML +
      '<div class="section"><div class="section-head"><h2>Speed to Lead — by Lead</h2><span class="hint">First call/text attempt after creation</span></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Lead</th>' + (isOwner() ? '<th>Loan Officer</th>' : '') + '<th>Source</th><th>Created</th><th>Speed to Lead</th></tr></thead><tbody>' + stlRows + '</tbody></table></div>' +
      '</div>' +
      '<div class="section"><div class="section-head"><h2>Funnel — Where Leads Drop Off</h2><span class="hint">"Reached" counts every lead that ever got at least this far, even if later lost/cold</span></div>' + funnelHTML + '</div>' +
      '<div class="section"><div class="section-head"><h2>Pipeline Velocity — Time Spent Per Stage</h2><span class="hint">Average time between entering a stage and advancing to the next, across every lead that\'s made that move</span></div>' + velocityHTML + '</div>' +
      '<div class="section"><div class="section-head"><h2>Conversion by Marketing Source</h2><span class="hint">Includes Self-Generated leads</span></div>' + convHTML + '</div>' +
    '</div>';
}

function renderRetargeting(){

  var eligible = pool.filter(function(l){ return !!winbackInfo(l, today); });
  var notYet = pool.filter(function(l){ return (l.status==="cold" || l.status==="lost") && !winbackInfo(l, today); });

  eligible.sort(function(a,b){ return winbackInfo(b,today).priority - winbackInfo(a,today).priority; });

  var cards = eligible.map(function(l){
    var wb = winbackInfo(l, today);
    var msg = suggestedWinbackMessage(l);
    return '<div class="queue-card type-winback" style="border-left-color:var(--c-forest)">' +
      '<div class="queue-main">' +
        '<div class="queue-title">' + esc(l.name) + ' <span class="badge ' + (l.status==="cold"?"badge-rust":"badge-neutral") + '">' + (l.status==="cold"?"Cold":"Lost") + '</span></div>' +
        '<div class="queue-reason">' + esc(wb.reasons.join(" · ")) + '</div>' +
        '<div class="queue-meta"><span>' + esc(l.loanType) + '</span><span>' + esc(l.phone) + '</span>' + (isOwner()?('<span>LO: ' + esc(userName(l.assignedTo)) + '</span>'):'') + '</div>' +
        '<textarea class="textarea" readonly style="margin-top:8px;font-size:.78rem" rows="2">' + esc(msg) + '</textarea>' +
      '</div>' +
      '<div class="queue-actions">' +
        '<a class="btn btn-sm" href="tel:' + esc((l.phone||"").replace(/[^0-9+]/g,"")) + '">Call</a>' +
        '<button class="btn btn-sm" data-action="open-modal" data-modal="sendText" data-lead="' + l.id + '">Text</button>' +
        '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="logCall" data-lead="' + l.id + '">Log Outreach</button>' +
        '<button class="btn btn-sm btn-ghost" data-action="select-lead" data-lead="' + l.id + '">View</button>' +
      '</div>' +
    '</div>';
  }).join("");

  var notYetHTML = notYet.length ? (
    '<div class="section-head" style="margin-top:24px"><h2>Not due yet</h2><span class="hint">' + notYet.length + '</span></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Loan Type</th><th>Status</th><th>Loan Officer</th></tr></thead><tbody>' +
    notYet.map(function(l){ return '<tr data-action="select-lead" data-lead="' + l.id + '"><td>' + esc(l.name) + '</td><td>' + esc(l.loanType) + '</td><td>' + badgeForStage(l) + '</td><td>' + esc(userName(l.assignedTo)) + '</td></tr>'; }).join("") +
    '</tbody></table></div>'
  ) : "";

  return topbar("Retargeting", "Cold and lost leads worth another touch — resurfaced when rates move in their favor or enough time has passed.", "") +
    '<div class="content">' +
      (cards || '<div class="empty">No win-back opportunities right now. Cold and lost leads reappear here after 30+ days, or the moment their loan type’s rate drops.</div>') +
      notYetHTML +
    '</div>';
}

/* ---------------------------------------------------------------------
   Team Chat — internal staff-to-staff direct messages
--------------------------------------------------------------------- */
function teammatesForChat(){
  return state.users.filter(function(u){ return u.id !== ui.viewAs && !isDemoAccountId(u.id); });
}
function threadWith(userId){
  return (state.teamMessages||[]).filter(function(m){
    return (m.fromUserId===ui.viewAs && m.toUserId===userId) || (m.fromUserId===userId && m.toUserId===ui.viewAs);
  }).sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });
}
function unreadTeamChatCount(fromUserId, toUserId){
  return (state.teamMessages||[]).filter(function(m){ return m.fromUserId===fromUserId && m.toUserId===toUserId && !m.read; }).length;
}
function unreadTeamChatTotal(userId){
  return (state.teamMessages||[]).filter(function(m){ return m.toUserId===userId && !m.read; }).length;
}
function openChatWith(userId){
  ui.teamChatWith = userId;
  var thread = threadWith(userId);
  var changed = false;
  thread.forEach(function(m){ if (m.toUserId===ui.viewAs && !m.read){ m.read = true; changed = true; } });
  render();
  if (changed) scheduleSync();
}
function sendTeamMessage(toUserId, body){
  body = (body||"").trim();
  if (!body || !toUserId) return;
  state.teamMessages = state.teamMessages || [];
  state.teamMessages.push({
    id: "tm" + Date.now().toString(36) + Math.floor(Math.random()*1000),
    fromUserId: ui.viewAs, toUserId: toUserId, body: body,
    createdAt: new Date().toISOString(), read: false
  });
  persist();
}
function renderTeamChat(){
  ensureTeamChatPolling();
  var mates = teammatesForChat();
  if (!ui.teamChatWith || mates.every(function(u){ return u.id !== ui.teamChatWith; })){
    ui.teamChatWith = mates[0] ? mates[0].id : null;
  }
  var list = mates.map(function(u){
    var thread = threadWith(u.id);
    var last = thread[thread.length-1];
    var unread = unreadTeamChatCount(u.id, ui.viewAs);
    var active = u.id === ui.teamChatWith;
    return '<div class="doc-row" style="cursor:pointer;' + (active ? 'background:var(--brand-tint)' : '') + '" data-action="open-team-chat" data-user="' + u.id + '">' +
      '<div>' +
        '<div>' + esc(u.name) + (unread ? (' <span class="badge badge-hot">' + unread + '</span>') : '') + '</div>' +
        '<div class="cell-sub">' + esc(last ? (last.body.slice(0,60) + (last.body.length>60?"…":"")) : "No messages yet") + '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  var activeUser = userById(ui.teamChatWith);
  var thread = ui.teamChatWith ? threadWith(ui.teamChatWith) : [];
  var msgs = thread.map(function(m){
    var mine = m.fromUserId === ui.viewAs;
    return '<div style="display:flex;' + (mine ? 'justify-content:flex-end' : '') + ';margin-bottom:8px">' +
      '<div style="max-width:70%;padding:8px 12px;border-radius:10px;background:' + (mine ? 'var(--brand)' : 'var(--surface-2,var(--border-soft))') + ';color:' + (mine ? 'var(--brand-ink)' : 'inherit') + '">' +
        '<div style="white-space:pre-wrap">' + esc(m.body) + '</div>' +
        '<div class="footnote" style="padding-top:2px;opacity:.8">' + fmtDate((m.createdAt||"").slice(0,10)) + '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  var chatPane = activeUser
    ? ('<div style="display:flex;flex-direction:column;height:100%">' +
        '<div class="section-head"><h2>' + esc(activeUser.name) + '</h2></div>' +
        '<div style="flex:1;overflow-y:auto;padding:4px 4px 12px">' + (msgs || '<div class="empty">No messages yet — say hi.</div>') + '</div>' +
        '<form data-form="team-chat-send" data-to="' + activeUser.id + '" style="display:flex;gap:8px">' +
          '<input class="input" name="body" placeholder="Message ' + esc(activeUser.name) + '…" autocomplete="off" style="flex:1" required>' +
          '<button class="btn btn-primary" type="submit">Send</button>' +
        '</form>' +
      '</div>')
    : '<div class="empty">No teammates to message yet.</div>';
  return topbar("Team Chat", "Direct messages between staff — internal only, never seen by borrowers.", "") +
    '<div class="content" style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start">' +
      '<div class="panel panel-pad">' + (list || '<div class="empty">No teammates yet.</div>') + '</div>' +
      '<div class="panel panel-pad" style="height:60vh">' + chatPane + '</div>' +
    '</div>';
}

/* ---------------------------------------------------------------------
   Email inbox — real per-user mailbox, backed by the existing emails
   table (already fed by send-email/receive-email, just never surfaced)
--------------------------------------------------------------------- */
var emailPollTimer = null;
function ensureEmailPolling(){
  if (emailPollTimer) return;
  emailPollTimer = setInterval(function(){
    if (!sb || ui.view !== "email"){
      clearInterval(emailPollTimer);
      emailPollTimer = null;
      return;
    }
    refreshEmails();
  }, 15000);
}
function myEmails(){
  var all = state.emails || [];
  if (isOwner()) return all;
  var myAddr = (currentUser().email||"").toLowerCase();
  return all.filter(function(e){
    if (e.sentBy === ui.viewAs) return true;
    var lead = e.leadId ? leadById(e.leadId) : null;
    if (lead && lead.assignedTo === ui.viewAs) return true;
    if (!lead && (e.toAddress||"").toLowerCase() === myAddr) return true;
    return false;
  });
}
function sendComposedEmail(leadId, to, subject, body){
  if (!sb || !to || !subject || !body) return;
  var me = currentUser();
  showToast("Sending…");
  sb.functions.invoke("send-email", { body: {
    leadId: leadId || null, to: to, subject: subject, text: body,
    fromName: me.name, fromAddress: me.email, fromUserId: me.id, fromPhotoUrl: me.photoUrl || null
  } }).then(function(res){
    if (res.error || !res.data || !res.data.ok){ showToast("Couldn't send — try again"); return; }
    showToast("Email sent");
    refreshEmails();
  }).catch(function(){ showToast("Couldn't send — try again"); });
}
function renderEmailInbox(){
  ensureEmailPolling();
  var emails = myEmails();
  var rows = emails.map(function(e){
    var lead = e.leadId ? leadById(e.leadId) : null;
    var expanded = ui.expandedEmailId === e.id;
    var dirBadge = e.direction === "inbound" ? '<span class="badge badge-forest">Received</span>' : '<span class="badge badge-slate">Sent</span>';
    var otherParty = e.direction === "inbound" ? e.fromAddress : e.toAddress;
    return '<div class="queue-card">' +
      '<div class="queue-main" data-action="toggle-email" data-id="' + e.id + '" style="cursor:pointer">' +
        '<div class="queue-title">' + dirBadge + ' ' + esc(e.subject||"(no subject)") + '</div>' +
        '<div class="queue-reason">' + (e.direction==="inbound"?"From ":"To ") + esc(otherParty||"") + (lead ? (' · ' + esc(lead.name)) : '') + '</div>' +
        '<div class="queue-meta"><span>' + fmtDate((e.createdAt||"").slice(0,10)) + '</span></div>' +
        (expanded ? ('<div class="footnote" style="white-space:pre-wrap;padding-top:8px;border-top:1px solid var(--border-soft);margin-top:8px">' + esc(e.body||"") + '</div>') : '') +
      '</div>' +
      '<div class="queue-actions">' +
        (lead ? ('<button class="btn btn-sm btn-ghost" data-action="select-lead" data-lead="' + lead.id + '">View Loan</button>') : '') +
        '<button class="btn btn-sm" data-action="reply-email" data-id="' + e.id + '">Reply</button>' +
      '</div>' +
    '</div>';
  }).join("");
  return topbar("Email", "Every email you've sent or received through the CRM — click one to read it, or start a new one.", '<button class="btn btn-primary" data-action="open-modal" data-modal="composeEmail">✉ Compose</button>') +

function buildScenarioFieldsHTML(lead, lang){

  var loanType = lead.loanType;

  var rehabLabel = L(loanType === "Ground Up Construction" ? "Construction Budget" : "Rehab Budget");
  var txnOptions = TRANSACTION_TYPES.map(function(t){ return '<option value="' + t.key + '"' + ((lead.transactionType||"purchase")===t.key?" selected":"") + '>' + L(t.label) + '</option>'; }).join("");

      '<div class="form-row"><label>' + L("Transaction Type") + '</label><select class="select" name="transactionType">' + txnOptions + '</select></div>' +
      '<div class="form-row"><label>' + L("Prepayment Penalty") + '</label><select class="select" name="prepayTerm">' + prepayOptions + '</select></div>' +
    '</div>';
  if (isDSCR){
    return '<div class="form-two">' +
        '<div class="form-row"><label>' + L("Purchase Price") + '</label><input class="input" type="number" name="purchasePrice" value="' + v(lead.purchasePrice) + '"></div>' +
        '<div class="form-row"><label>' + L("Monthly Rent Estimate") + '</label><input class="input" type="number" name="rentEstimate" value="' + v(lead.rentEstimate) + '"></div>' +
      '</div>' +

        '<div class="form-row"><label>' + L("Monthly Property Tax") + '</label><input class="input" type="number" name="monthlyTaxes" value="' + v(lead.monthlyTaxes) + '"></div>' +
        '<div class="form-row"><label>' + L("Monthly Insurance") + '</label><input class="input" type="number" name="monthlyInsurance" value="' + v(lead.monthlyInsurance) + '"></div>' +
      '</div>' +

      dscrPricingInputs;
  } else if (isRehabType){
    return '<div class="form-two">' +
        '<div class="form-row"><label>' + L("Purchase Price") + '</label><input class="input" type="number" name="purchasePrice" value="' + v(lead.purchasePrice) + '"></div>' +

      '</div>' +
      '<div class="form-row"><label>' + rehabLabel + '</label><input class="input" type="number" name="rehabBudget" value="' + v(lead.rehabBudget) + '"></div>';
  } else if (loanType === "Portfolio/Blanket"){

/* ---------------------------------------------------------------------
   Signature pads — plain canvas, drawn with mouse or touch. Bound once
   per canvas id (data-bound guard) since render() recreates the DOM;
   only ever initialized after a real render, never mid-typing, so a
   signature already drawn survives re-renders of everything else on
   the page as long as that canvas itself isn't replaced.
--------------------------------------------------------------------- */
function sigPadHTML(id, label, lang){
  return '<div class="form-row">' +
    '<label>' + esc(label) + '</label>' +
    '<canvas id="' + id + '" data-sigpad="1" width="500" height="140" style="border:1px solid var(--border);border-radius:8px;width:100%;max-width:500px;height:140px;touch-action:none;cursor:crosshair;background:#fff;display:block"></canvas>' +
    '<button class="btn btn-sm btn-ghost" type="button" data-action="clear-signature" data-canvas="' + id + '" style="margin-top:6px">' + esc(tr("Clear Signature", lang||"en")) + '</button>' +
  '</div>';
}
function initSignaturePad(canvasId){
  var canvas = document.getElementById(canvasId);
  if (!canvas || canvas.dataset.bound) return;
  canvas.dataset.bound = "1";
  var ctx = canvas.getContext("2d");
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1b2a47";
  var drawing = false, last = null;
  function pos(e){
    var rect = canvas.getBoundingClientRect();
    var t = e.touches && e.touches[0];
    var clientX = t ? t.clientX : e.clientX;
    var clientY = t ? t.clientY : e.clientY;
    return { x: (clientX-rect.left) * (canvas.width/rect.width), y: (clientY-rect.top) * (canvas.height/rect.height) };
  }
  function start(e){ drawing = true; last = pos(e); canvas.dataset.signed = "1"; e.preventDefault(); }
  function move(e){ if (!drawing) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; e.preventDefault(); }
  function stop(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", stop);
  canvas.addEventListener("touchstart", start, { passive:false });
  canvas.addEventListener("touchmove", move, { passive:false });
  canvas.addEventListener("touchend", stop);
}
function initSignaturePads(){
  var canvases = document.querySelectorAll("canvas[data-sigpad]");
  for (var i=0;i<canvases.length;i++){ initSignaturePad(canvases[i].id); }
}
function clearSignaturePad(canvasId){
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
  canvas.dataset.signed = "";
}
function signaturePadDataUrl(canvasId){
  var canvas = document.getElementById(canvasId);
  if (!canvas || canvas.dataset.signed !== "1") return null;
  return canvas.toDataURL("image/png");
}

function createLeadFromScenario(data){

  var result = maxLoanAmount ? evaluatePricing(Object.assign({}, sp, { loanAmount: maxLoanAmount }), sp) : null;
  var lead = {
    id:id, name:data.name, email:data.email||null, phone:data.phone, source:data.source, loanType: sp.loanType,
    stage:"new", status:"active", assignedTo:data.assignedTo, createdAt:d, createdAtTs:nowTs(), firstAttemptAt:null,
    entityType:"LLC", creditScore: sp.creditScore, experienceDeals: sp.experienceDeals, liquidity:null,
    propertyAddress: data.propertyAddress||sp.propertyAddress||"", propertyType: sp.propertyType, purchasePrice: sp.purchasePrice, arv:sp.arv, rehabBudget: sp.rehabBudget,
    rentEstimate: sp.rentEstimate, loanAmount: maxLoanAmount,
    ruralStatus: sp.ruralStatus||null, ruralCheckedAt: sp.ruralStatus ? todayISO() : null,
    ltv: (sp.purchasePrice && maxLoanAmount) ? Math.round((maxLoanAmount/sp.purchasePrice)*1000)/10 : null,
    rate: (result && !result.ineligible) ? result.rate : null, termMonths: sp.termMonths,
    exitStrategy:null, closeDate:null, nextFollowUp:null, nextFollowUpNote:null, pointsCharged:null,
    callAttempts:[], documents:[], thirdParties:[], applicationToken: randomToken(),
    citizenshipStatus: sp.citizenshipStatus, transactionType: sp.transactionType, prepayTerm: sp.prepayTerm,
    propertyCount: sp.propertyCount,
    activity:[{ date:d, type:"note", text:"Lead created from the Pricer (" + sp.loanType + " scenario)", author: currentUser().name }]
  };
  state.leads.unshift(lead);
  var addedDocs = applyRequiredDocs(id, { silent:true }) || [];
  if (addedDocs.length){
    lead.activity.push({ date:d, type:"document", text:"Required document checklist loaded (" + addedDocs.length + " item(s)) for " + lead.loanType, author:"System" });
  }
  if (lead.assignedTo && lead.assignedTo !== currentUser().id){
    notifyUser(lead.assignedTo, id, "hot-lead", "🔥 New lead: " + lead.name + " (" + lead.loanType + ") — open & dial: " + crmLeadLink(id));
    notifyLoNewLead(lead);
  }
  startAiEngagement(lead);
  ui.standalonePricer = null;
  ui.modal = null;
  showToast("Created " + lead.name + " from pricer scenario");
  ui.view = "detail"; ui.selectedLeadId = id; ui.activeTab = "scenario";
  persist();
}

var appEl = document.getElementById("app");

appEl.addEventListener("click", function(e){
  var backdrop = e.target.closest && e.target.closest("[data-action='backdrop']");
  if (backdrop && e.target === backdrop){ ui.modal = null; ui.dialer = null; render(); return; }

  var t = e.target.closest && e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;

  if (action === "nav"){
    ui.view = t.dataset.view;
    if (ui.view!=="detail") ui.selectedLeadId=null;
    if (ui.view==="ai-assistant" && ui.aiChatLog===undefined) loadAiChatHistory();
    render();
  }
  else if (action === "select-lead"){ ui.view="detail"; ui.selectedLeadId=t.dataset.lead; ui.activeTab="overview"; render(); }
  else if (action === "filter-lo-jump"){ ui.view="leads"; ui.leadFilter.assignedTo=t.dataset.lo; ui.leadFilter.status=""; render(); }
  else if (action === "set-tab"){
    ui.activeTab = t.dataset.tab;
    if (t.dataset.tab === "documents" && ui.selectedLeadId) applyRequiredDocs(ui.selectedLeadId, { silent:true });
    if (t.dataset.tab === "scenario" && ui.selectedLeadId) syncPricerRateToLead(ui.selectedLeadId);
    render();
  }
  else if (action === "open-modal"){ ui.modal = { type:t.dataset.modal, leadId:t.dataset.lead||null, kind:t.dataset.kind||null }; ui.teamMemberError = null; if (t.dataset.modal === "importLeads") ui.importState = null; render(); }
  else if (action === "close-modal"){ ui.modal = null; ui.importState = null; render(); }
  else if (action === "import-back"){ ui.importState = null; render(); }
  else if (action === "move-stage" && t.dataset.target){ moveStage(t.dataset.lead, t.dataset.target); }
  else if (action === "toggle-on-hold"){ toggleOnHold(t.dataset.lead); }
  else if (action === "delete-lead"){ deleteLead(t.dataset.lead, t.dataset.name); }
  else if (action === "resolve-review"){ resolveReview(t.dataset.lead); }
  else if (action === "open-team-chat"){ openChatWith(t.dataset.user); }
  else if (action === "toggle-email"){ ui.expandedEmailId = ui.expandedEmailId===t.dataset.id ? null : t.dataset.id; render(); }
  else if (action === "reply-email"){
    var replySrc = (state.emails||[]).find(function(x){ return x.id===t.dataset.id; });
    if (replySrc){
      ui.modal = {
        type:"composeEmail",
        to: replySrc.direction==="inbound" ? replySrc.fromAddress : replySrc.toAddress,
        subject: /^re:/i.test(replySrc.subject||"") ? replySrc.subject : ("Re: " + (replySrc.subject||"")),
        body: "",
        leadId: replySrc.leadId
      };
      render();
    }
  }
  else if (action === "toggle-automation-paused"){ toggleAutomationPaused(t.dataset.lead); }
  else if (action === "mark-doc-received"){ markDocReceived(t.dataset.lead, parseInt(t.dataset.idx,10)); }
  else if (action === "view-lead-document"){ viewLeadDocument(t.dataset.lead, parseInt(t.dataset.idx,10)); }
  else if (action === "view-uw-condition-file"){ viewUnderwritingConditionFile(t.dataset.lead, t.dataset.condid, t.dataset.borrower==="1"); }
  else if (action === "ai-review-doc"){ runAiDocReview(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "scan-all-documents"){ scanAllDocuments(t.dataset.lead); render(); }
  else if (action === "send-back-ai"){ sendBackToLOWithAiFindings(t.dataset.lead); render(); }
  else if (action === "clear-signature"){ clearSignaturePad(t.dataset.canvas); }
  else if (action === "run-guideline-check"){ runGuidelineCheck(t.dataset.lead); }
  else if (action === "dismiss-ai-flag"){ dismissAiFlag(t.dataset.lead, parseInt(t.dataset.idx,10)); render(); }
  else if (action === "toggle-processing"){ toggleProcessingAction(t.dataset.lead, t.dataset.kind); }
  else if (action === "toggle-language"){ toggleLanguage(t.dataset.lead); }
  else if (action === "request-third-party-doc"){ requestThirdPartyDoc(t.dataset.lead, t.dataset.role); }
  else if (action === "send-text-quo"){

    sendTextViaQuo(t.dataset.lead, textBox ? textBox.value : "");

  else if (action === "log-email"){ logEmailSent(t.dataset.lead); }

    sendApplicationAction(t.dataset.lead, t.dataset.channel);

    downloadMismoExport(t.dataset.lead);
  }

    viewTermSheet(t.dataset.lead);
  }

    previewDocumentPdf(t.dataset.lead, t.dataset.kind);

  }

  else if (action === "cancel-appointment"){ cancelAppointment(t.dataset.id); }

    var linkVal = t.dataset.link;
    var fallback = function(){ window.prompt("Couldn't copy automatically — select and copy this link:", linkVal); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(linkVal).then(function(){ showToast("Link copied"); }).catch(fallback);
    } else { fallback(); }
  }
  else if (action === "select-booking-day"){ ui.publicBooking.selectedDate = t.dataset.date; render(); }
  else if (action === "booking-back-to-days"){ ui.publicBooking.selectedDate = null; render(); }
  else if (action === "select-booking-slot"){ ui.publicBooking.selectedSlot = { start:t.dataset.start, end:t.dataset.end }; render(); }
  else if (action === "booking-back-to-slots"){ ui.publicBooking.selectedSlot = null; render(); }
  else if (action === "order-credit"){ logCreditOrder(t.dataset.lead); }
  else if (action === "send-borrower-portal"){ sendBorrowerPortalInvite(t.dataset.lead); }
  else if (action === "send-scheduling-link"){ sendSchedulingLink(t.dataset.lead); }
  else if (action === "print-scope-of-work"){ printScopeOfWork(t.dataset.lead); }
  else if (action === "preview-scope-of-work"){ previewScopeOfWork(t.dataset.lead); }
  else if (action === "send-term-sheet-from-pricer"){ applyPricerRateAndSendTermSheet(t.dataset.lead); }
  else if (action === "logout"){ logout(); }
  else if (action === "restart-tour"){ ui.view = "tour"; ui.tourStep = 0; render(); }
  else if (action === "reset-portal-customization"){ resetPortalCustomization(); }
  else if (action === "tour-next"){ ui.tourStep = (ui.tourStep||0)+1; render(); }
  else if (action === "tour-back"){ ui.tourStep = Math.max((ui.tourStep||0)-1,0); render(); }
  else if (action === "tour-skip" || action === "tour-finish"){ ui.view = "today"; render(); }

  else if (action === "dialer-skip"){ dialerAdvance(); }
  else if (action === "close-dialer"){ closeDialer(); }
  else if (action === "copy-app-link"){
    var linkBox = document.getElementById("app-link-box");
    if (linkBox){
      var lnk = linkBox.value;
      var okFn = function(){ showToast("Link copied"); };
      var failFn = function(){ linkBox.focus(); linkBox.select(); showToast("Couldn't auto-copy — link is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(lnk).then(okFn).catch(failFn);
      } else { failFn(); }
    }
  }
  else if (action === "copy-invite"){
    var inviteBox = document.getElementById("invite-message-box");
    if (inviteBox){
      var inviteText = inviteBox.value;
      var inviteDone = function(){ showToast("Message copied"); };
      var inviteFail = function(){ inviteBox.focus(); inviteBox.select(); showToast("Couldn't auto-copy — text is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(inviteText).then(inviteDone).catch(inviteFail);
      } else { inviteFail(); }
    }
  }
  else if (action === "copy-message"){
    var box = document.getElementById("text-message-box");
    if (box){
      var text = box.value;
      var done = function(){ showToast("Message copied"); };
      var fail = function(){ box.focus(); box.select(); showToast("Couldn't auto-copy — text is selected, press Ctrl/Cmd+C"); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(fail);
      } else { fail(); }
    }
  }
  else if (action === "ai-social-posts"){
    var loanTypeSel = document.getElementById("social-loantype-select");
    var socialBox = document.getElementById("social-post-box");
    var chosenType = loanTypeSel ? loanTypeSel.value : "DSCR";
    var rk3 = RATE_KEY_BY_LOAN_TYPE[chosenType];
    var rateContext = (rk3 && state.marketRates[rk3])
      ? (chosenType + " rates are currently " + fmtPct(state.marketRates[rk3].current) + " (previously " + fmtPct(state.marketRates[rk3].previous) + ")")
      : "";
    if (socialBox) socialBox.textContent = "Generating…";
    aiSuggest("social-post", { loanType: chosenType, rateContext: rateContext, count: 3 }, function(suggestion){
      if (socialBox) socialBox.textContent = suggestion || "Couldn't generate suggestions — try again.";
    });
  }
  else if (action === "ai-explain-guideline"){
    var expLead = leadById(t.dataset.lead);
    if (!expLead || !expLead.guidelineCheck) return;
    var expBox = document.getElementById("guideline-explain-box");
    if (expBox) expBox.textContent = "Generating…";
    aiSuggest("guideline-explain", {
      loanType: expLead.loanType,
      checks: expLead.guidelineCheck.checks
    }, function(suggestion){
      if (expBox) expBox.textContent = suggestion || "Couldn't generate an explanation — try again.";
    });
  }
  else if (action === "ai-draft-text"){
    var draftLead = leadById(t.dataset.lead);
    if (!draftLead) return;
    var draftBox = document.getElementById("text-message-box");
    if (draftBox) draftBox.value = "Generating…";
    var draftKind = isBirthdayToday(draftLead) ? "birthday" : "winback";
    var rk2 = RATE_KEY_BY_LOAN_TYPE[draftLead.loanType];
    var marketContext = (rk2 && state.marketRates[rk2]) ? (draftLead.loanType + " rates currently at " + fmtPct(state.marketRates[rk2].current)) : "";
    var wbInfo = winbackInfo(draftLead, startOfToday());
    aiSuggest(draftKind, {
      name: draftLead.name, loanType: draftLead.loanType, propertyAddress: draftLead.propertyAddress,
      daysSinceContact: wbInfo ? wbInfo.days : null,
      reason: wbInfo ? wbInfo.reasons.join("; ") : "",
      marketContext: marketContext,
      loName: userName(draftLead.assignedTo),
      language: draftLead.preferredLanguage === "es" ? "Spanish" : "English"
    }, function(suggestion){
      if (draftBox) draftBox.value = suggestion || defaultOutreachMessage(draftLead);
    });
  }
});
